<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DIGITALSMOD CHAT</title>
    <link rel="stylesheet" href="https://digitalsmod.42web.io/assets/css/style.css">
    <script src="https://digitalsmod.42web.io/assets/js/watermark.js"></script>
    <script src="https://digitalsmod.42web.io/assets/js/anti_leak.js"></script>
</head>
<body>
    <div class="tg-app">
        <!-- HEADER TELEGRAM -->
        <div class="tg-header">
            <button id="btnBack" style="display: none; background: none; border: none; color: #fff; font-size: 18px; cursor: pointer;">&larr;</button>
            <div class="tg-title" id="headerTitle">DIGITALSMOD</div>
            <button id="btnLogout" style="background: none; border: none; color: var(--text-muted); font-size: 13px; cursor: pointer;">Đăng xuất</button>
        </div>

        <!-- MÀN HÌNH 1: DANH SÁCH NHÓM CHAT -->
        <div id="groupListView" class="group-list"></div>
        <button id="btnCreateGroup" class="btn-create-group">+</button>

        <!-- MÀN HÌNH 2: KHUNG CHAT CHI TIẾT -->
        <div id="chatView" style="display: none; flex: 1; flex-direction: column;">
            <div class="chat-body" id="chatBody"></div>
            <div class="chat-footer">
                <input type="text" id="msgInput" class="chat-input" placeholder="Nhập tin nhắn..." autocomplete="off">
                <button id="sendBtn" class="btn-send">&gt;</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, onValue, set, off } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        const LOGIN_URL = 'https://digitalsmod.42web.io/login.php';

        // 1. FIX SESSION
        let sessionUser = null;
        try {
            const rawSession = localStorage.getItem('digitalsmod_user');
            if (rawSession) {
                sessionUser = JSON.parse(rawSession);
            }
        } catch (e) {
            console.error('[DIGITALSMOD CHAT] Lỗi parse session:', e);
        }

        if (!sessionUser || typeof sessionUser !== 'object') {
            console.warn('[DIGITALSMOD CHAT] Session không hợp lệ, chuyển hướng về login');
            window.location.href = LOGIN_URL;
            throw new Error('Redirecting to login...'); // Dừng thực thi script tiếp theo
        }

        // 2. FIX USER KEY SANITIZE
        function getUserKey() {
            const rawId = sessionUser.phone || sessionUser.providerId || 'admin';
            return String(rawId).replace(/[.#$\[\]\/]/g, "_");
        }

        const currentUserKey = getUserKey();

        // 3. FIX WATERMARK AN TOÀN
        if (typeof renderWatermark === 'function') {
            try {
                const phoneWatermark = sessionUser.phone || sessionUser.providerId || 'ADMIN';
                const nameWatermark = sessionUser.displayName || 'Khách';
                renderWatermark(phoneWatermark, nameWatermark, 'TG-MODE');
            } catch (e) {
                console.error('[DIGITALSMOD CHAT] Watermark error:', e);
            }
        }

        // 4. KHỞI TẠO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAUuV5euNNLHE2Cf6tXzUHV-ChKWFn593Y",
            authDomain: "quocdat-396fe.firebaseapp.com",
            databaseURL: "https://quocdat-396fe-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "quocdat-396fe"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // PHẦN TỬ GIAO DIỆN
        const groupListView = document.getElementById('groupListView');
        const chatView = document.getElementById('chatView');
        const btnCreateGroup = document.getElementById('btnCreateGroup');
        const btnBack = document.getElementById('btnBack');
        const btnLogout = document.getElementById('btnLogout');
        const headerTitle = document.getElementById('headerTitle');
        const chatBody = document.getElementById('chatBody');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');

        let currentGroupId = null;
        let unsubscribeMessages = null;

        // 5. FIX GROUP LIST (Chống XSS & An toàn dữ liệu)
        const groupsRef = ref(db, 'digitalsmod_groups');
        onValue(groupsRef, (snapshot) => {
            groupListView.innerHTML = '';

            if (!snapshot.exists()) {
                const emptyDiv = document.createElement('div');
                emptyDiv.style.cssText = 'text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 13px;';
                emptyDiv.textContent = 'Chưa có nhóm nào. Bấm nút (+) để tạo nhóm mới!';
                groupListView.appendChild(emptyDiv);
                return;
            }

            snapshot.forEach((childSnap) => {
                const gId = childSnap.key;
                const gData = childSnap.val() || {};

                const rawName = (gData.name && String(gData.name).trim()) ? String(gData.name).trim() : 'Nhóm';
                const isMember = gData.members && Boolean(gData.members[currentUserKey]);
                const isAdmin = sessionUser.role === 'admin';

                if (isMember || isAdmin) {
                    const item = document.createElement('div');
                    item.className = 'group-item';
                    item.onclick = () => openGroup(gId, rawName);

                    const avatar = document.createElement('div');
                    avatar.className = 'group-avatar';
                    avatar.textContent = rawName.charAt(0).toUpperCase();

                    const info = document.createElement('div');
                    info.className = 'group-info';

                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'group-name';
                    nameDiv.textContent = rawName;

                    if (isAdmin && !isMember) {
                        const ghostSpan = document.createElement('span');
                        ghostSpan.style.cssText = 'font-size:10px; color:#ef4444; margin-left: 5px;';
                        ghostSpan.textContent = '(Ghost Admin)';
                        nameDiv.appendChild(ghostSpan);
                    }

                    const lastMsg = document.createElement('div');
                    lastMsg.className = 'group-last-msg';
                    lastMsg.textContent = 'Bấm để vào phòng chat...';

                    info.appendChild(nameDiv);
                    info.appendChild(lastMsg);
                    item.appendChild(avatar);
                    item.appendChild(info);

                    groupListView.appendChild(item);
                }
            });
        }, (error) => {
            console.error('[DIGITALSMOD CHAT] Firebase error (groups):', error);
            if (error.code === 'PERMISSION_DENIED') {
                alert('Bạn không có quyền truy cập danh sách nhóm.');
            }
        });

        // 6. FIX CREATE GROUP (Kiểm tra & Validate dữ liệu)
        async function promptCreateGroup() {
            const inputName = prompt("Nhập tên nhóm chat mới:");
            if (inputName === null) return;

            const groupName = inputName.trim();
            if (!groupName) {
                alert("Tên nhóm không được để rỗng!");
                return;
            }

            if (groupName.length > 100) {
                alert("Tên nhóm quá dài! Tối đa 100 ký tự.");
                return;
            }

            try {
                const newGroupRef = push(ref(db, 'digitalsmod_groups'));
                const membersData = {};
                membersData[currentUserKey] = true;

                await set(newGroupRef, {
                    name: groupName,
                    createdBy: sessionUser.phone || 'admin',
                    createdAt: Date.now(),
                    members: membersData
                });

                console.log('[DIGITALSMOD CHAT] Group created successfully');
                alert("Đã tạo nhóm chat mới!");
            } catch (error) {
                console.error('[DIGITALSMOD CHAT] Firebase error (create group):', error);
                if (error.code === 'PERMISSION_DENIED') {
                    alert('Bạn không có quyền thực hiện thao tác này.');
                } else {
                    alert('Tạo nhóm thất bại: ' + error.message);
                }
            }
        }

        // 7. FIX CHAT LISTENER & OPEN GROUP (Hủy Listener cũ, Render Chống XSS)
        function openGroup(groupId, groupName) {
            if (!groupId) return;

            // Hủy listener cũ nếu có
            if (typeof unsubscribeMessages === 'function') {
                unsubscribeMessages();
                unsubscribeMessages = null;
                console.log('[DIGITALSMOD CHAT] Message listener removed');
            }

            currentGroupId = groupId;
            groupListView.style.display = 'none';
            btnCreateGroup.style.display = 'none';
            chatView.style.display = 'flex';
            btnBack.style.display = 'block';
            headerTitle.textContent = groupName;

            chatBody.innerHTML = '';

            const msgsRef = ref(db, `digitalsmod_group_messages/${groupId}`);
            
            const handleMessage = onChildAdded(msgsRef, (snapshot) => {
                const msg = snapshot.val();
                if (!msg || typeof msg !== 'object') return;
                if (!msg.content || !String(msg.content).trim()) return;

                const isMe = String(msg.senderId) === currentUserKey;

                const wrap = document.createElement('div');
                wrap.className = 'msg-wrapper ' + (isMe ? 'me' : 'others');

                if (!isMe) {
                    const sender = document.createElement('div');
                    sender.className = 'msg-sender';
                    sender.textContent = msg.senderName ? String(msg.senderName) : 'Người dùng';
                    wrap.appendChild(sender);
                }

                const bubble = document.createElement('div');
                bubble.className = 'msg-bubble';
                bubble.textContent = String(msg.content);

                const time = document.createElement('div');
                time.className = 'msg-time';
                const timeStamp = (typeof msg.createdAt === 'number') ? msg.createdAt : Date.now();
                time.textContent = new Date(timeStamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                bubble.appendChild(time);
                wrap.appendChild(bubble);
                chatBody.appendChild(wrap);
                chatBody.scrollTop = chatBody.scrollHeight;
            }, (error) => {
                console.error('[DIGITALSMOD CHAT] Firebase error (messages):', error);
                if (error.code === 'PERMISSION_DENIED') {
                    alert('Bạn không có quyền xem tin nhắn trong nhóm này.');
                }
            });

            // Lưu hàm unsubscribe
            unsubscribeMessages = () => off(msgsRef, 'child_added', handleMessage);
            console.log('[DIGITALSMOD CHAT] Message listener attached for group:', groupId);

            // Reset scroll
            setTimeout(() => { chatBody.scrollTop = chatBody.scrollHeight; }, 100);
        }

        // 8. FIX SHOW GROUP LIST
        function showGroupList() {
            if (typeof unsubscribeMessages === 'function') {
                unsubscribeMessages();
                unsubscribeMessages = null;
                console.log('[DIGITALSMOD CHAT] Message listener removed');
            }

            currentGroupId = null;
            groupListView.style.display = 'block';
            btnCreateGroup.style.display = 'flex';
            chatView.style.display = 'none';
            btnBack.style.display = 'none';
            headerTitle.textContent = 'DIGITALSMOD';
        }

        // 9. FIX SEND MESSAGE (Có hàm riêng, Validate, Không clear input khi lỗi)
        async function sendMessage() {
            if (!currentGroupId) return;

            const text = msgInput.value.trim();
            if (!text) return;

            if (text.length > 2000) {
                alert('Tin nhắn quá dài! Tối đa 2000 ký tự.');
                return;
            }

            const payload = {
                senderId: currentUserKey,
                senderName: sessionUser.displayName || 'Người dùng',
                content: text,
                createdAt: Date.now()
            };

            try {
                await push(ref(db, `digitalsmod_group_messages/${currentGroupId}`), payload);
                console.log('[DIGITALSMOD CHAT] Message sent');
                msgInput.value = ''; // Chỉ clear khi thành công
            } catch (error) {
                console.error('[DIGITALSMOD CHAT] Firebase error (send message):', error);
                if (error.code === 'PERMISSION_DENIED') {
                    alert('Bạn không có quyền gửi tin nhắn trong nhóm này.');
                } else {
                    alert('Gửi tin nhắn thất bại: ' + error.message);
                }
            }
        }

        // 10. EVENT LISTENERS
        btnCreateGroup.addEventListener('click', promptCreateGroup);
        btnBack.addEventListener('click', showGroupList);
        sendBtn.addEventListener('click', sendMessage);

        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 11. FIX LOGOUT
        function logout() {
            if (typeof unsubscribeMessages === 'function') {
                unsubscribeMessages();
                unsubscribeMessages = null;
            }
            localStorage.removeItem('digitalsmod_user');
            console.log('[DIGITALSMOD CHAT] Logged out');
            window.location.href = LOGIN_URL;
        }

        btnLogout.addEventListener('click', logout);
    </script>
</body>
</html>
