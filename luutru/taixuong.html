<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tải xuống File - Liquid Glass</title>
    <!-- Firebase Compat SDK v9 -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <style>
        :root {
            --bg-dark: #05050d;
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-shine: rgba(255, 255, 255, 0.35);
            --accent-glow: #007aff;
            --accent-cyan: #5ac8fa;
            --accent-purple: #af52de;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --text-muted: rgba(255, 255, 255, 0.4);
            --error: #ff453a;
            --success: #30d158;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Nền Liquid Mesh Gradient tương lai (iOS 26 Style) */
        .liquid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: var(--bg-dark);
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.6;
            border-radius: 50%;
            animation: float 18s ease-in-out infinite alternate;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #007aff 0%, #af52de 100%);
            animation-duration: 14s;
        }

        .blob-2 {
            bottom: -15%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #5ac8fa 0%, #5856d6 100%);
            animation-duration: 20s;
        }

        .blob-3 {
            top: 40%;
            left: 30%;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #ff2d55 0%, #5856d6 100%);
            opacity: 0.35;
            animation-duration: 16s;
        }

        @keyframes float {
            0% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
            50% { transform: translate(60px, -40px) scale(1.1) rotate(180deg); }
            100% { transform: translate(-40px, 50px) scale(0.95) rotate(360deg); }
        }

        /* Thẻ Glass Card */
        .container {
            width: 100%;
            max-width: 440px;
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-shine);
            border-left: 1px solid var(--glass-shine);
            border-radius: 32px;
            padding: 36px 28px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                inset 0 -1px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            z-index: 10;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Trạng thái thông báo / Empty State */
        .status-box {
            padding: 24px 16px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.5;
            display: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: fadeIn 0.4s ease;
        }

        .status-box.error {
            background: rgba(255, 69, 58, 0.12);
            color: #ff9f9a;
            border: 1px solid rgba(255, 69, 58, 0.3);
            display: block;
        }

        .status-box.info {
            background: rgba(0, 122, 255, 0.12);
            color: #70b5ff;
            border: 1px solid rgba(0, 122, 255, 0.3);
            display: block;
        }

        .empty-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            opacity: 0.7;
        }

        /* Thumbnail file */
        .thumb-wrapper {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0 auto 20px;
        }

        .file-thumbnail {
            width: 100%;
            height: 100%;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-shine);
            display: flex;
            align-items: center;
            justify-content: center;
            object-fit: cover;
            box-shadow: 0 12px 24px rgba(0,0,0,0.25);
        }

        .file-thumbnail svg {
            width: 48px;
            height: 48px;
            fill: url(#liquid-grad);
        }

        /* Tiêu đề & Mô tả */
        .file-name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            word-break: break-word;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.75) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .file-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 28px;
            line-height: 1.5;
            font-weight: 400;
        }

        /* Lưới thông tin */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 18px;
            border-radius: 22px;
            margin-bottom: 28px;
            text-align: left;
        }

        .info-item label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .info-item span {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Nút Tải Xuống Liquid Button */
        .download-btn {
            position: relative;
            width: 100%;
            padding: 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: linear-gradient(135deg, rgba(0, 122, 255, 0.85) 0%, rgba(175, 82, 222, 0.85) 100%);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 
                0 10px 25px rgba(0, 122, 255, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .download-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s ease;
        }

        .download-btn:hover::before {
            left: 100%;
        }

        .download-btn:active {
            transform: scale(0.97);
            box-shadow: 0 5px 15px rgba(0, 122, 255, 0.3);
        }

        .download-btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Thanh tiến trình Progress Bar */
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--success));
            border-radius: 10px;
            transition: width 0.3s ease;
            box-shadow: 0 0 12px var(--success);
        }

        /* Spinner animation */
        .spinner {
            border: 2.5px solid rgba(255,255,255,0.2);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border-left-color: #ffffff;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<!-- Liquid Mesh Background -->
<div class="liquid-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<div class="container">
    <!-- SVG Gradient Definition -->
    <svg width="0" height="0" style="position:absolute;">
        <linearGradient id="liquid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#007aff" />
            <stop offset="100%" stop-color="#af52de" />
        </linearGradient>
    </svg>

    <!-- Box hiển thị thông báo lỗi/trạng thái -->
    <div id="statusBox" class="status-box"></div>

    <!-- Nội dung tải file chính -->
    <div id="mainContent" style="display: none;">
        <div class="thumb-wrapper">
            <div class="file-thumbnail" id="defaultThumb">
                <svg viewBox="0 0 24 24"><path d="M13,9V3.5L18.5,9M6,2C4.89,2 4,2.89 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2H6Z"/></svg>
            </div>
            <img id="imageThumb" class="file-thumbnail" style="display:none;" alt="Thumbnail">
        </div>

        <h1 class="file-name" id="fileName">Tên file...</h1>
        <p class="file-desc" id="fileDesc">Mô tả file...</p>

        <div class="info-grid">
            <div class="info-item">
                <label>Dung lượng</label>
                <span id="fileSize">--</span>
            </div>
            <div class="info-item">
                <label>Định dạng</label>
                <span id="fileType">--</span>
            </div>
            <div class="info-item">
                <label>Ngày đăng</label>
                <span id="fileDate">--</span>
            </div>
            <div class="info-item">
                <label>Lượt tải</label>
                <span id="fileDownloads">0</span>
            </div>
        </div>

        <button class="download-btn" id="downloadBtn" onclick="handleDownload()">
            <span>TẢI XUỐNG</span>
        </button>

        <div class="progress-bar-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>
</div>

<script>
    // 1. Cấu hình Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAUuV5euNNLHE2Cf6tXzUHV-ChKwNF593Y",
      authDomain: "quocdat-396fe.firebaseapp.com",
      databaseURL: "https://quocdat-396fe-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "quocdat-396fe",
      storageBucket: "quocdat-396fe.firebasestorage.app",
      messagingSenderId: "685476439350",
      appId: "1:685476439350:web:949054ecba7f0a0c383f97"
    };

    // 2. Khởi tạo duy nhất Firebase Compat SDK
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const storage = firebase.storage();

    let currentFileData = null;
    let currentFileId = null;

    function formatBytes(bytes, decimals = 2) {
        if (!bytes || bytes === 0) return '0 Bytes';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function showStatus(msg, type = 'info', isEmptyState = false) {
        const box = document.getElementById('statusBox');
        box.className = `status-box ${type}`;
        
        if (isEmptyState) {
            box.innerHTML = `
                <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
                </svg>
                <div style="font-weight: 600; font-size: 16px; margin-bottom: 6px; color: #ffffff;">Không thể tải trang</div>
                <div>${msg}</div>
            `;
        } else {
            box.innerText = msg;
        }
    }

    function hideStatus() {
        document.getElementById('statusBox').style.display = 'none';
    }

    async function initPage() {
        showStatus('Đang kết nối hệ thống...', 'info');
        const urlParams = new URLSearchParams(window.location.search);
        currentFileId = urlParams.get('id');

        // KIỂM TRA: Nếu không có ID trên URL -> Hiện giao diện "chưa upload file nào"
        if (!currentFileId || currentFileId.trim() === '') {
            showStatus('Trang này hiện tại chưa được tải lên file nào hoặc đường dẫn không hợp lệ.', 'error', true);
            return;
        }

        try {
            const docRef = db.collection('downloads').doc(currentFileId);
            const docSnap = await docRef.get();

            if (!docSnap.exists) {
                showStatus('File không tồn tại hoặc đã bị xóa khỏi hệ thống.', 'error', true);
                return;
            }

            currentFileData = docSnap.data();

            if (currentFileData.enabled === false) {
                showStatus('File này hiện đang bị tạm khóa tải xuống.', 'error', true);
                return;
            }

            // Render dữ liệu file ra giao diện
            document.getElementById('fileName').innerText = currentFileData.name || 'File không tên';
            document.getElementById('fileDesc').innerText = currentFileData.description || 'Không có mô tả cho file này.';
            document.getElementById('fileSize').innerText = formatBytes(currentFileData.size || 0);
            document.getElementById('fileType').innerText = currentFileData.type ? (currentFileData.type.split('/')[1] || currentFileData.type).toUpperCase() : 'N/A';
            
            if (currentFileData.createdAt) {
                const date = currentFileData.createdAt.toDate ? currentFileData.createdAt.toDate() : new Date(currentFileData.createdAt);
                document.getElementById('fileDate').innerText = date.toLocaleDateString('vi-VN');
            }
            document.getElementById('fileDownloads').innerText = currentFileData.downloadCount || 0;

            if (currentFileData.thumbnail) {
                const imgThumb = document.getElementById('imageThumb');
                imgThumb.src = currentFileData.thumbnail;
                imgThumb.style.display = 'block';
                document.getElementById('defaultThumb').style.display = 'none';
            }

            hideStatus();
            document.getElementById('mainContent').style.display = 'block';

        } catch (err) {
            console.error("Lỗi Firestore:", err);
            showStatus('Không thể kết nối đến máy chủ. Vui lòng thử lại sau.', 'error', true);
        }
    }

    async function handleDownload() {
        const btn = document.getElementById('downloadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');

        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span> <span>Đang chuẩn bị file...</span>`;

        try {
            // Lấy URL từ Firebase Storage
            const storageRef = storage.ref(currentFileData.storagePath);
            const downloadUrl = await storageRef.getDownloadURL();

            // Tăng downloadCount bằng Transaction an toàn
            const docRef = db.collection('downloads').doc(currentFileId);
            db.runTransaction(async (transaction) => {
                const sfDoc = await transaction.get(docRef);
                if (sfDoc.exists) {
                    const newCount = (sfDoc.data().downloadCount || 0) + 1;
                    transaction.update(docRef, { downloadCount: newCount });
                }
            }).then(() => {
                const currentCount = parseInt(document.getElementById('fileDownloads').innerText) || 0;
                document.getElementById('fileDownloads').innerText = currentCount + 1;
            }).catch(err => console.error("Lỗi cập nhật lượt tải:", err));

            btn.innerHTML = `<span>Đang tải xuống...</span>`;
            progressContainer.style.display = 'block';
            progressBar.style.width = '20%';

            // Xử lý Tải File trực tiếp qua Blob
            const xhr = new XMLHttpRequest();
            xhr.open('GET', downloadUrl, true);
            xhr.responseType = 'blob';

            xhr.onprogress = function (e) {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = percent + '%';
                }
            };

            xhr.onload = function () {
                if (xhr.status === 200) {
                    const blob = xhr.response;
                    const a = document.createElement('a');
                    const url = window.URL.createObjectURL(blob);
                    a.href = url;
                    a.download = currentFileData.name;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    a.remove();

                    btn.disabled = false;
                    btn.innerHTML = `<span>TẢI XUỐNG</span>`;
                    setTimeout(() => { progressContainer.style.display = 'none'; progressBar.style.width = '0%'; }, 2000);
                } else {
                    fallbackDirectDownload(downloadUrl);
                }
            };

            xhr.onerror = function () {
                fallbackDirectDownload(downloadUrl);
            };

            xhr.send();

        } catch (err) {
            console.error(err);
            alert("Đã xảy ra lỗi khi tạo đường dẫn tải xuống!");
            btn.disabled = false;
            btn.innerHTML = `<span>TẢI XUỐNG</span>`;
        }
    }

    function fallbackDirectDownload(url) {
        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.download = currentFileData.name;
        document.body.appendChild(a);
        a.click();
        a.remove();

        const btn = document.getElementById('downloadBtn');
        btn.disabled = false;
        btn.innerHTML = `<span>TẢI XUỐNG</span>`;
    }

    window.onload = initPage;
</script>
</body>
</html>
