<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải xuống File</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --error: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1e293b, var(--bg-color));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .status-box {
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .status-box.error { background: rgba(239, 68, 68, 0.1); color: var(--error); border: 1px solid rgba(239, 68, 68, 0.2); display: block; }
        .status-box.info { background: rgba(59, 130, 246, 0.1); color: var(--primary); border: 1px solid rgba(59, 130, 246, 0.2); display: block; }

        .file-thumbnail {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            object-fit: cover;
            border: 1px solid var(--card-border);
        }
        .file-thumbnail svg {
            width: 40px;
            height: 40px;
            fill: var(--primary);
        }

        .file-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .file-desc {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            background: rgba(0, 0, 0, 0.2);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 24px;
            text-align: left;
        }

        .info-item label {
            display: block;
            font-size: 11px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .info-item span {
            font-size: 13px;
            font-weight: 600;
        }

        .download-btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .download-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .download-btn:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 16px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--success);
            transition: width 0.3s ease;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border-left-color: white;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="statusBox" class="status-box"></div>

    <div id="mainContent" style="display: none;">
        <div id="thumbContainer">
            <div class="file-thumbnail" id="defaultThumb">
                <svg viewBox="0 0 24 24"><path d="M13,9V3.5L18.5,9M6,2C4.89,2 4,2.89 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2H6Z"/></svg>
            </div>
            <img id="imageThumb" class="file-thumbnail" style="display:none;" alt="Thumbnail">
        </div>

        <h1 class="file-name" id="fileName">Tên file...</h1>
        <p class="file-desc" id="fileDesc">Mô tả file...</p>

        <div class="info-grid">
            <div class="info-item">
                <label>Dung lượng</label>
                <span id="fileSize">--</span>
            </div>
            <div class="info-item">
                <label>Định dạng</label>
                <span id="fileType">--</span>
            </div>
            <div class="info-item">
                <label>Ngày đăng</label>
                <span id="fileDate">--</span>
            </div>
            <div class="info-item">
                <label>Lượt tải</label>
                <span id="fileDownloads">0</span>
            </div>
        </div>

        <button class="download-btn" id="downloadBtn" onclick="handleDownload()">
            <span>TẢI XUỐNG</span>
        </button>

        <div class="progress-bar-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>
</div>

<script>
    // Config Firebase của bạn (Dữ nguyên cấu hình sẵn có)
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyAUuV5euNNLHE2Cf6tXzUHV-ChKwNF593Y",
  authDomain: "quocdat-396fe.firebaseapp.com",
  databaseURL: "https://quocdat-396fe-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "quocdat-396fe",
  storageBucket: "quocdat-396fe.firebasestorage.app",
  messagingSenderId: "685476439350",
  appId: "1:685476439350:web:949054ecba7f0a0c383f97"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);

    // Khởi tạo Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const storage = firebase.storage();

    let currentFileData = null;
    let currentFileId = null;

    function formatBytes(bytes, decimals = 2) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function showStatus(msg, type = 'info') {
        const box = document.getElementById('statusBox');
        box.className = `status-box ${type}`;
        box.innerText = msg;
    }

    function hideStatus() {
        document.getElementById('statusBox').style.display = 'none';
    }

    async function initPage() {
        showStatus('Đang tải thông tin file...', 'info');
        const urlParams = new URLSearchParams(window.location.search);
        currentFileId = urlParams.get('id');

        if (!currentFileId) {
            showStatus('Đường dẫn tải xuống không hợp lệ.', 'error');
            return;
        }

        try {
            const docRef = db.collection('downloads').doc(currentFileId);
            const docSnap = await docRef.get();

            if (!docSnap.exists) {
                showStatus('Không tìm thấy file.', 'error');
                return;
            }

            currentFileData = docSnap.data();

            if (currentFileData.enabled === false) {
                showStatus('File hiện đang tạm khóa tải xuống.', 'error');
                return;
            }

            // Render giao diện
            document.getElementById('fileName').innerText = currentFileData.name || 'File không tên';
            document.getElementById('fileDesc').innerText = currentFileData.description || 'Không có mô tả.';
            document.getElementById('fileSize').innerText = formatBytes(currentFileData.size || 0);
            document.getElementById('fileType').innerText = currentFileData.type ? currentFileData.type.split('/')[1] || currentFileData.type : 'N/A';
            
            if (currentFileData.createdAt) {
                const date = currentFileData.createdAt.toDate ? currentFileData.createdAt.toDate() : new Date(currentFileData.createdAt);
                document.getElementById('fileDate').innerText = date.toLocaleDateString('vi-VN');
            }
            document.getElementById('fileDownloads').innerText = currentFileData.downloadCount || 0;

            if (currentFileData.thumbnail) {
                const imgThumb = document.getElementById('imageThumb');
                imgThumb.src = currentFileData.thumbnail;
                imgThumb.style.display = 'block';
                document.getElementById('defaultThumb').style.display = 'none';
            }

            hideStatus();
            document.getElementById('mainContent').style.display = 'block';

        } catch (err) {
            console.error(err);
            showStatus('Không thể kết nối đến hệ thống. Vui lòng thử lại.', 'error');
        }
    }

    async function handleDownload() {
        const btn = document.getElementById('downloadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');

        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span> <span>Đang chuẩn bị file...</span>`;

        try {
            // Lấy URL tải từ Storage
            const storageRef = storage.ref(currentFileData.storagePath);
            const downloadUrl = await storageRef.getDownloadURL();

            // Tăng downloadCount bằng Firestore Transaction để tránh race condition
            const docRef = db.collection('downloads').doc(currentFileId);
            db.runTransaction(async (transaction) => {
                const sfDoc = await transaction.get(docRef);
                if (sfDoc.exists) {
                    const newCount = (sfDoc.data().downloadCount || 0) + 1;
                    transaction.update(docRef, { downloadCount: newCount });
                }
            }).then(() => {
                const currentCount = parseInt(document.getElementById('fileDownloads').innerText);
                document.getElementById('fileDownloads').innerText = currentCount + 1;
            }).catch(err => console.error("Lỗi cập nhật lượt tải:", err));

            btn.innerHTML = `<span>Đang tải xuống...</span>`;
            progressContainer.style.display = 'block';
            progressBar.style.width = '30%';

            // Xử lý Tải File trực tiếp
            const xhr = new XMLHttpRequest();
            xhr.open('GET', downloadUrl, true);
            xhr.responseType = 'blob';

            xhr.onprogress = function (e) {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = percent + '%';
                }
            };

            xhr.onload = function () {
                if (xhr.status === 200) {
                    const blob = xhr.response;
                    const a = document.createElement('a');
                    const url = window.URL.createObjectURL(blob);
                    a.href = url;
                    a.download = currentFileData.name;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    a.remove();

                    btn.disabled = false;
                    btn.innerHTML = `<span>TẢI XUỐNG</span>`;
                    setTimeout(() => { progressContainer.style.display = 'none'; progressBar.style.width = '0%'; }, 2000);
                } else {
                    fallbackDirectDownload(downloadUrl);
                }
            };

            xhr.onerror = function () {
                fallbackDirectDownload(downloadUrl);
            };

            xhr.send();

        } catch (err) {
            console.error(err);
            alert("Đã xảy ra lỗi khi tạo đường dẫn tải xuống!");
            btn.disabled = false;
            btn.innerHTML = `<span>TẢI XUỐNG</span>`;
        }
    }

    function fallbackDirectDownload(url) {
        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.download = currentFileData.name;
        document.body.appendChild(a);
        a.click();
        a.remove();

        const btn = document.getElementById('downloadBtn');
        btn.disabled = false;
        btn.innerHTML = `<span>TẢI XUỐNG</span>`;
    }

    window.onload = initPage;
</script>
</body>
</html>
