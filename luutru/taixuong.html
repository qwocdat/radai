<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tải xuống File - Samsung S23 Ultra Storage</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-dark: #05050d;
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-shine: rgba(255, 255, 255, 0.35);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --text-muted: rgba(255, 255, 255, 0.4);
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark); color: var(--text-primary);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px; overflow-x: hidden; position: relative;
        }

        .liquid-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            overflow: hidden; background: var(--bg-dark);
        }

        .blob {
            position: absolute; filter: blur(80px); opacity: 0.6; border-radius: 50%;
            animation: float 18s ease-in-out infinite alternate;
        }
        .blob-1 { top: -10%; left: -10%; width: 350px; height: 350px; background: radial-gradient(circle, #007aff 0%, #af52de 100%); }
        .blob-2 { bottom: -15%; right: -10%; width: 400px; height: 400px; background: radial-gradient(circle, #5ac8fa 0%, #5856d6 100%); }

        @keyframes float {
            0% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
            50% { transform: translate(60px, -40px) scale(1.1) rotate(180deg); }
            100% { transform: translate(-40px, 50px) scale(0.95) rotate(360deg); }
        }

        .container {
            width: 100%; max-width: 440px;
            background: var(--glass-bg); backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-shine);
            border-radius: 32px; padding: 36px 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4); text-align: center;
        }

        .status-box { padding: 24px 16px; border-radius: 20px; font-size: 15px; display: none; }
        .status-box.error { background: rgba(255, 69, 58, 0.12); color: #ff9f9a; border: 1px solid rgba(255, 69, 58, 0.3); display: block; }
        .status-box.info { background: rgba(0, 122, 255, 0.12); color: #70b5ff; border: 1px solid rgba(0, 122, 255, 0.3); display: block; }

        .thumb-wrapper { width: 96px; height: 96px; margin: 0 auto 20px; }
        .file-thumbnail {
            width: 100%; height: 100%; border-radius: 24px;
            background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-shine);
            display: flex; align-items: center; justify-content: center; object-fit: cover;
        }
        .file-thumbnail svg { width: 48px; height: 48px; fill: url(#liquid-grad); }

        .file-name {
            font-size: 22px; font-weight: 700; margin-bottom: 10px; word-break: break-word;
            background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.75) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .file-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 28px; line-height: 1.5; }

        .info-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
            background: rgba(0, 0, 0, 0.25); padding: 18px; border-radius: 22px; margin-bottom: 28px; text-align: left;
        }
        .info-item label { display: block; font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .info-item span { font-size: 14px; font-weight: 600; color: var(--text-primary); }

        .download-btn {
            width: 100%; padding: 18px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.3);
            background: linear-gradient(135deg, rgba(0, 122, 255, 0.85) 0%, rgba(175, 82, 222, 0.85) 100%);
            color: white; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .download-btn:active { transform: scale(0.97); }

        .spinner {
            border: 2.5px solid rgba(255,255,255,0.2); width: 20px; height: 20px;
            border-radius: 50%; border-left-color: #ffffff; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="liquid-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
</div>

<div class="container">
    <svg width="0" height="0" style="position:absolute;">
        <linearGradient id="liquid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#007aff" />
            <stop offset="100%" stop-color="#af52de" />
        </linearGradient>
    </svg>

    <div id="statusBox" class="status-box"></div>

    <div id="mainContent" style="display: none;">
        <div class="thumb-wrapper">
            <div class="file-thumbnail" id="defaultThumb">
                <svg viewBox="0 0 24 24"><path d="M13,9V3.5L18.5,9M6,2C4.89,2 4,2.89 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2H6Z"/></svg>
            </div>
            <img id="imageThumb" class="file-thumbnail" style="display:none;" alt="Thumbnail">
        </div>

        <h1 class="file-name" id="fileName">Tên file...</h1>
        <p class="file-desc" id="fileDesc">Mô tả file...</p>

        <div class="info-grid">
            <div class="info-item">
                <label>Dung lượng</label>
                <span id="fileSize">--</span>
            </div>
            <div class="info-item">
                <label>Nguồn lưu trữ</label>
                <span style="color: #38bdf8; font-weight: 700;">Samsung S23 Ultra</span>
            </div>
            <div class="info-item">
                <label>Ngày đăng</label>
                <span id="fileDate">--</span>
            </div>
            <div class="info-item">
                <label>Lượt tải</label>
                <span id="fileDownloads">0</span>
            </div>
        </div>

        <button class="download-btn" id="downloadBtn" onclick="handleDownload()">
            <span>TẢI XUỐNG</span>
        </button>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAUuV5euNNLHE2Cf6tXzUHV-ChKwNF593Y",
      authDomain: "quocdat-396fe.firebaseapp.com",
      databaseURL: "https://quocdat-396fe-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "quocdat-396fe",
      storageBucket: "quocdat-396fe.firebasestorage.app",
      messagingSenderId: "685476439350",
      appId: "1:685476439350:web:949054ecba7f0a0c383f97"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentFileData = null;
    let currentFileId = null;

    function formatBytes(bytes) {
        if (!bytes || bytes === 0) return 'Dung lượng không xác định';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function showStatus(msg, type = 'info', isEmpty = false) {
        const box = document.getElementById('statusBox');
        box.className = `status-box ${type}`;
        box.innerHTML = isEmpty ? `<div style="font-weight: 600; font-size: 16px; margin-bottom: 6px; color: #ffffff;">Không tìm thấy file</div><div>${msg}</div>` : msg;
    }

    async function initPage() {
        showStatus('Đang kết nối hệ thống...', 'info');
        const urlParams = new URLSearchParams(window.location.search);
        currentFileId = urlParams.get('id');

        if (!currentFileId || currentFileId.trim() === '') {
            showStatus('Trang này hiện tại chưa được tải lên file nào hoặc đường dẫn không hợp lệ.', 'error', true);
            return;
        }

        try {
            const docRef = db.collection('downloads').doc(currentFileId);
            const docSnap = await docRef.get();

            if (!docSnap.exists) {
                showStatus('File không tồn tại hoặc đã bị xóa khỏi hệ thống.', 'error', true);
                return;
            }

            currentFileData = docSnap.data();

            if (currentFileData.enabled === false) {
                showStatus('File này hiện đang bị tạm khóa tải xuống.', 'error', true);
                return;
            }

            document.getElementById('fileName').innerText = currentFileData.name || 'File tải xuống';
            document.getElementById('fileDesc').innerText = currentFileData.description || 'Không có mô tả.';
            document.getElementById('fileSize').innerText = formatBytes(currentFileData.size || 0);

            if (currentFileData.createdAt) {
                const date = currentFileData.createdAt.toDate ? currentFileData.createdAt.toDate() : new Date(currentFileData.createdAt);
                document.getElementById('fileDate').innerText = date.toLocaleDateString('vi-VN');
            }
            document.getElementById('fileDownloads').innerText = currentFileData.downloadCount || 0;

            if (currentFileData.thumbnail) {
                const imgThumb = document.getElementById('imageThumb');
                imgThumb.src = currentFileData.thumbnail;
                imgThumb.style.display = 'block';
                document.getElementById('defaultThumb').style.display = 'none';
            }

            document.getElementById('statusBox').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';

        } catch (err) {
            showStatus('Lỗi kết nối máy chủ.', 'error', true);
        }
    }

    async function handleDownload() {
        const btn = document.getElementById('downloadBtn');
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span> <span>Đang bắt đầu tải...</span>`;

        try {
            // Tăng lượt tải an toàn qua Firestore Transaction
            const docRef = db.collection('downloads').doc(currentFileId);
            db.runTransaction(async (transaction) => {
                const sfDoc = await transaction.get(docRef);
                if (sfDoc.exists) {
                    const newCount = (sfDoc.data().downloadCount || 0) + 1;
                    transaction.update(docRef, { downloadCount: newCount });
                }
            }).then(() => {
                const currentCount = parseInt(document.getElementById('fileDownloads').innerText) || 0;
                document.getElementById('fileDownloads').innerText = currentCount + 1;
            }).catch(e => console.error(e));

            let downloadUrl = currentFileData.storagePath;

            // Đảm bảo chuẩn hóa đuôi dl=1 cho Dropbox
            if (downloadUrl.includes('dropbox.com')) {
                downloadUrl = downloadUrl.replace('dl=0', 'dl=1');
                if (!downloadUrl.includes('dl=1')) {
                    downloadUrl += (downloadUrl.includes('?') ? '&' : '?') + 'dl=1';
                }
            }

            // Kích hoạt luồng tải ngầm không chuyển trang
            let hiddenIframe = document.getElementById('dl_iframe');
            if (!hiddenIframe) {
                hiddenIframe = document.createElement('iframe');
                hiddenIframe.id = 'dl_iframe';
                hiddenIframe.style.display = 'none';
                document.body.appendChild(hiddenIframe);
            }
            hiddenIframe.src = downloadUrl;

            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = `<span>TẢI XUỐNG</span>`;
            }, 3000);

        } catch (err) {
            alert("Không thể tải file!");
            btn.disabled = false;
            btn.innerHTML = `<span>TẢI XUỐNG</span>`;
        }
    }

    window.onload = initPage;
</script>
</body>
</html>
