<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Glowmax Dashboard - API Configuration</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-color: #050507;
            --glass-bg: rgba(18, 18, 22, 0.70);
            --glass-card: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.12);
            --accent-color: #0A84FF;
            --accent-glow: rgba(10, 132, 255, 0.35);
            --accent-hover: #0070E0;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-tertiary: rgba(255, 255, 255, 0.35);
            --danger-color: #FF453A;
            --success-color: #30D158;
            --warning-color: #FFD60A;
            --radius-large: 28px;
            --radius-medium: 20px;
            --radius-small: 14px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 16px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 60vh;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(5, 5, 7, 0) 70%);
            z-index: -2;
            pointer-events: none;
            opacity: 0.6;
        }

        .main-wrapper {
            width: 100%;
            max-width: 520px;
        }

        .glass-panel {
            background: var(--glass-bg);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            backdrop-filter: blur(30px) saturate(190%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-large);
            padding: 28px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 1px var(--glass-highlight);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--accent-color), #5856D6);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .brand-logo-icon svg {
            width: 16px;
            height: 16px;
            fill: #fff;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.3px;
            text-transform: uppercase;
            color: #fff;
        }

        .glass-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-medium);
            padding: 20px;
            margin-bottom: 20px;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            margin-bottom: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-tertiary);
        }

        .status-dot.active {
            background: var(--success-color);
            box-shadow: 0 0 10px var(--success-color);
        }

        .status-dot.inactive {
            background: var(--danger-color);
            box-shadow: 0 0 10px var(--danger-color);
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-small);
            padding: 14px 16px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        .input-actions {
            position: absolute;
            right: 10px;
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        button.primary-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(180deg, var(--accent-color) 0%, var(--accent-hover) 100%);
            color: #fff;
            border: none;
            border-radius: var(--radius-medium);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 24px var(--accent-glow);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 8px;
        }

        button.primary-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px var(--accent-glow);
        }

        .meta-info {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 12px;
            text-align: center;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(22, 22, 28, 0.95);
            border: 1px solid var(--glass-border);
            padding: 12px 24px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="glass-panel">
        <div class="header-bar">
            <div class="brand-title">
                <div class="brand-logo-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <span class="brand-name">Glowmax Dashboard</span>
            </div>
        </div>

        <div class="glass-card">
            <div class="status-indicator">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Đang kết nối Firestore...</span>
            </div>

            <div style="margin-bottom: 16px;">
                <label for="apiKeyInput">Gemini API Key</label>
                <div class="input-group">
                    <input type="password" id="apiKeyInput" placeholder="Nhập API Key tại đây..." autocomplete="off">
                    <div class="input-actions">
                        <button type="button" class="icon-btn" id="toggleVisibility" title="Hiện/Ẩn">👁</button>
                        <button type="button" class="icon-btn" id="copyKey" title="Sao chép">📋</button>
                    </div>
                </div>
            </div>

            <button type="button" class="primary-btn" id="saveBtn">Lưu API Key</button>
            <div class="meta-info" id="metaInfo">Cập nhật cuối: Chưa có dữ liệu</div>
        </div>
    </div>
</div>

<div class="toast" id="toastMessage">Thành công!</div>

<!-- Firebase SDK Modular CDN -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDummyKeyForInitializationOnly-ReplaceIfCustom",
        authDomain: "quocdat-396fe.firebaseapp.com",
        projectId: "quocdat-396fe",
        storageBucket: "quocdat-396fe.appspot.com",
        messagingSenderId: "38927491028",
        appId: "1:38927491028:web:abcdef123456789"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const configRef = doc(db, "glowmax", "config", "api", "keyDoc"); // Đường dẫn Firestore cấu trúc yêu cầu

    let rawApiKey = "";
    let isMasked = true;

    const inputEl = document.getElementById('apiKeyInput');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const metaInfo = document.getElementById('metaInfo');
    const saveBtn = document.getElementById('saveBtn');

    function showToast(msg) {
        const toast = document.getElementById('toastMessage');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Lắng nghe dữ liệu realtime từ Firestore
    onSnapshot(configRef, (docSnap) => {
        if (docSnap.exists()) {
            const data = docSnap.data();
            rawApiKey = data.apiKey || "";
            if (rawApiKey) {
                statusDot.className = "status-dot active";
                statusText.innerText = "● API đang hoạt động";
                inputEl.value = "••••••••••••••••••";
                isMasked = true;
            } else {
                statusDot.className = "status-dot inactive";
                statusText.innerText = "● Chưa cấu hình API";
                inputEl.value = "";
            }
            if (data.updatedAt) {
                const date = data.updatedAt.toDate ? data.updatedAt.toDate() : new Date();
                metaInfo.innerText = "Cập nhật cuối: " + date.toLocaleString('vi-VN');
            }
        } else {
            statusDot.className = "status-dot inactive";
            statusText.innerText = "● Chưa cấu hình API";
            metaInfo.innerText = "Cập nhật cuối: Chưa có dữ liệu";
        }
    }, (error) => {
        console.error("Firestore Error:", error);
        statusDot.className = "status-dot inactive";
        statusText.innerText = "Lỗi kết nối cơ sở dữ liệu";
    });

    // Toggle Hiện/Ẩn API Key
    document.getElementById('toggleVisibility').addEventListener('click', () => {
        if (!rawApiKey) return;
        isMasked = !isMasked;
        inputEl.value = isMasked ? "••••••••••••••••••" : rawApiKey;
    });

    // Copy API Key
    document.getElementById('copyKey').addEventListener('click', () => {
        if (!rawApiKey) {
            showToast("Không có API Key để sao chép!");
            return;
        }
        navigator.clipboard.writeText(rawApiKey).then(() => {
            showToast("Đã sao chép API Key vào clipboard!");
        });
    });

    // Lưu API Key lên Firestore
    saveBtn.addEventListener('click', async () => {
        const val = inputEl.value.trim();
        if (!val || val.includes("••••")) {
            if (!rawApiKey) {
                alert("Vui lòng nhập API Key hợp lệ!");
                return;
            }
        }
        
        const keyToSave = (val.includes("••••")) ? rawApiKey : val;
        if (!keyToSave) {
            alert("API Key không được để trống!");
            return;
        }

        saveBtn.disabled = true;
        saveBtn.innerText = "Đang lưu...";

        try {
            await setDoc(configRef, {
                apiKey: keyToSave,
                updatedAt: serverTimestamp(),
                enabled: true
            }, { merge: true });

            showToast("Lưu API Key thành công!");
            rawApiKey = keyToSave;
            inputEl.value = "••••••••••••••••••";
            isMasked = true;
        } catch (err) {
            console.error(err);
            alert("Lỗi khi lưu: " + err.message);
        } finally {
            saveBtn.disabled = false;
            saveBtn.innerText = "Lưu API Key";
        }
    });
</script>

</body>
</html>
