<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Glowmax Dashboard - API Configuration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-color: #050507;
            --glass-bg: rgba(18, 18, 22, 0.70);
            --glass-card: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.12);
            --accent-color: #0A84FF;
            --accent-glow: rgba(10, 132, 255, 0.35);
            --accent-hover: #0070E0;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-tertiary: rgba(255, 255, 255, 0.35);
            --danger-color: #FF453A;
            --success-color: #30D158;
            --warning-color: #FFD60A;
            --radius-large: 28px;
            --radius-medium: 20px;
            --radius-small: 14px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 16px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 60vh;
            background: radial-gradient(
                circle,
                var(--accent-glow) 0%,
                rgba(5, 5, 7, 0) 70%
            );
            z-index: -2;
            pointer-events: none;
            opacity: 0.6;
        }

        .main-wrapper {
            width: 100%;
            max-width: 520px;
        }

        .glass-panel {
            background: var(--glass-bg);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            backdrop-filter: blur(30px) saturate(190%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-large);
            padding: 28px 24px;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.6),
                inset 0 1px 1px var(--glass-highlight);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(
                135deg,
                var(--accent-color),
                #5856D6
            );
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .brand-logo-icon svg {
            width: 16px;
            height: 16px;
            fill: #fff;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.3px;
            text-transform: uppercase;
            color: #fff;
        }

        .glass-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-medium);
            padding: 20px;
            margin-bottom: 20px;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            margin-bottom: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-tertiary);
        }

        .status-dot.active {
            background: var(--success-color);
            box-shadow: 0 0 10px var(--success-color);
        }

        .status-dot.inactive {
            background: var(--danger-color);
            box-shadow: 0 0 10px var(--danger-color);
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-small);
            padding: 14px 16px;
            padding-right: 88px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        .input-actions {
            position: absolute;
            right: 10px;
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            transition: background 0.2s, transform 0.15s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .icon-btn:active {
            transform: scale(0.94);
        }

        button.primary-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(
                180deg,
                var(--accent-color) 0%,
                var(--accent-hover) 100%
            );
            color: #fff;
            border: none;
            border-radius: var(--radius-medium);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 24px var(--accent-glow);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 8px;
        }

        button.primary-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px var(--accent-glow);
        }

        button.primary-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .meta-info {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 12px;
            text-align: center;
        }

        /* API LIST */

        .api-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 14px;
            margin-bottom: 16px;
        }

        .api-item {
            position: relative;
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px;
            transition: 0.2s ease;
        }

        .api-item.current {
            border-color: rgba(10, 132, 255, 0.55);
            box-shadow:
                0 0 20px rgba(10, 132, 255, 0.08),
                inset 0 0 20px rgba(10, 132, 255, 0.03);
        }

        .api-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .api-name {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 650;
        }

        .api-number {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: rgba(255,255,255,0.07);
            font-size: 12px;
            color: rgba(255,255,255,0.75);
        }

        .api-status {
            font-size: 11px;
            padding: 5px 9px;
            border-radius: 100px;
            background: rgba(48, 209, 88, 0.10);
            color: var(--success-color);
            border: 1px solid rgba(48, 209, 88, 0.18);
        }

        .api-status.off {
            background: rgba(255, 69, 58, 0.10);
            color: var(--danger-color);
            border-color: rgba(255, 69, 58, 0.18);
        }

        .api-key-mask {
            margin-top: 10px;
            color: var(--text-tertiary);
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
        }

        .api-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 12px;
        }

        .api-current {
            font-size: 11px;
            color: var(--accent-color);
            font-weight: 600;
        }

        .api-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .small-btn {
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.06);
            color: white;
            border-radius: 9px;
            height: 30px;
            padding: 0 10px;
            font-size: 11px;
            cursor: pointer;
        }

        .small-btn.activate {
            background: rgba(10, 132, 255, 0.15);
            border-color: rgba(10, 132, 255, 0.3);
            color: var(--accent-color);
        }

        .small-btn.delete {
            color: var(--danger-color);
        }

        .empty-state {
            text-align: center;
            padding: 22px 10px;
            color: var(--text-tertiary);
            font-size: 13px;
        }

        /* ROTATION */

        .rotation-box {
            margin-top: 16px;
            padding: 14px;
            border-radius: 16px;
            background: rgba(10, 132, 255, 0.06);
            border: 1px solid rgba(10, 132, 255, 0.12);
        }

        .rotation-title {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .rotation-time {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .progress-track {
            height: 5px;
            background: rgba(255,255,255,0.07);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(
                90deg,
                var(--accent-color),
                #5856D6
            );
            border-radius: inherit;
            transition: width 1s linear;
        }

        .add-section {
            margin-top: 16px;
        }

        .add-section input {
            padding-right: 16px;
        }

        .add-btn {
            margin-top: 8px;
            width: 100%;
            height: 46px;
            border-radius: 14px;
            border: 1px solid rgba(10,132,255,0.3);
            background: rgba(10,132,255,0.08);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(22, 22, 28, 0.95);
            border: 1px solid var(--glass-border);
            padding: 12px 24px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition:
                transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
            max-width: calc(100vw - 30px);
            text-align: center;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>

<div class="main-wrapper">
    <div class="glass-panel">

        <div class="header-bar">
            <div class="brand-title">
                <div class="brand-logo-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>

                <span class="brand-name">
                    Glowmax Dashboard
                </span>
            </div>
        </div>

        <!-- STATUS -->

        <div class="glass-card">

            <div class="status-indicator">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">
                    Đang kết nối Firestore...
                </span>
            </div>

            <!-- CURRENT KEY -->

            <div>
                <label>API Key đang sử dụng</label>

                <div class="input-group">
                    <input
                        type="text"
                        id="apiKeyInput"
                        placeholder="Chưa có API Key..."
                        autocomplete="off"
                        readonly
                    >

                    <div class="input-actions">
                        <button
                            type="button"
                            class="icon-btn"
                            id="toggleVisibility"
                            title="Hiện/Ẩn"
                        >👁</button>

                        <button
                            type="button"
                            class="icon-btn"
                            id="copyKey"
                            title="Sao chép"
                        >📋</button>
                    </div>
                </div>
            </div>

            <!-- ROTATION -->

            <div class="rotation-box">

                <div class="rotation-title">
                    Tự động chuyển API Key sau 10 phút
                </div>

                <div
                    class="rotation-time"
                    id="rotationTime"
                >
                    --:--
                </div>

                <div class="progress-track">
                    <div
                        class="progress-bar"
                        id="progressBar"
                    ></div>
                </div>

            </div>

            <div
                class="meta-info"
                id="metaInfo"
            >
                Cập nhật cuối: Chưa có dữ liệu
            </div>

        </div>

        <!-- API LIST -->

        <div class="glass-card">

            <label>
                Danh sách Gemini API Key
            </label>

            <div
                class="api-list"
                id="apiList"
            >
                <div class="empty-state">
                    Chưa có API Key
                </div>
            </div>

            <!-- ADD KEY -->

            <div class="add-section">

                <label for="newApiKey">
                    Thêm API Key mới
                </label>

                <input
                    type="password"
                    id="newApiKey"
                    placeholder="AIza..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    class="add-btn"
                    id="addKeyBtn"
                >
                    ＋ Thêm API Key
                </button>

            </div>

        </div>

    </div>
</div>

<div
    class="toast"
    id="toastMessage"
>
    Thành công!
</div>


<!-- Firebase SDK Modular CDN -->

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
        serverTimestamp,
        onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    const firebaseConfig = {
        apiKey: "AIzaSyDummyKeyForInitializationOnly-ReplaceIfCustom",
        authDomain: "quocdat-396fe.firebaseapp.com",
        projectId: "quocdat-396fe",
        storageBucket: "quocdat-396fe.appspot.com",
        messagingSenderId: "38927491028",
        appId: "1:38927491028:web:abcdef123456789"
    };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const configRef = doc(
        db,
        "glowmax",
        "config",
        "api",
        "keyDoc"
    );

    const ROTATION_TIME = 10 * 60 * 1000;

    let apiKeys = [];
    let currentIndex = 0;
    let rotationStartedAt = 0;

    let rawApiKey = "";
    let isMasked = true;

    let rotationTimer = null;

    const inputEl = document.getElementById("apiKeyInput");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const metaInfo = document.getElementById("metaInfo");
    const apiList = document.getElementById("apiList");
    const newApiKey = document.getElementById("newApiKey");
    const addKeyBtn = document.getElementById("addKeyBtn");
    const rotationTime = document.getElementById("rotationTime");
    const progressBar = document.getElementById("progressBar");

    function showToast(msg) {
        const toast = document.getElementById("toastMessage");
        toast.innerText = msg;
        toast.classList.add("show");
        setTimeout(() => {
            toast.classList.remove("show");
        }, 3000);
    }

    function createKeyId() {
        return (
            Date.now().toString(36) +
            Math.random().toString(36).substring(2, 8)
        );
    }

    function maskKey(key) {
        if (!key) return "";
        if (key.length <= 12) {
            return "••••••••••••";
        }
        return (
            key.substring(0, 6) +
            "••••••••••" +
            key.substring(key.length - 4)
        );
    }

    function getActiveKeyIndex() {
        if (!apiKeys.length) return -1;
        if (
            currentIndex >= 0 &&
            currentIndex < apiKeys.length &&
            apiKeys[currentIndex].enabled !== false
        ) {
            return currentIndex;
        }

        for (let i = 0; i < apiKeys.length; i++) {
            const index = (currentIndex + i) % apiKeys.length;
            if (apiKeys[index] && apiKeys[index].enabled !== false) {
                return index;
            }
        }
        return -1;
    }

    function renderApiList() {
        apiList.innerHTML = "";
        if (!apiKeys.length) {
            apiList.innerHTML = `<div class="empty-state">Chưa có API Key</div>`;
            return;
        }

        apiKeys.forEach((item, index) => {
            const isCurrent = index === getActiveKeyIndex();
            const enabled = item.enabled !== false;

            const div = document.createElement("div");
            div.className = "api-item" + (isCurrent ? " current" : "");

            div.innerHTML = `
                <div class="api-top">
                    <div class="api-name">
                        <div class="api-number">${index + 1}</div>
                        <span>Gemini API</span>
                    </div>
                    <div class="api-status ${enabled ? "" : "off"}">
                        ${enabled ? "● ACTIVE" : "● OFF"}
                    </div>
                </div>

                <div class="api-key-mask">${maskKey(item.apiKey)}</div>

                <div class="api-bottom">
                    <div class="api-current">
                        ${isCurrent ? "● ĐANG SỬ DỤNG" : "Đang chờ"}
                    </div>
                    <div class="api-actions">
                        ${!isCurrent && enabled ? `
                        <button class="small-btn activate" data-action="activate" data-index="${index}">
                            ⚡ Dùng Ngay
                        </button>` : ""}
                        <button class="small-btn" data-action="toggle" data-index="${index}">
                            ${enabled ? "Tắt" : "Bật"}
                        </button>
                        <button class="small-btn delete" data-action="delete" data-index="${index}">
                            Xóa
                        </button>
                    </div>
                </div>
            `;
            apiList.appendChild(div);
        });
    }

    function updateCurrentKeyUI() {
        const index = getActiveKeyIndex();
        if (index === -1) {
            rawApiKey = "";
            inputEl.value = "";
            statusDot.className = "status-dot inactive";
            statusText.innerText = "● Chưa cấu hình API";
            rotationTime.innerText = "--:--";
            progressBar.style.width = "0%";
            return;
        }

        const key = apiKeys[index];
        rawApiKey = key.apiKey || "";

        statusDot.className = "status-dot active";
        statusText.innerText = "● API đang hoạt động";

        inputEl.value = isMasked ? maskKey(rawApiKey) : rawApiKey;
        renderApiList();
    }

    async function saveConfig(extra = {}) {
        const activeIndex = getActiveKeyIndex();
        const activeKeyString = (activeIndex !== -1 && apiKeys[activeIndex]) ? apiKeys[activeIndex].apiKey : "";

        await setDoc(
            configRef,
            {
                apiKeys: apiKeys,
                currentIndex: currentIndex,
                apiKey: activeKeyString, // Đồng bộ để glowmax.html đọc trực tiếp thành công
                rotationStartedAt: rotationStartedAt ? new Date(rotationStartedAt) : serverTimestamp(),
                rotationMinutes: 10,
                enabled: apiKeys.some(key => key.enabled !== false),
                ...extra,
                updatedAt: serverTimestamp()
            },
            { merge: true }
        );
    }

    addKeyBtn.addEventListener("click", async () => {
        const value = newApiKey.value.trim();
        if (!value) {
            showToast("Vui lòng nhập API Key!");
            return;
        }

        const duplicate = apiKeys.some(key => key.apiKey === value);
        if (duplicate) {
            showToast("API Key này đã tồn tại!");
            return;
        }

        addKeyBtn.disabled = true;
        addKeyBtn.innerText = "Đang thêm...";

        try {
            const wasEmpty = apiKeys.length === 0;
            apiKeys.push({
                id: createKeyId(),
                apiKey: value,
                enabled: true
            });

            if (wasEmpty) {
                currentIndex = 0;
                rotationStartedAt = Date.now();
            }

            await saveConfig();
            newApiKey.value = "";
            isMasked = true;
            updateCurrentKeyUI();
            showToast("Đã thêm API Key!");
        } catch (error) {
            console.error(error);
            showToast("Lỗi khi thêm API Key!");
        } finally {
            addKeyBtn.disabled = false;
            addKeyBtn.innerText = "＋ Thêm API Key";
        }
    });

    newApiKey.addEventListener("keydown", event => {
        if (event.key === "Enter") {
            event.preventDefault();
            addKeyBtn.click();
        }
    });

    apiList.addEventListener("click", async event => {
        const button = event.target.closest("button");
        if (!button) return;

        const action = button.dataset.action;
        const index = Number(button.dataset.index);

        if (Number.isNaN(index) || !apiKeys[index]) return;

        // KÍCH HOẠT NHANH (DÙNG NGAY)
        if (action === "activate") {
            if (apiKeys[index].enabled === false) {
                showToast("Không thể dùng key đang bị tắt!");
                return;
            }
            currentIndex = index;
            rotationStartedAt = Date.now();
            await saveConfig();
            updateCurrentKeyUI();
            showToast("Đã chuyển sang API Key này!");
            return;
        }

        if (action === "toggle") {
            const activeCount = apiKeys.filter(key => key.enabled !== false).length;
            if (apiKeys[index].enabled !== false && activeCount <= 1) {
                showToast("Phải giữ lại ít nhất 1 API Key!");
                return;
            }

            apiKeys[index].enabled = apiKeys[index].enabled === false;

            if (index === currentIndex && apiKeys[index].enabled === false) {
                const next = getActiveKeyIndex();
                if (next !== -1) {
                    currentIndex = next;
                    rotationStartedAt = Date.now();
                }
            }

            await saveConfig();
            updateCurrentKeyUI();
            showToast(apiKeys[index].enabled ? "Đã bật API Key" : "Đã tắt API Key");
            return;
        }

        if (action === "delete") {
            if (!confirm("Bạn có chắc muốn xóa API Key này?")) return;

            const wasCurrent = index === currentIndex;
            apiKeys.splice(index, 1);

            if (!apiKeys.length) {
                currentIndex = 0;
                rotationStartedAt = 0;
            } else if (currentIndex >= apiKeys.length) {
                currentIndex = 0;
            }

            if (wasCurrent && apiKeys.length) {
                const next = getActiveKeyIndex();
                currentIndex = next === -1 ? 0 : next;
                rotationStartedAt = Date.now();
            }

            await saveConfig();
            updateCurrentKeyUI();
            showToast("Đã xóa API Key!");
        }
    });

    // FIX NÚT MẮT ĐỂ HIỆN FULL API KEY
    document.getElementById("toggleVisibility").addEventListener("click", () => {
        if (!rawApiKey) return;
        isMasked = !isMasked;
        inputEl.value = isMasked ? maskKey(rawApiKey) : rawApiKey;
    });

    document.getElementById("copyKey").addEventListener("click", async () => {
        if (!rawApiKey) {
            showToast("Không có API Key!");
            return;
        }
        try {
            await navigator.clipboard.writeText(rawApiKey);
            showToast("Đã sao chép API Key!");
        } catch (error) {
            showToast("Không thể sao chép!");
        }
    });

    async function rotateApiKey() {
        if (apiKeys.length <= 1) {
            rotationStartedAt = Date.now();
            return;
        }

        const enabledKeys = apiKeys.filter(key => key.enabled !== false);
        if (!enabledKeys.length) return;

        let nextIndex = currentIndex;
        for (let step = 1; step <= apiKeys.length; step++) {
            const candidate = (currentIndex + step) % apiKeys.length;
            if (apiKeys[candidate] && apiKeys[candidate].enabled !== false) {
                nextIndex = candidate;
                break;
            }
        }

        currentIndex = nextIndex;
        rotationStartedAt = Date.now();

        try {
            await saveConfig();
        } catch (error) {
            console.error("Rotation error:", error);
        }

        updateCurrentKeyUI();
        showToast("Đã tự động chuyển sang API Key tiếp theo");
    }

    function updateRotationTimer() {
        if (!apiKeys.length || getActiveKeyIndex() === -1) {
            rotationTime.innerText = "--:--";
            progressBar.style.width = "0%";
            return;
        }

        if (!rotationStartedAt) {
            rotationStartedAt = Date.now();
        }

        const elapsed = Date.now() - rotationStartedAt;
        const remaining = ROTATION_TIME - elapsed;

        if (remaining <= 0) {
            rotateApiKey();
            return;
        }

        const minutes = Math.floor(remaining / 60000);
        const seconds = Math.floor((remaining % 60000) / 1000);

        rotationTime.innerText =
            String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");

        const progress = Math.min(100, Math.max(0, (elapsed / ROTATION_TIME) * 100));
        progressBar.style.width = progress + "%";
    }

    onSnapshot(
        configRef,
        snapshot => {
            if (!snapshot.exists()) {
                apiKeys = [];
                currentIndex = 0;
                rotationStartedAt = 0;
                updateCurrentKeyUI();
                metaInfo.innerText = "Cập nhật cuối: Chưa có dữ liệu";
                return;
            }

            const data = snapshot.data();

            if (Array.isArray(data.apiKeys)) {
                apiKeys = data.apiKeys
                    .filter(key => key && key.apiKey)
                    .map(key => ({
                        id: key.id || createKeyId(),
                        apiKey: key.apiKey,
                        enabled: key.enabled !== false
                    }));
            } else if (data.apiKey) {
                apiKeys = [{
                    id: createKeyId(),
                    apiKey: data.apiKey,
                    enabled: true
                }];
            } else {
                apiKeys = [];
            }

            currentIndex = Number.isInteger(data.currentIndex) ? data.currentIndex : 0;

            if (data.rotationStartedAt && typeof data.rotationStartedAt.toMillis === "function") {
                rotationStartedAt = data.rotationStartedAt.toMillis();
            } else if (data.rotationStartedAt instanceof Date) {
                rotationStartedAt = data.rotationStartedAt.getTime();
            }

            if (!rotationStartedAt && apiKeys.length) {
                rotationStartedAt = Date.now();
            }

            updateCurrentKeyUI();

            if (data.updatedAt) {
                const date = data.updatedAt.toDate ? data.updatedAt.toDate() : new Date();
                metaInfo.innerText = "Cập nhật cuối: " + date.toLocaleString("vi-VN");
            }
        },
        error => {
            console.error("Firestore Error:", error);
            statusDot.className = "status-dot inactive";
            statusText.innerText = "Lỗi kết nối cơ sở dữ liệu";
        }
    );

    rotationTimer = setInterval(updateRotationTimer, 1000);
    updateRotationTimer();
</script>

</body>
</html>
