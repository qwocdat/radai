<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>AETHERIA // Trợ Lý AI & Không Gian Lập Trình</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <style>
    :root {
      --bg-dark: #040509;
      --bg-panel: rgba(12, 14, 24, 0.85);
      --border-glass: rgba(255, 255, 255, 0.11);
      --accent-cyan: #00f0ff;
      --accent-violet: #7a00ff;
      --accent-magenta: #ff007f;
      --accent-emerald: #00ff9d;
      --accent-amber: #ffb800;
      --text-main: #f1f5f9;
      --text-muted: #8b96a8;
      --font-sans: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent !important;
      outline: none;
    }

    textarea, input, pre, code, .msg-text-body {
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow: hidden;
      scrollbar-width: none;
    }

    ::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    #webgl-bg-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 1;
      pointer-events: none;
      opacity: 0.45;
    }

    .app-shell {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 10px 14px;
      gap: 10px;
    }

    /* TOP NAVBAR */
    #top-navbar {
      flex-shrink: 0;
      height: 56px;
      background: var(--bg-panel);
      backdrop-filter: blur(22px);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      cursor: grab;
      will-change: transform;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .brand-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid var(--accent-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-cyan);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action-pill {
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      font-size: 11.5px;
      font-family: var(--font-sans);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-action-pill:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* 3-COLUMN STAGE */
    .workspace-stage {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 240px 1fr 380px;
      gap: 12px;
    }

    .glass-panel {
      background: var(--bg-panel);
      backdrop-filter: blur(22px);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar-top {
      padding: 12px;
      border-bottom: 1px solid var(--border-glass);
    }

    .btn-new-session {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.16), rgba(122, 0, 255, 0.18));
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: #fff;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .sidebar-label {
      padding: 10px 12px 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .session-item {
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .session-item.active, .session-item:hover {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.25);
      color: #fff;
    }

    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--border-glass);
      background: rgba(0, 0, 0, 0.25);
    }

    .sidebar-footer a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-footer a:hover {
      color: #fff;
    }

    /* CENTER CHAT */
    .chat-top-bar {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .engine-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .engine-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 8px var(--accent-emerald);
    }

    .engine-dot.locked {
      background: var(--accent-magenta);
      box-shadow: 0 0 8px var(--accent-magenta);
    }

    .messages-scroll-box {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg-row {
      display: flex;
      gap: 10px;
      max-width: 90%;
    }

    .msg-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 13px;
    }

    .msg-row.ai .msg-avatar {
      background: rgba(0, 240, 255, 0.14);
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: var(--accent-cyan);
    }

    .msg-row.user .msg-avatar {
      background: rgba(122, 0, 255, 0.22);
      border: 1px solid rgba(122, 0, 255, 0.45);
      color: #d2b4ff;
    }

    .msg-bubble {
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--text-main);
      overflow-wrap: anywhere;
    }

    .msg-row.ai .msg-bubble {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-glass);
      border-top-left-radius: 3px;
    }

    .msg-row.user .msg-bubble {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.14), rgba(122, 0, 255, 0.18));
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-top-right-radius: 3px;
    }

    .msg-text-body {
      white-space: pre-wrap;
    }

    /* CODE BLOCK SẠCH AN TOÀN */
    .code-block-card {
      margin-top: 10px;
      border-radius: 8px;
      overflow: hidden;
      background: #060810;
      border: 1px solid rgba(0, 240, 255, 0.25);
      font-family: var(--font-mono);
    }

    .code-block-header {
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--accent-cyan);
    }

    .code-btn {
      padding: 4px 8px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 10.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .code-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .code-block-pre {
      padding: 12px 14px;
      overflow-x: auto;
      font-size: 12px;
      line-height: 1.5;
      color: #e2e8f0;
    }

    /* INPUT CONSOLE (MODEL PICKER ĐƯỢC CHUYỂN XUỐNG ĐÂY) */
    .chat-input-zone {
      padding: 8px 12px 10px;
      border-top: 1px solid var(--border-glass);
      background: rgba(6, 8, 15, 0.85);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-zone-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    /* CUSTOM MODEL PICKER IN CHAT ZONE */
    .custom-dropdown {
      position: relative;
    }

    .dropdown-trigger {
      padding: 5px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      border-radius: 999px;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .dropdown-menu {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0;
      min-width: 200px;
      background: rgba(10, 12, 22, 0.98);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 12px;
      padding: 5px;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transform: translateY(6px);
      transition: all 0.2s ease;
    }

    .custom-dropdown.open .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-option {
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dropdown-option:hover, .dropdown-option.selected {
      background: rgba(0, 240, 255, 0.14);
      color: #fff;
    }

    .quick-prompts-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .prompt-chip {
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .prompt-chip:hover {
      color: #fff;
      border-color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.1);
    }

    .staging-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .staged-chip {
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.35);
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-del-staged {
      background: rgba(255, 0, 127, 0.85);
      color: #fff;
      border: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      font-size: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .composer-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 6px 8px;
    }

    .composer-row:focus-within {
      border-color: var(--accent-cyan);
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }

    #chat-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-family: var(--font-sans);
      font-size: 13.5px;
      line-height: 1.45;
      resize: none;
      max-height: 100px;
      min-height: 22px;
      padding: 5px 4px;
    }

    .send-btn {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent-cyan), #6ef7ff);
      border: none;
      color: #040509;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* RIGHT STUDIO */
    .studio-top {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .studio-tab-group {
      display: flex;
      gap: 5px;
    }

    .studio-tab-btn {
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .studio-tab-btn.active {
      background: rgba(0, 240, 255, 0.14);
      border-color: rgba(0, 240, 255, 0.35);
      color: var(--accent-cyan);
    }

    .studio-content {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    #studio-editor {
      width: 100%;
      height: 100%;
      background: #060810;
      border: none;
      color: #00f0ff;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.5;
      padding: 12px;
      resize: none;
    }

    #studio-preview {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
      display: none;
    }

    /* MOBILE TABBAR (ĐÃ LOẠI BỎ HOÀN TOÀN TAB DASHBOARD) */
    #mobile-tabbar {
      display: none;
      flex-shrink: 0;
      height: 52px;
      background: var(--bg-panel);
      backdrop-filter: blur(22px);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      align-items: center;
      justify-content: space-around;
      padding: 0 6px;
    }

    .mob-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 10px;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 5px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .mob-tab.active {
      color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.12);
    }

    #toast-stack {
      position: fixed;
      top: 70px;
      right: 14px;
      z-index: 6000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .cyber-toast {
      background: rgba(10, 12, 22, 0.95);
      border: 1px solid var(--border-glass);
      border-left: 4px solid var(--accent-cyan);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      transform: translateX(120%);
      transition: transform 0.3s ease;
    }

    .cyber-toast.show { transform: translateX(0); }
    .cyber-toast.success { border-left-color: var(--accent-emerald); }
    .cyber-toast.error { border-left-color: var(--accent-magenta); }

    @media (max-width: 1100px) {
      .workspace-stage { grid-template-columns: 210px 1fr; }
      #panel-studio { display: none; }
      #panel-studio.mob-show { display: flex; }
    }

    @media (max-width: 820px) {
      .app-shell { padding: 6px 8px; gap: 6px; }
      .workspace-stage { grid-template-columns: 1fr; }
      #panel-sidebar, #panel-studio { display: none; }
      #panel-sidebar.mob-show, #panel-studio.mob-show, #panel-chat.mob-show { display: flex; }
      #panel-chat.mob-hide { display: none; }
      #mobile-tabbar { display: flex; }
      .hide-on-mob { display: none; }
    }
  </style>
</head>
<body>

  <canvas id="webgl-bg-canvas"></canvas>
  <div id="toast-stack"></div>

  <div class="app-shell">
    <header id="top-navbar">
      <a href="index.html" class="brand-row">
        <div class="brand-badge"><i class="fa-solid fa-atom"></i></div>
        <span>AETHERIA AI</span>
      </a>

      <div class="nav-right">
        <a href="index.html" class="btn-action-pill">
          <i class="fa-solid fa-house"></i>
          <span>Trang Chủ</span>
        </a>
      </div>
    </header>

    <div class="workspace-stage">
      <!-- SIDEBAR -->
      <aside class="glass-panel" id="panel-sidebar">
        <div class="sidebar-top">
          <button class="btn-new-session" id="btn-new-chat">
            <i class="fa-solid fa-plus"></i>
            <span>Cuộc Trò Chuyện Mới</span>
          </button>
        </div>

        <div class="sidebar-label">
          <span>LỊCH SỬ ĐỐI THOẠI</span>
          <i class="fa-solid fa-clock-rotate-left"></i>
        </div>

        <div class="session-list" id="session-list">
          <div class="session-item active">
            <i class="fa-solid fa-terminal" style="color:var(--accent-cyan);"></i>
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Phiên Lập Trình Hiện Tại</span>
          </div>
        </div>

        <div class="sidebar-footer">
          <a href="index.html">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Quay về trang chủ</span>
          </a>
        </div>
      </aside>

      <!-- CHAT PANEL -->
      <section class="glass-panel mob-show" id="panel-chat">
        <div class="chat-top-bar">
          <div class="engine-indicator">
            <span class="engine-dot" id="engine-status-dot"></span>
            <span id="chat-session-title">Trợ Lý Lập Trình Aetheria</span>
          </div>
          <button class="code-btn" id="btn-clear-messages">
            <i class="fa-solid fa-broom"></i>
            <span>Làm Mới</span>
          </button>
        </div>

        <div class="messages-scroll-box" id="messages-box"></div>

        <div class="chat-input-zone">
          <div class="input-zone-top-row">
            <!-- MODEL PICKER ĐƯỢC CHUYỂN XUỐNG ĐÂY -->
            <div class="custom-dropdown" id="model-picker">
              <div class="dropdown-trigger">
                <i class="fa-solid fa-wand-magic-sparkles" style="color:var(--accent-cyan);"></i>
                <span id="model-label">Claude 3.5 Sonnet</span>
                <i class="fa-solid fa-chevron-up" style="font-size:9px;"></i>
              </div>
              <div class="dropdown-menu">
                <div class="dropdown-option selected" data-model="claude-3-5-sonnet-20241022" data-label="Claude 3.5 Sonnet">
                  <span>Claude 3.5 Sonnet</span>
                  <i class="fa-solid fa-check" style="color:var(--accent-cyan);"></i>
                </div>
                <div class="dropdown-option" data-model="claude-3-5-haiku-20241022" data-label="Claude 3.5 Haiku">
                  <span>Claude 3.5 Haiku</span>
                  <i class="fa-solid fa-bolt" style="color:var(--accent-amber);"></i>
                </div>
              </div>
            </div>

            <!-- GỢI Ý PROMPT NHANH -->
            <div class="quick-prompts-row">
              <button class="prompt-chip" data-prompt="Hãy giải thích chi tiết cấu trúc mã nguồn và thuật toán của đoạn code này.">
                <i class="fa-solid fa-magnifying-glass-chart" style="color:var(--accent-cyan);"></i>
                <span>Giải thích code</span>
              </button>
              <button class="prompt-chip" data-prompt="Hãy kiểm tra các lỗ hổng bảo mật và đề xuất bản vá an toàn cho đoạn code.">
                <i class="fa-solid fa-shield-halved" style="color:var(--accent-magenta);"></i>
                <span>Sửa bảo mật</span>
              </button>
              <button class="prompt-chip" data-prompt="Hãy viết bộ kiểm thử Unit Test đầy đủ cho đoạn code trên.">
                <i class="fa-solid fa-vial-circle-check" style="color:var(--accent-emerald);"></i>
                <span>Sinh Unit Test</span>
              </button>
            </div>
          </div>

          <div class="staging-bar" id="staging-bar"></div>

          <div class="composer-row">
            <input type="file" id="file-picker" accept=".txt,.py,.js,.json,.csv,.html,.css" multiple style="display:none;" />
            <input type="file" id="img-picker" accept=".png,.jpg,.jpeg,.webp" multiple style="display:none;" />

            <button type="button" class="icon-btn" id="btn-pick-file" title="Đính kèm tệp"><i class="fa-solid fa-paperclip"></i></button>
            <button type="button" class="icon-btn" id="btn-pick-img" title="Tải ảnh lên"><i class="fa-regular fa-image"></i></button>

            <textarea id="chat-input" rows="1" placeholder="Nhập câu hỏi hoặc dán mã nguồn... (Enter gửi, Shift+Enter xuống dòng)"></textarea>

            <button type="button" class="send-btn" id="btn-send"><i class="fa-solid fa-paper-plane"></i></button>
          </div>
        </div>
      </section>

      <!-- CODE STUDIO -->
      <aside class="glass-panel" id="panel-studio">
        <div class="studio-top">
          <div class="studio-tab-group">
            <button class="studio-tab-btn active" data-tab="editor"><i class="fa-solid fa-code"></i><span>Mã Nguồn</span></button>
            <button class="studio-tab-btn" data-tab="preview"><i class="fa-solid fa-play"></i><span>Chạy Thử</span></button>
          </div>
          <div style="display:flex; gap:5px;">
            <button class="code-btn" id="btn-copy-studio"><i class="fa-regular fa-copy"></i></button>
            <button class="code-btn" id="btn-dl-studio"><i class="fa-solid fa-download"></i></button>
          </div>
        </div>

        <div class="studio-content">
          <textarea id="studio-editor" spellcheck="false"><!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0; background: #060812; color: #00f0ff;
    font-family: monospace; display: flex; flex-direction: column;
    align-items: center; justify-content: center; height: 100vh;
  }
  .pulse { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #00f0ff; box-shadow: 0 0 20px #00f0ff; }
</style>
</head>
<body>
  <div class="pulse"></div>
  <h3>AETHERIA LIVE SANDBOX</h3>
</body>
</html></textarea>
          <iframe id="studio-preview" sandbox="allow-scripts"></iframe>
        </div>
      </aside>
    </div>

    <!-- MOBILE TABBAR (CHỈ CÒN ĐOẠN CHAT, PHÒNG CODE, TRANG CHỦ) -->
    <nav id="mobile-tabbar">
      <button class="mob-tab active" data-mob="chat">
        <i class="fa-solid fa-comments"></i>
        <span>Đoạn Chat</span>
      </button>
      <button class="mob-tab" data-mob="studio">
        <i class="fa-solid fa-code"></i>
        <span>Phòng Code</span>
      </button>
      <a href="index.html" class="mob-tab" style="text-decoration:none;">
        <i class="fa-solid fa-house"></i>
        <span>Trang Chủ</span>
      </a>
    </nav>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAVuB8m14zkMPs-JTLAKB0Bp18QBKAMBt4",
      authDomain: "ideo-dd376.firebaseapp.com",
      databaseURL: "https://ideo-dd376-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "ideo-dd376",
      storageBucket: "ideo-dd376.firebasestorage.app",
      messagingSenderId: "689163185",
      appId: "1:689163185:web:af4091213001180f364b90",
      measurementId: "G-QP54CZ2BJT"
    };
    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);

    function showToast(msg, type = 'info') {
      const stack = document.getElementById('toast-stack');
      const t = document.createElement('div');
      t.className = `cyber-toast ${type}`;
      t.innerHTML = `<i class="fa-solid fa-circle-info"></i><span>${msg}</span>`;
      stack.appendChild(t);
      requestAnimationFrame(() => t.classList.add('show'));
      setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3200);
    }

    // 1. ĐỒNG BỘ DỮ LIỆU TỪ NHÁNH RIÊNG BIỆT (aetheria_project/system_config)
    let remoteConfig = {
      api_key: '',
      api_locked: false,
      input_tokens: 0,
      output_tokens: 0
    };

    onValue(ref(rtdb, 'aetheria_project/system_config'), (snap) => {
      if (snap.exists()) {
        remoteConfig = { ...remoteConfig, ...snap.val() };
      }
      const dot = document.getElementById('engine-status-dot');
      if (remoteConfig.api_locked) {
        dot.classList.add('locked');
      } else if (remoteConfig.api_key && remoteConfig.api_key.startsWith('sk-ant-')) {
        dot.classList.remove('locked');
      } else {
        dot.classList.add('locked');
      }
    });

    // 2. PARSE CODE DOM AN TOÀN TUYỆT ĐỐI (TRÁNH LỖI CLASS="TOK-CM")
    const messagesBox = document.getElementById('messages-box');

    function createCodeCard(codeContent, lang = 'javascript') {
      const card = document.createElement('div');
      card.className = 'code-block-card';

      const header = document.createElement('div');
      header.className = 'code-block-header';
      header.innerHTML = `<span><i class="fa-solid fa-terminal"></i> ${lang}</span>`;

      const btnCopy = document.createElement('button');
      btnCopy.className = 'code-btn';
      btnCopy.innerHTML = `<i class="fa-regular fa-copy"></i> Sao chép`;
      btnCopy.onclick = () => {
        navigator.clipboard.writeText(codeContent);
        showToast('Đã sao chép mã nguồn vào bộ nhớ tạm', 'success');
      };
      header.appendChild(btnCopy);

      const pre = document.createElement('pre');
      pre.className = 'code-block-pre';
      const codeEl = document.createElement('code');
      codeEl.textContent = codeContent;
      pre.appendChild(codeEl);

      card.appendChild(header);
      card.appendChild(pre);
      return card;
    }

    function appendMessage(role, fullText) {
      const row = document.createElement('div');
      row.className = `msg-row ${role}`;
      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.innerHTML = `<i class="fa-solid ${role === 'ai' ? 'fa-robot' : 'fa-user'}"></i>`;

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';

      const parts = fullText.split(/```(\w+)?\n([\s\S]*?)```/g);
      for (let i = 0; i < parts.length; i += 3) {
        const textSegment = parts[i];
        const lang = parts[i + 1] || 'code';
        const codeSegment = parts[i + 2];

        if (textSegment && textSegment.trim()) {
          const p = document.createElement('div');
          p.className = 'msg-text-body';
          p.textContent = textSegment.trim();
          bubble.appendChild(p);
        }

        if (codeSegment !== undefined) {
          const card = createCodeCard(codeSegment.trim(), lang);
          bubble.appendChild(card);
          document.getElementById('studio-editor').value = codeSegment.trim();
        }
      }

      row.appendChild(avatar);
      row.appendChild(bubble);
      messagesBox.appendChild(row);
      messagesBox.scrollTop = messagesBox.scrollHeight;
      return bubble;
    }

    appendMessage('ai', 'Chào bạn! Tôi là trợ lý lập trình Aetheria. Tôi sẵn sàng hỗ trợ phân tích giải thuật, tìm lỗi và sinh mã nguồn sạch sẽ.');

    // 3. XỬ LÝ ĐÍNH KÈM TỆP VÀ ẢNH
    let stagedFiles = [];
    let stagedImages = [];
    const stagingBar = document.getElementById('staging-bar');

    function renderStaging() {
      stagingBar.innerHTML = '';
      stagedFiles.forEach((f, i) => {
        const chip = document.createElement('div');
        chip.className = 'staged-chip';
        chip.innerHTML = `<i class="fa-regular fa-file-code"></i><span>${f.name}</span><button class="btn-del-staged"><i class="fa-solid fa-xmark"></i></button>`;
        chip.querySelector('button').onclick = () => { stagedFiles.splice(i, 1); renderStaging(); };
        stagingBar.appendChild(chip);
      });
      stagedImages.forEach((im, i) => {
        const chip = document.createElement('div');
        chip.className = 'staged-chip';
        chip.innerHTML = `<i class="fa-regular fa-image"></i><span>${im.name}</span><button class="btn-del-staged"><i class="fa-solid fa-xmark"></i></button>`;
        chip.querySelector('button').onclick = () => { stagedImages.splice(i, 1); renderStaging(); };
        stagingBar.appendChild(chip);
      });
    }

    const filePicker = document.getElementById('file-picker');
    const imgPicker = document.getElementById('img-picker');
    document.getElementById('btn-pick-file').onclick = () => filePicker.click();
    document.getElementById('btn-pick-img').onclick = () => imgPicker.click();

    filePicker.onchange = (e) => {
      Array.from(e.target.files).forEach(f => {
        const r = new FileReader();
        r.onload = (ev) => {
          stagedFiles.push({ name: f.name, content: ev.target.result });
          renderStaging();
        };
        r.readAsText(f);
      });
      filePicker.value = '';
    };

    imgPicker.onchange = (e) => {
      Array.from(e.target.files).forEach(f => {
        const r = new FileReader();
        r.onload = (ev) => {
          stagedImages.push({
            name: f.name,
            mediaType: f.type || 'image/png',
            base64Data: ev.target.result.split(',')[1]
          });
          renderStaging();
        };
        r.readAsDataURL(f);
      });
      imgPicker.value = '';
    };

    // 4. CHỌN MÔ HÌNH VÀ GỬI PROMPT
    let currentModel = 'claude-3-5-sonnet-20241022';
    const modelPicker = document.getElementById('model-picker');
    modelPicker.querySelector('.dropdown-trigger').onclick = (e) => {
      e.stopPropagation();
      modelPicker.classList.toggle('open');
    };
    modelPicker.querySelectorAll('.dropdown-option').forEach(opt => {
      opt.onclick = () => {
        modelPicker.querySelectorAll('.dropdown-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        currentModel = opt.getAttribute('data-model');
        document.getElementById('model-label').textContent = opt.getAttribute('data-label');
        modelPicker.classList.remove('open');
      };
    });
    window.onclick = () => modelPicker.classList.remove('open');

    const chatInput = document.getElementById('chat-input');
    const btnSend = document.getElementById('btn-send');
    let isWaiting = false;

    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto';
      chatInput.style.height = `${Math.min(chatInput.scrollHeight, 100)}px`;
    });

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendPrompt();
      }
    });

    document.querySelectorAll('.prompt-chip').forEach(c => {
      c.onclick = () => {
        chatInput.value = c.getAttribute('data-prompt');
        sendPrompt();
      };
    });

    async function sendPrompt() {
      if (isWaiting) return;
      const text = chatInput.value.trim();
      if (!text && !stagedFiles.length && !stagedImages.length) return;

      if (remoteConfig.api_locked) {
        showToast('Hệ thống AI hiện đang tạm khóa bảo trì. Vui lòng thử lại sau!', 'error');
        return;
      }

      // THÔNG BÁO LỊCH SỰ CHO NGƯỜI DÙNG KHI CHƯA CÓ KEY - KHÔNG LỘ PASSWORD HAY DASHBOARD
      if (!remoteConfig.api_key || !remoteConfig.api_key.startsWith('sk-ant-')) {
        appendMessage('user', text || '[Gửi tệp/ảnh]');
        appendMessage('ai', 'Hệ thống AI hiện đang trong quá trình bảo trì kết nối máy chủ. Vui lòng thử lại sau ít phút.');
        chatInput.value = '';
        chatInput.style.height = 'auto';
        return;
      }

      const userContent = [];
      stagedImages.forEach(img => {
        userContent.push({
          type: 'image',
          source: { type: 'base64', media_type: img.mediaType, data: img.base64Data }
        });
      });

      let promptPayload = text;
      stagedFiles.forEach(f => {
        promptPayload += `\n\n--- Tệp đính kèm: ${f.name} ---\n${f.content}`;
      });

      if (promptPayload) {
        userContent.push({ type: 'text', text: promptPayload });
      }

      appendMessage('user', text || '[Đã gửi tệp đính kèm]');

      chatInput.value = '';
      chatInput.style.height = 'auto';
      stagedFiles = [];
      stagedImages = [];
      renderStaging();

      isWaiting = true;
      btnSend.disabled = true;

      const aiRow = document.createElement('div');
      aiRow.className = 'msg-row ai';
      aiRow.innerHTML = `
        <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
        <div class="msg-bubble"><span id="loading-txt"><i class="fa-solid fa-circle-notch fa-spin"></i> Đang suy nghĩ và xử lý...</span></div>
      `;
      messagesBox.appendChild(aiRow);
      messagesBox.scrollTop = messagesBox.scrollHeight;
      const bubbleContainer = aiRow.querySelector('.msg-bubble');

      try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'x-api-key': remoteConfig.api_key.trim(),
            'anthropic-version': '2023-06-01',
            'content-type': 'application/json',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: currentModel,
            max_tokens: 3000,
            system: 'Bạn là chuyên gia lập trình Aetheria. Trả lời bằng tiếng Việt trực diện, súc tích và luôn bọc code bên trong cặp ```tên_ngôn_ngữ.',
            messages: [{ role: 'user', content: userContent }]
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || `Lỗi HTTP ${response.status}`);
        }

        const data = await response.json();
        const aiResponseText = data.content && data.content[0] ? data.content[0].text : 'Không nhận được nội dung từ AI.';

        bubbleContainer.innerHTML = '';
        const parts = aiResponseText.split(/```(\w+)?\n([\s\S]*?)```/g);
        for (let i = 0; i < parts.length; i += 3) {
          const txt = parts[i];
          const lang = parts[i + 1] || 'code';
          const cd = parts[i + 2];
          if (txt && txt.trim()) {
            const p = document.createElement('div');
            p.className = 'msg-text-body';
            p.textContent = txt.trim();
            bubbleContainer.appendChild(p);
          }
          if (cd !== undefined) {
            bubbleContainer.appendChild(createCodeCard(cd.trim(), lang));
            document.getElementById('studio-editor').value = cd.trim();
          }
        }

        // Cập nhật Token riêng vào nhánh aetheria_project
        if (data.usage) {
          const inT = data.usage.input_tokens || 0;
          const outT = data.usage.output_tokens || 0;
          await update(ref(rtdb, 'aetheria_project/system_config'), {
            input_tokens: (remoteConfig.input_tokens || 0) + inT,
            output_tokens: (remoteConfig.output_tokens || 0) + outT
          });
          await push(ref(rtdb, 'aetheria_project/request_logs'), {
            time: new Date().toTimeString().split(' ')[0],
            model: currentModel,
            fileInfo: text ? 'Câu hỏi trực tiếp' : 'Tệp/Ảnh',
            inTokens: inT,
            outTokens: outT,
            status: '200 OK',
            timestamp: Date.now()
          });
        }
      } catch (err) {
        bubbleContainer.innerHTML = `<span style="color:var(--accent-magenta);"><i class="fa-solid fa-triangle-exclamation"></i> Có lỗi xảy ra trong quá trình xử lý: ${err.message}</span>`;
      } finally {
        isWaiting = false;
        btnSend.disabled = false;
        messagesBox.scrollTop = messagesBox.scrollHeight;
      }
    }

    btnSend.onclick = sendPrompt;

    document.getElementById('btn-clear-messages').onclick = () => {
      messagesBox.innerHTML = '';
      appendMessage('ai', 'Đã làm mới phiên hội thoại.');
    };

    document.getElementById('btn-new-chat').onclick = () => {
      messagesBox.innerHTML = '';
      appendMessage('ai', 'Cuộc trò chuyện mới đã bắt đầu.');
    };

    // Code Studio Preview
    const editorEl = document.getElementById('studio-editor');
    const previewEl = document.getElementById('studio-preview');
    document.querySelectorAll('.studio-tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.studio-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const isPrev = btn.getAttribute('data-tab') === 'preview';
        editorEl.style.display = isPrev ? 'none' : 'block';
        previewEl.style.display = isPrev ? 'block' : 'none';
        if (isPrev) previewEl.srcdoc = editorEl.value;
      };
    });

    document.getElementById('btn-copy-studio').onclick = () => {
      navigator.clipboard.writeText(editorEl.value);
      showToast('Đã sao chép mã nguồn Studio', 'success');
    };
    document.getElementById('btn-dl-studio').onclick = () => {
      const b = new Blob([editorEl.value], { type: 'text/html;charset=utf-8' });
      const u = URL.createObjectURL(b);
      const a = document.createElement('a');
      a.href = u;
      a.download = 'aetheria_code.html';
      a.click();
      URL.revokeObjectURL(u);
    };

    // Mobile Navigation Switcher (Chỉ còn Chat, Studio, Trang Chủ)
    const pSidebar = document.getElementById('panel-sidebar');
    const pChat = document.getElementById('panel-chat');
    const pStudio = document.getElementById('panel-studio');

    document.querySelectorAll('.mob-tab[data-mob]').forEach(t => {
      t.onclick = () => {
        document.querySelectorAll('.mob-tab').forEach(m => m.classList.remove('active'));
        t.classList.add('active');
        const target = t.getAttribute('data-mob');
        pSidebar.classList.remove('mob-show');
        pStudio.classList.remove('mob-show');
        pChat.classList.remove('mob-show', 'mob-hide');

        if (target === 'chat') {
          pChat.classList.add('mob-show');
        } else if (target === 'studio') {
          pChat.classList.add('mob-hide');
          pStudio.classList.add('mob-show');
        }
      };
    });

    // Three.js Background Wireframe
    const bgCanvas = document.getElementById('webgl-bg-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas: bgCanvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.z = 5;
    const mesh = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.6, 8),
      new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true, transparent: true, opacity: 0.16 })
    );
    scene.add(mesh);

    function loop() {
      requestAnimationFrame(loop);
      mesh.rotation.y += 0.002;
      mesh.rotation.x += 0.001;
      renderer.render(scene, camera);
    }
    loop();

    window.onresize = () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    };
  </script>
</body>
