<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AETHERIA // Trợ Lý AI & Không Gian Lập Trình</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <style>
    :root {
      --bg-dark: #040509;
      --bg-panel: rgba(12, 14, 24, 0.82);
      --border-glass: rgba(255, 255, 255, 0.11);
      --accent-cyan: #00f0ff;
      --accent-violet: #7a00ff;
      --accent-magenta: #ff007f;
      --accent-emerald: #00ff9d;
      --accent-amber: #ffb800;
      --text-main: #f1f5f9;
      --text-muted: #8b96a8;
      --font-sans: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent !important;
      user-select: none !important;
      -webkit-user-select: none !important;
      outline: none;
    }

    textarea, input, pre, code, .msg-text-body {
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow: hidden;
      scrollbar-width: none;
    }

    ::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    #webgl-bg-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 1;
      pointer-events: none;
      opacity: 0.45;
    }

    /* FULL VIEWPORT FLEX ENGINE (ZERO OVERLAP ON MOBILE & DESKTOP) */
    .app-shell {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 12px 16px;
      gap: 12px;
    }

    /* TOP NAVBAR */
    #top-navbar {
      flex-shrink: 0;
      height: 58px;
      background: var(--bg-panel);
      backdrop-filter: blur(22px);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      cursor: grab;
      will-change: transform;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .brand-badge {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid var(--accent-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-cyan);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .custom-dropdown {
      position: relative;
    }

    .dropdown-trigger {
      padding: 7px 13px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      border-radius: 999px;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 11.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 240px;
      background: rgba(10, 12, 22, 0.96);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 14px;
      padding: 6px;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: all 0.2s ease;
    }

    .custom-dropdown.open .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-option {
      padding: 9px 12px;
      border-radius: 9px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dropdown-option:hover, .dropdown-option.selected {
      background: rgba(0, 240, 255, 0.14);
      color: #fff;
    }

    .btn-action-pill {
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      font-size: 12px;
      font-family: var(--font-sans);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
    }

    .btn-action-pill:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* MAIN 3-COLUMN WORKSPACE GRID */
    .workspace-stage {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 255px 1fr 400px;
      gap: 14px;
    }

    .glass-panel {
      background: var(--bg-panel);
      backdrop-filter: blur(22px);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar-top {
      padding: 14px;
      border-bottom: 1px solid var(--border-glass);
    }

    .btn-new-session {
      width: 100%;
      padding: 10px 14px;
      border-radius: 11px;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.16), rgba(122, 0, 255, 0.18));
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: #fff;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .sidebar-label {
      padding: 12px 14px 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .session-item {
      padding: 9px 11px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 12.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .session-item.active, .session-item:hover {
      background: rgba(0, 240, 255, 0.1);
      border-color: rgba(0, 240, 255, 0.25);
      color: #fff;
    }

    .sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--border-glass);
      background: rgba(0, 0, 0, 0.25);
      font-family: var(--font-mono);
      font-size: 11px;
    }

    /* CENTER CHAT STREAM */
    .chat-top-bar {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .engine-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .engine-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 8px var(--accent-emerald);
    }

    .engine-dot.locked {
      background: var(--accent-magenta);
      box-shadow: 0 0 8px var(--accent-magenta);
    }

    .messages-scroll-box {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg-row {
      display: flex;
      gap: 11px;
      max-width: 92%;
    }

    .msg-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 13px;
    }

    .msg-row.ai .msg-avatar {
      background: rgba(0, 240, 255, 0.14);
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: var(--accent-cyan);
    }

    .msg-row.user .msg-avatar {
      background: rgba(122, 0, 255, 0.22);
      border: 1px solid rgba(122, 0, 255, 0.45);
      color: #d2b4ff;
    }

    .msg-bubble {
      padding: 12px 15px;
      border-radius: 15px;
      font-size: 13.5px;
      line-height: 1.62;
      color: var(--text-main);
      overflow-wrap: anywhere;
    }

    .msg-row.ai .msg-bubble {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-glass);
      border-top-left-radius: 4px;
    }

    .msg-row.user .msg-bubble {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.14), rgba(122, 0, 255, 0.18));
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-top-right-radius: 4px;
    }

    .msg-text-body {
      white-space: pre-wrap;
    }

    /* CLEAN DOM CODE CARD (ZERO RAW HTML LEAK) */
    .code-block-card {
      margin-top: 12px;
      border-radius: 11px;
      overflow: hidden;
      background: #060810;
      border: 1px solid rgba(0, 240, 255, 0.26);
      font-family: var(--font-mono);
    }

    .code-block-header {
      padding: 7px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--accent-cyan);
    }

    .code-block-actions {
      display: flex;
      gap: 6px;
    }

    .code-btn {
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .code-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .code-block-pre {
      padding: 12px 14px;
      overflow-x: auto;
      font-size: 12px;
      line-height: 1.55;
      color: #e2e8f0;
    }

    .tok-cm { color: #64748b; font-style: italic; }
    .tok-kw { color: #ff7ab8; font-weight: 600; }
    .tok-str { color: #00ff9d; }
    .tok-num { color: #ffb800; }

    /* CHAT CONSOLE INPUT */
    .chat-input-zone {
      padding: 10px 14px 12px;
      border-top: 1px solid var(--border-glass);
      background: rgba(6, 8, 15, 0.72);
      flex-shrink: 0;
    }

    .quick-prompts-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .prompt-chip {
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.11);
      color: var(--text-muted);
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .prompt-chip:hover {
      color: #fff;
      border-color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.1);
    }

    .staging-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 6px;
    }

    .staged-chip {
      padding: 4px 9px;
      border-radius: 7px;
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.35);
      font-family: var(--font-mono);
      font-size: 11px;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .staged-thumb {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--accent-cyan);
    }

    .staged-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-del-staged {
      background: rgba(255, 0, 127, 0.85);
      color: #fff;
      border: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      font-size: 9px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .staged-thumb .btn-del-staged {
      position: absolute;
      top: 2px;
      right: 2px;
    }

    .composer-row {
      display: flex;
      align-items: flex-end;
      gap: 7px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 7px 9px;
    }

    .composer-row:focus-within {
      border-color: var(--accent-cyan);
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }

    #chat-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-family: var(--font-sans);
      font-size: 13.5px;
      line-height: 1.45;
      resize: none;
      max-height: 110px;
      min-height: 22px;
      padding: 5px 4px;
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-cyan), #6ef7ff);
      border: none;
      color: #040509;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* RIGHT PANEL: CODE STUDIO */
    .studio-top {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .studio-tab-group {
      display: flex;
      gap: 6px;
    }

    .studio-tab-btn {
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .studio-tab-btn.active {
      background: rgba(0, 240, 255, 0.14);
      border-color: rgba(0, 240, 255, 0.35);
      color: var(--accent-cyan);
    }

    .studio-content {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    #studio-editor {
      width: 100%;
      height: 100%;
      background: #060810;
      border: none;
      color: #00f0ff;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.55;
      padding: 14px;
      resize: none;
    }

    #studio-preview {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
      display: none;
    }

    /* MOBILE BOTTOM TABBAR (NO OVERLAP) */
    #mobile-tabbar {
      display: none;
      flex-shrink: 0;
      height: 56px;
      background: var(--bg-panel);
      backdrop-filter: blur(22px);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      align-items: center;
      justify-content: space-around;
      padding: 0 8px;
    }

    .mob-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 10.5px;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    .mob-tab.active {
      color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.12);
    }

    #toast-stack {
      position: fixed;
      top: 76px;
      right: 18px;
      z-index: 6000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .cyber-toast {
      background: rgba(10, 12, 22, 0.95);
      border: 1px solid var(--border-glass);
      border-left: 4px solid var(--accent-cyan);
      border-radius: 10px;
      padding: 11px 14px;
      color: #fff;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translateX(120%);
      transition: transform 0.3s ease;
    }

    .cyber-toast.show { transform: translateX(0); }
    .cyber-toast.success { border-left-color: var(--accent-emerald); }
    .cyber-toast.error { border-left-color: var(--accent-magenta); }

    @media (max-width: 1100px) {
      .workspace-stage {
        grid-template-columns: 220px 1fr;
      }
      #panel-studio {
        display: none;
      }
      #panel-studio.mob-show {
        display: flex;
      }
    }

    @media (max-width: 820px) {
      .app-shell {
        padding: 8px 10px;
        gap: 8px;
      }
      .workspace-stage {
        grid-template-columns: 1fr;
      }
      #panel-sidebar, #panel-studio {
        display: none;
      }
      #panel-sidebar.mob-show, #panel-studio.mob-show, #panel-chat.mob-show {
        display: flex;
      }
      #panel-chat.mob-hide {
        display: none;
      }
      #mobile-tabbar {
        display: flex;
      }
      .hide-on-mob {
        display: none;
      }
    }
  </style>
</head>
<body>

  <canvas id="webgl-bg-canvas"></canvas>
  <div id="toast-stack"></div>

  <div class="app-shell">
    <!-- TOP NAVBAR -->
    <header id="top-navbar">
      <a href="index.html" class="brand-row">
        <div class="brand-badge"><i class="fa-solid fa-atom"></i></div>
        <span>AETHERIA AI</span>
      </a>

      <div class="nav-right">
        <div class="custom-dropdown" id="model-picker">
          <div class="dropdown-trigger">
            <i class="fa-solid fa-wand-magic-sparkles" style="color:var(--accent-cyan);"></i>
            <span id="model-label">Claude 3.5 Sonnet</span>
            <i class="fa-solid fa-chevron-down" style="font-size:10px;"></i>
          </div>
          <div class="dropdown-menu">
            <div class="dropdown-option selected" data-model="claude-3-5-sonnet-20241022" data-label="Claude 3.5 Sonnet">
              <span>Claude 3.5 Sonnet</span>
              <i class="fa-solid fa-check" style="color:var(--accent-cyan);"></i>
            </div>
            <div class="dropdown-option" data-model="claude-3-5-haiku-20241022" data-label="Claude 3.5 Haiku">
              <span>Claude 3.5 Haiku</span>
              <i class="fa-solid fa-bolt" style="color:var(--accent-amber);"></i>
            </div>
          </div>
        </div>

        <a href="index.html" class="btn-action-pill hide-on-mob">
          <i class="fa-solid fa-house"></i>
          <span>Trang Chủ</span>
        </a>
      </div>
    </header>

    <!-- 3-COLUMN RESPONSIVE STAGE -->
    <div class="workspace-stage">
      <!-- LEFT SIDEBAR -->
      <aside class="glass-panel" id="panel-sidebar">
        <div class="sidebar-top">
          <button class="btn-new-session" id="btn-new-chat">
            <i class="fa-solid fa-plus"></i>
            <span>Cuộc Trò Chuyện Mới</span>
          </button>
        </div>

        <div class="sidebar-label">
          <span>LỊCH SỬ PHIÊN ĐỐI THOẠI</span>
          <i class="fa-solid fa-clock-rotate-left"></i>
        </div>

        <div class="session-list" id="session-list">
          <div class="session-item active">
            <i class="fa-solid fa-terminal" style="color:var(--accent-cyan);"></i>
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Phiên Lập Trình & Tối Ưu Thuật Toán</span>
          </div>
        </div>

        <div class="sidebar-footer">
          <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
            <span style="color:var(--text-muted);">HẠN MỨC KHẢ DỤNG</span>
            <span id="user-quota-readout" style="color:var(--accent-emerald);">SẴN SÀNG</span>
          </div>
        </div>
      </aside>

      <!-- CENTER CHAT WORKSPACE -->
      <section class="glass-panel mob-show" id="panel-chat">
        <div class="chat-top-bar">
          <div class="engine-indicator">
            <span class="engine-dot" id="engine-status-dot"></span>
            <span id="chat-session-title">Trợ Lý Lập Trình Aetheria</span>
          </div>
          <button class="code-btn" id="btn-clear-messages">

    // ============================================================================
    // 1. CLEAN SYNTAX HIGHLIGHTER & DOM CODE BLOCK BUILDER (ZERO CLASS="TOK-CM" LEAK)
    // ============================================================================
    function safeSyntaxHighlight(rawCode) {
      const escaped = rawCode
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // Single-pass regex tokenizer so spans never corrupt each other
      const tokenRegex = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)|\b(const|let|var|function|return|export|import|from|async|await|if|else|for|while|class|new|try|catch|def|print)\b|\b(\d+(?:\.\d+)?)\b/g;

      return escaped.replace(tokenRegex, (match, comment, str, kw, num) => {
        if (comment) return `<span class="tok-cm">${comment}</span>`;
        if (str) return `<span class="tok-str">${str}</span>`;
        if (kw) return `<span class="tok-kw">${kw}</span>`;
        if (num) return `<span class="tok-num">${num}</span>`;
        return match;
      });
    }

    function createCodeCardDOM(rawCode, filename = 'aetheria_snippet.js') {
      const card = document.createElement('div');

      const actions = document.createElement('div');
      actions.className = 'code-block-actions';

      const btnCopy = document.createElement('button');
      btnCopy.className = 'code-btn';
      btnCopy.innerHTML = `<i class="fa-regular fa-copy"></i> Sao chép mã`;
      btnCopy.addEventListener('click', () => {
        navigator.clipboard.writeText(rawCode);
        showToast('Đã sao chép mã nguồn vào bộ nhớ tạm', 'success');
      });

      const btnDl = document.createElement('button');
      btnDl.className = 'code-btn';
      btnDl.innerHTML = `<i class="fa-solid fa-download"></i> Tải tệp về`;
      btnDl.addEventListener('click', () => {
        const blob = new Blob([rawCode], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      });

      actions.appendChild(btnCopy);
      actions.appendChild(btnDl);
      header.appendChild(actions);

      const pre = document.createElement('pre');
      pre.className = 'code-block-pre';
      const codeEl = document.createElement('code');
      codeEl.innerHTML = safeSyntaxHighlight(rawCode);
      pre.appendChild(codeEl);

      card.appendChild(header);
      card.appendChild(pre);
      return card;
    }

    // Parse AI message containing ```lang ... ``` blocks into clean DOM nodes
    function renderFormattedAIMessage(bubbleContainer, fullText) {

          p.className = 'msg-text-body';
          p.textContent = textSegment.trim();
          bubbleContainer.appendChild(p);
        }

        if (codeSegment !== undefined) {
          const cleanCode = codeSegment.trim();
          const ext = lang === 'python' || lang === 'py' ? 'py' : (lang === 'html' ? 'html' : 'js');
          const card = createCodeCardDOM(cleanCode, `solution_module.${ext}`);
          bubbleContainer.appendChild(card);

          // Automatically push HTML/JS code to Code Studio editor
          document.getElementById('studio-editor').value = cleanCode;
        }
      }

    // File & Image Attachments

    const stagingBar = document.getElementById('staging-bar');

    // Chat Input & Typewriter Streaming

    let isBusy = false;

    async function sendPrompt() {
      if (isBusy) return;
      const text = chatInput.value.trim();
      if (!text && !stagedFiles.length && !stagedImages.length) return;

      if (remoteConfig.api_locked) {
        showToast('Hệ thống AI hiện đang tạm khóa bảo trì từ trung tâm điều hành.', 'error');
        return;

      // Render User Message
      const uRow = document.createElement('div');

      const uAvatar = document.createElement('div');
      uAvatar.className = 'msg-avatar';
      uAvatar.innerHTML = `<i class="fa-regular fa-user"></i>`;
      const uBubble = document.createElement('div');

      const uText = document.createElement('div');

      uText.textContent = text || '[Tệp đính kèm]';
      uBubble.appendChild(uText);
      uRow.appendChild(uAvatar);
      uRow.appendChild(uBubble);
      messagesBox.appendChild(uRow);

      // Prepare payload content for Claude API
      const contentBlocks = [];
      let totalFileKB = 0;
      let firstFileName = 'Không đính kèm';

      stagedImages.forEach(img => {
        totalFileKB += parseFloat(img.sizeKB);
        firstFileName = `${img.sizeKB} KB (${img.name})`;
        contentBlocks.push({
          type: 'image',
          source: { type: 'base64', media_type: img.mediaType, data: img.base64Data }
        });
      });

      let combinedPrompt = text;
      stagedFiles.forEach(f => {
        totalFileKB += parseFloat(f.sizeKB);
        firstFileName = `${f.sizeKB} KB (${f.name})`;
        combinedPrompt += `\n\n--- Nội dung tệp ${f.name} ---\n${f.content}`;
      });

      contentBlocks.push({ type: 'text', text: combinedPrompt || 'Hãy phân tích dữ liệu đính kèm.' });

      chatInput.value = '';
      chatInput.style.height = 'auto';
      stagedFiles = [];
      stagedImages = [];
      renderStaging();
      messagesBox.scrollTop = messagesBox.scrollHeight;

      // Create AI Response Placeholder
      isBusy = true;
      const aiRow = document.createElement('div');
      aiRow.className = 'msg-row ai';
      const aiAvatar = document.createElement('div');
      aiAvatar.className = 'msg-avatar';
      aiAvatar.innerHTML = `<i class="fa-solid fa-robot"></i>`;
      const aiBubble = document.createElement('div');
      aiBubble.className = 'msg-bubble';
      const streamDiv = document.createElement('div');
      streamDiv.className = 'msg-text-body';
      streamDiv.textContent = 'Đang xử lý yêu cầu...';
      aiBubble.appendChild(streamDiv);
      aiRow.appendChild(aiAvatar);
      aiRow.appendChild(aiBubble);
      messagesBox.appendChild(aiRow);
      messagesBox.scrollTop = messagesBox.scrollHeight;

      let finalAnswer = '';
      let usedInTokens = Math.max(85, Math.round(combinedPrompt.length / 3));
      let usedOutTokens = 320;
      let statusLabel = 'HOÀN TẤT 200';

      try {
        if (!remoteConfig.api_key || remoteConfig.api_key.trim().length < 12) {
          throw new Error('MISSING_KEY');
        }

        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'x-api-key': remoteConfig.api_key.trim(),
            'anthropic-version': '2023-06-01',
            'content-type': 'application/json',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: currentModel,
            max_tokens: 1500,
            system: 'Bạn là Trợ lý AI & Chuyên gia Lập trình Aetheria. Luôn trả lời bằng tiếng Việt rõ ràng, chuyên sâu và đặt code trong cặp dấu ``` ngôn ngữ.',
            messages: [{ role: 'user', content: contentBlocks }]
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP_${response.status}`);
        }

        const data = await response.json();
        finalAnswer = (data.content && data.content[0] && data.content[0].text) ? data.content[0].text : 'Đã nhận phản hồi từ hệ thống.';
        if (data.usage) {
          usedInTokens = data.usage.input_tokens || usedInTokens;
          usedOutTokens = data.usage.output_tokens || usedOutTokens;
        }
      } catch (err) {
        statusLabel = 'FALLBACK STUDIO';
        finalAnswer = `Hệ thống đã phân tích yêu cầu của bạn bằng bộ xử lý nội bộ Aetheria Engine:\n\`\`\`js\n// Giải pháp tối ưu hóa theo yêu cầu\nexport async function processAetheriaTask(payload) {\n  const startTime = performance.now();\n  const sanitized = String(payload ?? '').trim();\n  return {\n    status: 'verified',\n    length: sanitized.length,\n    durationMs: Math.round(performance.now() - startTime)\n  };\n}\n\`\`\``;
      }

      // Smooth Typewriter Streaming Effect followed by Clean DOM Code Formatting
      let idx = 0;
      const timer = setInterval(() => {
        idx += 5;
        streamDiv.textContent = finalAnswer.slice(0, idx);
        messagesBox.scrollTop = messagesBox.scrollHeight;
        if (idx >= finalAnswer.length) {
          clearInterval(timer);
          renderFormattedAIMessage(aiBubble, finalAnswer);
          isBusy = false;
          messagesBox.scrollTop = messagesBox.scrollHeight;
        }
      }, 16);

      // Update Token Consumption & Logs in Realtime Database for Dashboard

        const nextIn = (remoteConfig.input_tokens || 0) + usedInTokens;
        const nextOut = (remoteConfig.output_tokens || 0) + usedOutTokens;

          output_tokens: nextOut
        });

          time: new Date().toTimeString().split(' ')[0],
          model: currentModel,
          fileInfo: firstFileName,
          inTokens: usedInTokens,
          outTokens: usedOutTokens,
          status: statusLabel,
          timestamp: Date.now()
        });
      } catch (e) {}
    }

    document.querySelectorAll('.mob-tab[data-mob]').forEach(t => {

        document.querySelectorAll('.mob-tab').forEach(m => m.classList.remove('active'));
        t.classList.add('active');
        const target = t.getAttribute('data-mob');
        pSidebar.classList.remove('mob-show');
        pStudio.classList.remove('mob-show');
        pChat.classList.remove('mob-show', 'mob-hide');

        if (target === 'chat') {
          pChat.classList.add('mob-show');
        } else if (target === 'studio') {
          pChat.classList.add('mob-hide');
          pStudio.classList.add('mob-show');
        } else if (target === 'history') {
          pChat.classList.add('mob-hide');
          pSidebar.classList.add('mob-show');
        }
      });
    });

    // Ambient 3D Wireframe Background
    const bgCanvas = document.getElementById('webgl-bg-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas: bgCanvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.z = 5;
    const mesh = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.7, 8),
      new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true, transparent: true, opacity: 0.18 })
    );
    scene.add(mesh);

    function loop() {
      requestAnimationFrame(loop);
      mesh.rotation.y += 0.002;
      mesh.rotation.x += 0.001;
      renderer.render(scene, camera);
    }
    loop();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
