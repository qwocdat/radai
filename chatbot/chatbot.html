<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>AETHERIA // AI Coding Assistant</title>
  <link rel="preconnect" href="[https://fonts.googleapis.com](https://fonts.googleapis.com)">
  <link rel="preconnect" href="[https://fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
  <link href="[https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap](https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap)" rel="stylesheet">
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css)" />

  <style>
    :root {
      --bg-dark: #0a0c14;
      --bg-sidebar: #0f121d;
      --bg-bubble-ai: #131726;
      --bg-bubble-user: #1f253d;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #00f0ff;
      --accent-hover: #5ef6ff;
      --text: #f1f5f9;
      --text-muted: #8b96a8;
      --danger: #ff007f;
      --success: #00ff9d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent !important;
      outline: none;
    }

    body {
      width: 100vw;
      height: 100dvh;
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      overflow: hidden;
    }

    /* SIDEBAR (DESKTOP + MOBILE DRAWER) */
    #sidebar {
      width: 270px;
      height: 100%;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
    }

    .sidebar-top {
      padding: 14px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }

    .btn-new-chat {
      flex: 1;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-new-chat:hover {
      background: rgba(0, 240, 255, 0.1);
      border-color: var(--accent);
      color: var(--accent);
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .session-card {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.2s;
    }

    .session-card.active, .session-card:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    .sidebar-bottom {
      padding: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .sidebar-link:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.04);
    }

    /* MAIN CHAT CONTAINER */
    #main-chat {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg-dark);
      min-width: 0;
    }

    /* TOP HEADER */
    .chat-header {
      height: 54px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: rgba(10, 12, 20, 0.85);
      backdrop-filter: blur(14px);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-sidebar-toggle {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      display: none;
    }

    .model-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 13.5px;
      color: #fff;
    }

    .key-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
    }

    .key-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffaa00;
    }

    .key-dot.ready { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .key-dot.error { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

    /* MESSAGES FEED */
    .messages-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .msg-group {
      display: flex;
      gap: 12px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    .msg-group.user {
      flex-direction: row-reverse;
    }

    .msg-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 13px;
    }

    .msg-group.ai .msg-icon {
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: var(--accent);
    }

    .msg-group.user .msg-icon {
      background: rgba(122, 0, 255, 0.2);
      border: 1px solid rgba(122, 0, 255, 0.4);
      color: #d1b3ff;
    }

    .msg-body {
      max-width: calc(100% - 44px);
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }

    .msg-group.ai .msg-body {
      background: var(--bg-bubble-ai);
      border: 1px solid var(--border);
      border-top-left-radius: 2px;
    }

    .msg-group.user .msg-body {
      background: var(--bg-bubble-user);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top-right-radius: 2px;
    }

    /* CODE BLOCKS */
    .code-container {
      margin: 12px 0 6px;
      background: #06070d;
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 8px;
      overflow: hidden;
      font-family: 'JetBrains Mono', monospace;
    }

    .code-top {
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
    }

    .btn-copy {
      background: transparent;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    pre code {
      display: block;
      padding: 12px 14px;
      overflow-x: auto;
      font-size: 12.5px;
      line-height: 1.5;
      color: #c9d1d9;
    }

    /* INPUT CONSOLE BAR (CHATGPT / CLAUDE STYLE) */
    .input-wrapper {
      padding: 12px 16px 16px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      position: relative;
    }

    .composer {
      background: #141724;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .composer:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.15);
    }

    .staged-assets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .asset-tag {
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.3);
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-del-asset {
      background: transparent;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 10px;
    }

    .composer-input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    textarea#prompt-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      max-height: 150px;
      min-height: 24px;
      padding: 4px 0;
    }

    .tool-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .tool-btn:hover { color: #fff; }

    .btn-send {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--accent);
      border: none;
      color: #040509;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background 0.2s;
    }

    .btn-send:hover { background: var(--accent-hover); transform: scale(1.04); }
    .btn-send:disabled { background: #232838; color: #555d73; cursor: not-allowed; transform: none; }

    /* TOAST ALERT */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background: #181c2e;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 13px;
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* RESPONSIVE MOBILE ADJUSTMENTS */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
      }

      #sidebar.open {
        transform: translateX(0);
        box-shadow: 10px 0 30px rgba(0,0,0,0.8);
      }

      .btn-sidebar-toggle { display: block; }
      .messages-viewport { padding: 14px 10px; }
      .input-wrapper { padding: 8px 10px 12px; }
      .msg-group { max-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- TOAST NOTIFICATION -->
  <div id="toast"><i class="fa-solid fa-circle-info" style="color:var(--accent);"></i><span id="toast-text"></span></div>

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-top">
      <button class="btn-new-chat" id="btn-new-chat">
        <i class="fa-solid fa-plus"></i>
        <span>Đoạn chat mới</span>
      </button>
    </div>

    <div class="sidebar-list" id="chat-list">
      <div class="session-card active">
        <i class="fa-regular fa-message"></i>
        <span>Phiên lập trình hiện tại</span>
      </div>
    </div>

    <div class="sidebar-bottom">
      <a href="dashboard.html" class="sidebar-link">
        <i class="fa-solid fa-sliders"></i>
        <span>Cấu hình API Key (Dashboard)</span>
      </a>
      <a href="index.html" class="sidebar-link">
        <i class="fa-solid fa-house"></i>
        <span>Về trang chủ</span>
      </a>
    </div>
  </aside>

  <!-- MAIN CHAT -->
  <main id="main-chat">
    <header class="chat-header">
      <div class="header-left">
        <button class="btn-sidebar-toggle" id="btn-toggle-sidebar">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="model-badge">
          <i class="fa-solid fa-bolt" style="color:var(--accent);"></i>
          <span>Claude 3.5 Sonnet</span>
        </div>
      </div>

      <div class="key-indicator" id="key-badge">
        <span class="key-dot" id="key-dot"></span>
        <span id="key-status-text">Đang đọc API Key...</span>
      </div>
    </header>

    <div class="messages-viewport" id="chat-feed"></div>

    <div class="input-wrapper">
      <div class="composer">
        <div class="staged-assets" id="staged-assets"></div>
        <div class="composer-input-row">
          <input type="file" id="file-picker" accept=".txt,.py,.js,.html,.css,.json" multiple style="display:none;" />
          <input type="file" id="img-picker" accept=".png,.jpg,.jpeg,.webp" multiple style="display:none;" />

          <button class="tool-btn" id="btn-pick-file" title="Đính kèm mã nguồn"><i class="fa-solid fa-paperclip"></i></button>
          <button class="tool-btn" id="btn-pick-img" title="Tải ảnh lên"><i class="fa-regular fa-image"></i></button>

          <textarea id="prompt-input" rows="1" placeholder="Hỏi bất cứ điều gì về lập trình... (Enter để gửi, Shift+Enter xuống dòng)"></textarea>

          <button class="btn-send" id="btn-send">
            <i class="fa-solid fa-arrow-up"></i>
          </button>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "[https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js](https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js)";
    import { getDatabase, ref, onValue, update, push } from "[https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js](https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js)";

    // 1. CẤU HÌNH FIREBASE HỆ THỐNG
    const firebaseConfig = {
      apiKey: "AIzaSyAVuB8m14zkMPs-JTLAKB0Bp18QBKAMBt4",
      authDomain: "ideo-dd376.firebaseapp.com",
      databaseURL: "[https://ideo-dd376-default-rtdb.asia-southeast1.firebasedatabase.app](https://ideo-dd376-default-rtdb.asia-southeast1.firebasedatabase.app)",
      projectId: "ideo-dd376",
      storageBucket: "ideo-dd376.firebasestorage.app",
      messagingSenderId: "689163185",
      appId: "1:689163185:web:af4091213001180f364b90",
      measurementId: "G-QP54CZ2BJT"
    };
    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);

    function notify(text) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3200);
    }

    // 2. GIÁM SÁT API KEY THẬT TỪ FIREBASE
    let activeApiKey = '';
    let isApiLocked = false;
    let inputTokensTotal = 0;
    let outputTokensTotal = 0;

    const keyDot = document.getElementById('key-dot');
    const keyStatusText = document.getElementById('key-status-text');

    onValue(ref(rtdb, 'system_config'), (snapshot) => {
      if (snapshot.exists()) {
        const data = snapshot.val();
        activeApiKey = (data.api_key || '').trim();
        isApiLocked = !!data.api_locked;
        inputTokensTotal = data.input_tokens || 0;
        outputTokensTotal = data.output_tokens || 0;

        if (isApiLocked) {
          keyDot.className = 'key-dot error';
          keyStatusText.textContent = 'API Đang Bị Khóa';
        } else if (activeApiKey.startsWith('sk-ant-')) {
          keyDot.className = 'key-dot ready';
          keyStatusText.textContent = 'API Sẵn Sàng';
        } else {
          keyDot.className = 'key-dot error';
          keyStatusText.textContent = 'Chưa Có API Key';
        }
      } else {
        keyDot.className = 'key-dot error';
        keyStatusText.textContent = 'Chưa Cấu Hình';
      }
    });

    // 3. XỬ LÝ RENDER TIN NHẮN & CODE BLOCK AN TOÀN TUYỆT ĐỐI (TRÁNH LỖI CLASS="TOK-CM")
    const chatFeed = document.getElementById('chat-feed');

    function createCodeCard(codeContent, lang = 'javascript') {
      const container = document.createElement('div');
      container.className = 'code-container';

      const top = document.createElement('div');
      top.className = 'code-top';
      top.innerHTML = `<span><i class="fa-solid fa-code"></i> ${lang}</span>`;

      const btn = document.createElement('button');
      btn.className = 'btn-copy';
      btn.innerHTML = `<i class="fa-regular fa-copy"></i> Sao chép`;
      btn.onclick = () => {
        navigator.clipboard.writeText(codeContent);
        btn.innerHTML = `<i class="fa-solid fa-check"></i> Đã chép`;
        setTimeout(() => btn.innerHTML = `<i class="fa-regular fa-copy"></i> Sao chép`, 2000);
      };
      top.appendChild(btn);

      const pre = document.createElement('pre');
      const code = document.createElement('code');
      code.textContent = codeContent; // textContent an toàn 100%, không bao giờ bị lộ class="tok-cm"
      pre.appendChild(code);

      container.appendChild(top);
      container.appendChild(pre);
      return container;
    }

    function appendMessage(role, text) {
      const group = document.createElement('div');
      group.className = `msg-group ${role}`;

      const icon = document.createElement('div');
      icon.className = 'msg-icon';
      icon.innerHTML = `<i class="fa-solid ${role === 'ai' ? 'fa-robot' : 'fa-user'}"></i>`;

      const body = document.createElement('div');
      body.className = 'msg-body';

      // Parse code blocks ```lang ... ```
      const parts = text.split(/```(\w+)?\n([\s\S]*?)```/g);
      for (let i = 0; i < parts.length; i += 3) {
        const textPart = parts[i];
        const lang = parts[i + 1] || 'code';
        const codePart = parts[i + 2];

        if (textPart && textPart.trim()) {
          const p = document.createElement('div');
          p.style.whiteSpace = 'pre-wrap';
          p.textContent = textPart.trim();
          body.appendChild(p);
        }

        if (codePart !== undefined) {
          body.appendChild(createCodeCard(codePart.trim(), lang));
        }
      }

      group.appendChild(icon);
      group.appendChild(body);
      chatFeed.appendChild(group);
      chatFeed.scrollTop = chatFeed.scrollHeight;
      return body;
    }

    // Tin nhắn chào mừng ban đầu
    appendMessage('ai', 'Chào bạn! Tôi là trợ lý code Aetheria kết nối trực tiếp với Claude 3.5 Sonnet. Tôi có thể giúp bạn viết code, giải thích logic, tìm lỗi hoặc phân tích ảnh đính kèm.');

    // 4. QUẢN LÝ TỆP & ẢNH ĐÍNH KÈM
    let stagedFiles = [];
    let stagedImages = [];
    const stagedAssetsContainer = document.getElementById('staged-assets');

    function renderStaged() {
      stagedAssetsContainer.innerHTML = '';
      stagedFiles.forEach((f, i) => {
        const tag = document.createElement('div');
        tag.className = 'asset-tag';
        tag.innerHTML = `<i class="fa-solid fa-file-code"></i><span>${f.name}</span><button class="btn-del-asset"><i class="fa-solid fa-xmark"></i></button>`;
        tag.querySelector('button').onclick = () => { stagedFiles.splice(i, 1); renderStaged(); };
        stagedAssetsContainer.appendChild(tag);
      });

      stagedImages.forEach((img, i) => {
        const tag = document.createElement('div');
        tag.className = 'asset-tag';
        tag.innerHTML = `<i class="fa-regular fa-image"></i><span>${img.name}</span><button class="btn-del-asset"><i class="fa-solid fa-xmark"></i></button>`;
        tag.querySelector('button').onclick = () => { stagedImages.splice(i, 1); renderStaged(); };
        stagedAssetsContainer.appendChild(tag);
      });
    }

    const filePicker = document.getElementById('file-picker');
    const imgPicker = document.getElementById('img-picker');
    document.getElementById('btn-pick-file').onclick = () => filePicker.click();
    document.getElementById('btn-pick-img').onclick = () => imgPicker.click();

    filePicker.onchange = (e) => {
      Array.from(e.target.files).forEach(f => {
        const r = new FileReader();
        r.onload = (ev) => {
          stagedFiles.push({ name: f.name, content: ev.target.result });
          renderStaged();
        };
        r.readAsText(f);
      });
      filePicker.value = '';
    };

    imgPicker.onchange = (e) => {
      Array.from(e.target.files).forEach(f => {
        const r = new FileReader();
        r.onload = (ev) => {
          stagedImages.push({
            name: f.name,
            mediaType: f.type || 'image/png',
            base64Data: ev.target.result.split(',')[1]
          });
          renderStaged();
        };
        r.readAsDataURL(f);
      });
      imgPicker.value = '';
    };

    // 5. GỬI TIN NHẮN & GỌI TRỰC TIẾP CLAUDE API THẬT
    const promptInput = document.getElementById('prompt-input');
    const btnSend = document.getElementById('btn-send');
    let isWaitingResponse = false;

    // Tự động giãn dòng textarea
    promptInput.addEventListener('input', () => {
      promptInput.style.height = 'auto';
      promptInput.style.height = `${Math.min(promptInput.scrollHeight, 150)}px`;
    });

    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSendMessage();
      }
    });

    async function handleSendMessage() {
      if (isWaitingResponse) return;
      const userText = promptInput.value.trim();
      if (!userText && !stagedFiles.length && !stagedImages.length) return;

      // KIỂM TRA TRẠNG THÁI API KEY TỪ FIREBASE
      if (isApiLocked) {
        notify('API Key đang bị tạm khóa bảo vệ tại Dashboard!');
        return;
      }
      if (!activeApiKey || !activeApiKey.startsWith('sk-ant-')) {
        appendMessage('user', userText || '[Gửi tệp/ảnh]');
        appendMessage('ai', 'Lỗi: Chưa cấu hình Claude API Key! Vui lòng truy cập trang Dashboard (dashboard.html) và nhập API Key hợp lệ của bạn lên Firebase.');
        promptInput.value = '';
        promptInput.style.height = 'auto';
        return;
      }

      // Xây dựng payload gửi lên Claude API
      const userContentPayload = [];

      stagedImages.forEach(img => {
        userContentPayload.push({
          type: 'image',
          source: { type: 'base64', media_type: img.mediaType, data: img.base64Data }
        });
      });

      let fullPromptText = userText;
      stagedFiles.forEach(f => {
        fullPromptText += `\n\n--- Nội dung file: ${f.name} ---\n${f.content}`;
      });

      if (fullPromptText) {
        userContentPayload.push({ type: 'text', text: fullPromptText });
      }

      // Hiển thị tin nhắn người dùng
      appendMessage('user', userText || '[Đã gửi tệp đính kèm]');

      promptInput.value = '';
      promptInput.style.height = 'auto';
      stagedFiles = [];
      stagedImages = [];
      renderStaged();

      // Placeholder chờ phản hồi từ AI
      isWaitingResponse = true;
      btnSend.disabled = true;

      const aiMsgGroup = document.createElement('div');
      aiMsgGroup.className = 'msg-group ai';
      aiMsgGroup.innerHTML = `
        <div class="msg-icon"><i class="fa-solid fa-robot"></i></div>
        <div class="msg-body"><span id="ai-typing"><i class="fa-solid fa-circle-notch fa-spin"></i> Đang kết nối Claude API...</span></div>
      `;
      chatFeed.appendChild(aiMsgGroup);
      chatFeed.scrollTop = chatFeed.scrollHeight;

      const aiBodyContainer = aiMsgGroup.querySelector('.msg-body');

      try {
        const response = await fetch('[https://api.anthropic.com/v1/messages](https://api.anthropic.com/v1/messages)', {
          method: 'POST',
          headers: {
            'x-api-key': activeApiKey,
            'anthropic-version': '2023-06-01',
            'content-type': 'application/json',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: 'claude-3-5-sonnet-20241022',
            max_tokens: 3000,
            system: 'Bạn là chuyên gia lập trình cấp cao Aetheria. Trả lời bằng tiếng Việt ngắn gọn, trực diện, giải thích súc tích và luôn định dạng code bên trong cặp ```tên_ngôn_ngữ.',
            messages: [{ role: 'user', content: userContentPayload }]
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || `Lỗi HTTP ${response.status}`);
        }

        const data = await response.json();
        const aiResponseText = data.content && data.content[0] ? data.content[0].text : 'Không nhận được văn bản từ AI.';

        // Xóa thông báo typing và in nội dung chuẩn
        aiBodyContainer.innerHTML = '';
        const parts = aiResponseText.split(/```(\w+)?\n([\s\S]*?)```/g);
        for (let i = 0; i < parts.length; i += 3) {
          const txt = parts[i];
          const lang = parts[i + 1] || 'code';
          const cd = parts[i + 2];
          if (txt && txt.trim()) {
            const p = document.createElement('div');
            p.style.whiteSpace = 'pre-wrap';
            p.textContent = txt.trim();
            aiBodyContainer.appendChild(p);
          }
          if (cd !== undefined) {
            aiBodyContainer.appendChild(createCodeCard(cd.trim(), lang));
          }
        }

        // Cập nhật số token tiêu thụ về Firebase RTDB để đồng bộ Dashboard
        if (data.usage) {
          const inT = data.usage.input_tokens || 0;
          const outT = data.usage.output_tokens || 0;
          await update(ref(rtdb, 'system_config'), {
            input_tokens: inputTokensTotal + inT,
            output_tokens: outputTokensTotal + outT
          });
          await push(ref(rtdb, 'request_logs'), {
            time: new Date().toTimeString().split(' ')[0],
            model: 'claude-3-5-sonnet',
            fileInfo: 'Yêu cầu từ Chatbot',
            inTokens: inT,
            outTokens: outT,
            status: '200 OK',
            timestamp: Date.now()
          });
        }
      } catch (err) {
        aiBodyContainer.innerHTML = `<span style="color:var(--danger);"><i class="fa-solid fa-triangle-exclamation"></i> Lỗi gọi API: ${err.message}</span>`;
      } finally {
        isWaitingResponse = false;
        btnSend.disabled = false;
        chatFeed.scrollTop = chatFeed.scrollHeight;
      }
    }

    btnSend.addEventListener('click', handleSendMessage);

    // Sidebar Mobile Toggle
    const sidebar = document.getElementById('sidebar');
    document.getElementById('btn-toggle-sidebar').onclick = () => sidebar.classList.toggle('open');
    document.getElementById('main-chat').onclick = (e) => {
      if (window.innerWidth <= 768 && sidebar.classList.contains('open') && !e.target.closest('#sidebar') && !e.target.closest('#btn-toggle-sidebar')) {
        sidebar.classList.remove('open');
      }
    };

    document.getElementById('btn-new-chat').onclick = () => {
      chatFeed.innerHTML = '';
      appendMessage('ai', 'Cuộc trò chuyện mới đã bắt đầu. Bạn muốn viết ứng dụng hoặc giải quyết bài toán nào?');
      if (window.innerWidth <= 768) sidebar.classList.remove('open');
    };
  </script>
</body>
</html>
