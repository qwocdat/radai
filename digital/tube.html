<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #0f0f0f;
            color: #f1f1f1;
        }

        /* YouTube Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f0f0f;
        }
        ::-webkit-scrollbar-thumb {

            border-radius: 4px;

        .yt-card {
            background-color: #1f1f1f;
            border-radius: 12px;

        }
        .yt-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;

            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#0f0f0f] text-gray-100">

    <!-- YouTube-style Header (Clean - No Admin/Firebase leaks) -->
    <header class="sticky top-0 z-50 bg-[#0f0f0f]/95 backdrop-blur border-b border-[#272727] px-4 py-2.5 flex items-center justify-between">
        <div class="flex items-center space-x-4">
            <button onclick="goHome()" class="p-2 hover:bg-[#272727] rounded-full text-gray-300">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <a href="javascript:void(0)" onclick="goHome()" class="flex items-center space-x-2 text-white font-bold text-xl tracking-tighter">
                <div class="w-8 h-6 bg-red-600 rounded-lg flex items-center justify-center">
                    <i class="fa-solid fa-play text-xs text-white"></i>
                </div>
                <span>DigitalTube <span class="text-xs text-gray-400 font-normal">VN</span></span>
            </a>
        </div>

        <!-- Search Bar -->
        <div class="flex-1 max-w-2xl mx-4 hidden md:flex items-center">
            <div class="flex w-full bg-[#121212] border border-[#303030] rounded-full overflow-hidden focus-within:border-blue-500">
                <input type="text" id="searchInput" onkeyup="handleSearch(event)" placeholder="Tìm kiếm phim, tập phim..." class="w-full bg-transparent px-5 py-2 text-sm text-gray-200 outline-none placeholder-gray-500">
                <button onclick="executeSearch()" class="bg-[#222222] px-6 border-l border-[#303030] hover:bg-[#272727] text-gray-300">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <button class="p-2 hover:bg-[#272727] rounded-full text-gray-300 md:hidden" onclick="executeSearch()">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-xs text-white">
                USER
            </div>
        </div>
    </header>

    <!-- Main Content Dynamic Container -->
    <main class="flex-1 max-w-[1800px] w-full mx-auto p-4 md:p-6">
        
        <!-- VIEW 1: HOME GRID (Danh Sách Phim) -->
        <section id="homeView" class="block">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-fire text-red-500"></i> Phim & Series Nổi Bật
                    </h1>
                    <p class="text-xs text-gray-400 mt-1">Chọn một bộ phim để bắt đầu xem các tập</p>
                </div>
            </div>

            <!-- Movies Grid -->
            <div id="moviesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5">
                <div class="col-span-full py-16 text-center text-gray-400">
                    <i class="fa-solid fa-circle-notch animate-spin text-3xl text-red-600 mb-3"></i>
                    <p>Đang tải danh sách phim từ hệ thống...</p>
                </div>
            </div>
        </section>

        <!-- VIEW 2: WATCH PLAYER VIEW (Trình Xem Phim & Chọn Tập) -->
        <section id="watchView" class="hidden">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                
                <!-- Left Video Player + Details (8 cols) -->
                <div class="lg:col-span-8 flex flex-col space-y-4">
                    
                    <!-- Video Canvas/Player -->
                    <div id="playerWrapper" class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-[#272727]">
                        <video id="videoPlayer" class="w-full h-full object-contain" controls autoplay playsinline></video>
                    </div>

                    <!-- Video Details Title & Actions -->
                    <div class="bg-[#1f1f1f] p-5 rounded-2xl space-y-3 border border-[#272727]">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
                            <div>
                                <h1 id="movieTitleDisplay" class="text-xl sm:text-2xl font-bold text-white">Đang tải tên phim...</h1>
                                <h2 id="episodeTitleDisplay" class="text-sm font-semibold text-red-500 mt-0.5">Tập --</h2>
                            </div>
                            
                            <!-- Engagement Buttons -->
                            <div class="flex items-center space-x-2">
                                <button onclick="toggleLike()" id="likeBtn" class="flex items-center space-x-2 px-4 py-2 rounded-full bg-[#272727] hover:bg-[#3f3f3f] text-sm font-medium transition-colors">
                                    <i class="fa-regular fa-thumbs-up"></i>
                                    <span id="likeCount">1.4K</span>
                                </button>
                                <button onclick="copyShareLink()" class="flex items-center space-x-2 px-4 py-2 rounded-full bg-[#272727] hover:bg-[#3f3f3f] text-sm font-medium transition-colors">
                                    <i class="fa-solid fa-share"></i>
                                    <span>Chia sẻ</span>
                                </button>
                            </div>
                        </div>

                        <div class="bg-[#121212] p-4 rounded-xl text-sm text-gray-300 space-y-2 border border-[#272727]">
                            <div class="flex items-center space-x-3 text-xs text-gray-400 font-medium">
                                <span><i class="fa-solid fa-eye mr-1"></i> <span id="viewsCount">12,450</span> lượt xem</span>
                                <span>•</span>
                                <span id="movieYear">2026</span>
                                <span>•</span>
                                <span id="episodesTotalBadge" class="bg-red-600/20 text-red-400 px-2 py-0.5 rounded">0 tập</span>
                            </div>
                            <p id="movieDescriptionDisplay" class="text-xs sm:text-sm leading-relaxed text-gray-300">
                                Mô tả phim...
                            </p>
                        </div>
                    </div>

                </div>

                <!-- Right Playlist Episodes Column (4 cols) -->
                <div class="lg:col-span-4 flex flex-col space-y-4">
                    <div class="bg-[#1f1f1f] rounded-2xl p-4 border border-[#272727] flex flex-col h-full max-h-[750px]">
                        
                        <div class="flex items-center justify-between pb-3 mb-3 border-b border-[#2f2f2f]">
                            <div class="flex items-center space-x-2">
                                <i class="fa-solid fa-list-ul text-red-500"></i>
                                <h3 class="font-bold text-white text-base">Danh Sách Tập Phim</h3>
                            </div>
                            <span id="epListBadge" class="text-xs bg-[#272727] text-gray-300 px-2.5 py-1 rounded-full font-mono">0 tập</span>
                        </div>

                        <!-- Episodes Scroll Container -->
                        <div id="episodesListContainer" class="flex-1 overflow-y-auto space-y-2 pr-1">
                            <!-- Populated by JS -->
                        </div>

                    </div>
                </div>

            </div>
        </section>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Configuration (Project ideo-dd376)
        const firebaseConfig = {
            apiKey: "AIzaSyAVuB8m14zkMPs-JTLAKB0Bp18QBKAMBt4",
            authDomain: "ideo-dd376.firebaseapp.com",
            projectId: "ideo-dd376",
            storageBucket: "ideo-dd376.firebasestorage.app",
            messagingSenderId: "689163185",
            appId: "1:689163185:web:f4e11f000a5afc3a364b90",
            databaseURL: "https://ideo-dd376-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // State Store
        let moviesData = {};
        let currentMovie = null;
        let currentEpIndex = 0;
        let isLiked = false;

        const videoPlayer = document.getElementById('videoPlayer');

        window.addEventListener('DOMContentLoaded', () => {
            initRouter();
        });

        // Listen for Realtime Database Updates
        function initRouter() {
            const moviesRef = ref(db, 'movies');
            onValue(moviesRef, (snapshot) => {
                const data = snapshot.val();
                moviesData = data || {};
                
                // Parse URL Query Params (?v=MOVIE_ID&ep=EP_INDEX)
                const urlParams = new URLSearchParams(window.location.search);
                const movieId = urlParams.get('v');
                const epParam = urlParams.get('ep');

                if (movieId && moviesData[movieId]) {
                    renderWatchView(movieId, epParam ? parseInt(epParam) : 0);
                } else {
                    renderHomeView();
                }
            });
        }

        // Render Home Grid
        function renderHomeView() {
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('watchView').classList.add('hidden');

            const grid = document.getElementById('moviesGrid');
            const keys = Object.keys(moviesData);

            if (keys.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 text-center text-gray-500">
                        <i class="fa-solid fa-film text-4xl mb-3"></i>
                        <p class="text-base font-medium">Chưa có phim nào được thêm vào hệ thống.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = keys.map(id => {
                const movie = moviesData[id];
                const epCount = movie.episodes ? Object.keys(movie.episodes).length : 0;
                const thumb = movie.thumbnail || 'https://placehold.co/600x350/1f1f1f/ffffff?text=DigitalTube';

                return `
                    <div onclick="selectMovie('${id}')" class="yt-card cursor-pointer group">
                        <div class="relative aspect-video w-full overflow-hidden bg-black">
                            <img src="${thumb}" alt="${movie.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='https://placehold.co/600x350/1f1f1f/ffffff?text=Video'">
                            <span class="absolute bottom-2 right-2 bg-black/80 text-xs px-2 py-0.5 rounded text-gray-200 font-mono">
                                ${epCount} tập
                            </span>
                        </div>
                        <div class="p-3.5 space-y-1.5">
                            <h3 class="font-bold text-sm text-gray-100 line-clamp-2 leading-snug group-hover:text-red-500 transition-colors">
                                ${movie.title}
                            </h3>
                            <p class="text-xs text-gray-400 line-clamp-2">
                                ${movie.description || 'Chưa có mô tả phim.'}
                            </p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Render Watch View
        function renderWatchView(movieId, epIndex = 0) {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('watchView').classList.remove('hidden');

            currentMovie = { id: movieId, ...moviesData[movieId] };
            const rawEpisodes = currentMovie.episodes ? Object.values(currentMovie.episodes) : [];
            
            // Sort episodes by order
            const episodes = rawEpisodes.sort((a, b) => (a.order || 0) - (b.order || 0));
            currentEpIndex = (epIndex >= 0 && epIndex < episodes.length) ? epIndex : 0;

            // Update Metadata
            document.getElementById('movieTitleDisplay').innerText = currentMovie.title;
            document.getElementById('movieDescriptionDisplay').innerText = currentMovie.description || 'Không có mô tả.';
            document.getElementById('episodesTotalBadge').innerText = `${episodes.length} tập phim`;
            document.getElementById('epListBadge').innerText = `${episodes.length} tập`;

            // Render Episodes Playlist Sidebar
            const epContainer = document.getElementById('episodesListContainer');
            
            if (episodes.length === 0) {
                epContainer.innerHTML = `<div class="p-4 text-center text-gray-500 text-xs">Phim này chưa cập nhật tập video nào.</div>`;
                videoPlayer.src = "";
                document.getElementById('episodeTitleDisplay').innerText = "Chưa có tập phim";
                return;
            }

            epContainer.innerHTML = episodes.map((ep, idx) => {
                const isActive = idx === currentEpIndex;
                return `
                    <div onclick="switchEpisode(${idx})" class="p-3 rounded-xl flex items-center space-x-3 cursor-pointer transition-all border ${isActive ? 'bg-red-600/15 border-red-500/50 text-white' : 'bg-[#121212] hover:bg-[#272727] border-transparent text-gray-300'}">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-xs ${isActive ? 'bg-red-600 text-white' : 'bg-[#272727] text-gray-400'}">
                            ${ep.order || idx + 1}
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="text-xs font-semibold truncate ${isActive ? 'text-red-400' : 'text-gray-200'}">${ep.title}</h4>
                            <p class="text-[10px] text-gray-500 font-mono mt-0.5">${ep.duration || 'Full HD'}</p>
                        </div>
                        ${isActive ? '<i class="fa-solid fa-volume-high text-xs text-red-500 animate-pulse"></i>' : ''}
                    </div>
                `;
            }).join('');

            // Play Selected Episode
            const targetEp = episodes[currentEpIndex];
            document.getElementById('episodeTitleDisplay').innerText = `Đang phát: ${targetEp.title}`;
            
            if (targetEp.url !== videoPlayer.src) {
                videoPlayer.src = targetEp.url;
                videoPlayer.play().catch(() => {});
            }

            // Auto Play Next Episode when video ends
            videoPlayer.onended = () => {
                if (currentEpIndex + 1 < episodes.length) {
                    switchEpisode(currentEpIndex + 1);
                }
            };
        }

        // Global Action Functions
        window.selectMovie = function(id) {
            window.history.pushState({}, '', `tube.html?v=${id}`);
            renderWatchView(id, 0);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.switchEpisode = function(idx) {
            if (!currentMovie) return;
            window.history.pushState({}, '', `tube.html?v=${currentMovie.id}&ep=${idx}`);
            renderWatchView(currentMovie.id, idx);
        };

        window.goHome = function() {
            window.history.pushState({}, '', 'tube.html');
            if (videoPlayer) videoPlayer.pause();
            renderHomeView();
        };

        window.copyShareLink = function() {
            const url = window.location.href;
            navigator.clipboard.writeText(url);
            alert("Đã sao chép đường dẫn phim/tập vào bộ nhớ tạm!");
        };

        window.toggleLike = function() {
            const btn = document.getElementById('likeBtn');
            const count = document.getElementById('likeCount');
            isLiked = !isLiked;
            if (isLiked) {
                btn.classList.add('bg-red-600', 'text-white');
                count.innerText = "1.4K+";
            } else {
                btn.classList.remove('bg-red-600', 'text-white');
                count.innerText = "1.4K";
            }
        };

        window.handleSearch = function(e) {
            if (e.key === 'Enter') executeSearch();
        };

        window.executeSearch = function() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) return;

            // Filter movies by search
            const filteredKeys = Object.keys(moviesData).filter(id => {
                const m = moviesData[id];
                return m.title.toLowerCase().includes(query) || (m.description && m.description.toLowerCase().includes(query));
            });

            if (document.getElementById('homeView').classList.contains('hidden')) {
                goHome();
            }

            const grid = document.getElementById('moviesGrid');
            if (filteredKeys.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-gray-400">Không tìm thấy phim phù hợp với từ khóa "${query}"</div>`;
            } else {
                const tempObj = {};
                filteredKeys.forEach(k => tempObj[k] = moviesData[k]);
                moviesData = tempObj;
                renderHomeView();
            }
        };
    </script>
</body>
</html>
