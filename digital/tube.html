<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigitalTube - Trình Phát Video</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #05060a;
            --bg-surface: #0d1018;
            --bg-card: rgba(18, 22, 33, 0.7);
            --accent: #6366f1;
            --accent-2: #a855f7;
            --accent-3: #ec4899;
            --accent-glow: rgba(99, 102, 241, 0.55);
            --accent-glow-strong: rgba(99, 102, 241, 0.9);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(13, 16, 24, 0.72);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        html { scroll-behavior: smooth; }
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== AURORA BACKGROUND BLOBS ===== */
        .aurora-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        .aurora-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: floatBlob 22s ease-in-out infinite;
        }
        .blob-1 {
            width: 520px; height: 520px;
            background: radial-gradient(circle, #6366f1, transparent 70%);
            top: -180px; left: -120px;
        }
        .blob-2 {
            width: 480px; height: 480px;
            background: radial-gradient(circle, #a855f7, transparent 70%);
            top: 40%; right: -160px;
            animation-delay: -7s;
        }
        .blob-3 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #ec4899, transparent 70%);
            bottom: -140px; left: 30%;
            animation-delay: -14s;
            opacity: 0.28;
        }
        @keyframes floatBlob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, -40px) scale(1.1); }
            66% { transform: translate(-40px, 50px) scale(0.95); }
        }

        /* ===== HEADER ===== */
        header {
            height: 68px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* ===== LOGO GLOW ===== */
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #fff;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: -0.5px;
            position: relative;
            padding: 6px 4px;
            transition: transform 0.25s ease;
            cursor: pointer;
            user-select: none;
        }

        .brand-logo .icon-wrapper {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 15px var(--accent-glow),
                0 0 30px rgba(168, 85, 247, 0.35),
                inset 0 0 8px rgba(255,255,255,0.25);
            transition: all 0.35s ease;
            position: relative;
            z-index: 2;
        }

        .brand-logo .icon-wrapper::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 13px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
            filter: blur(10px);
            opacity: 0.6;
            z-index: -1;
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.08); }
        }

        .brand-text {
            background: linear-gradient(90deg, #fff 0%, #fff 40%, #a5b4fc 55%, #c4b5fd 65%, #fff 80%);
            background-size: 220% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            background-position: 0% center;
            transition: all 0.3s ease;
        }

        .brand-logo:hover { transform: translateY(-1px); }
        .brand-logo:hover .icon-wrapper {
            box-shadow:
                0 0 25px var(--accent-glow-strong),
                0 0 50px rgba(168, 85, 247, 0.55),
                0 0 80px rgba(236, 72, 153, 0.35),
                inset 0 0 12px rgba(255,255,255,0.4);
            transform: rotate(-6deg) scale(1.08);
        }
        .brand-logo:hover .brand-text {
            animation: shimmerText 1.4s linear infinite;
            filter: drop-shadow(0 0 12px rgba(165, 180, 252, 0.7));
        }

        @keyframes shimmerText { to { background-position: 220% center; } }

        .brand-logo:active { transform: scale(0.97); }
        .brand-logo.clicked .icon-wrapper { animation: clickBurst 0.6s ease-out; }
        @keyframes clickBurst {
            0% { transform: scale(1) rotate(0); }
            30% { transform: scale(1.35) rotate(-12deg); box-shadow: 0 0 60px #fff, 0 0 100px var(--accent-glow-strong); }
            60% { transform: scale(0.95) rotate(6deg); }
            100% { transform: scale(1) rotate(0); }
        }

        /* ===== SEARCH ===== */
        .search-container {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 8px 20px;
            width: 38%;
            max-width: 480px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .search-container:focus-within {
            border-color: var(--accent);
            box-shadow:
                0 0 0 3px rgba(99, 102, 241, 0.15),
                0 0 24px var(--accent-glow),
                inset 0 0 12px rgba(99, 102, 241, 0.08);
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-1px);
        }

        .search-container input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 14px;
        }
        .search-container input::placeholder { color: #6b7280; }

        .search-container i {
            color: var(--text-sub);
            margin-left: 10px;
            transition: color 0.3s ease, transform 0.3s ease;
        }
        .search-container:focus-within i {
            color: var(--accent);
            transform: scale(1.15);
            filter: drop-shadow(0 0 6px var(--accent-glow));
        }

        /* ===== MAIN ===== */
        main { flex: 1; padding: 36px 28px; max-width: 1680px; margin: 0 auto; width: 100%; position: relative; }

        /* ===== HOME ===== */
        .home-section-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 26px;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.3px;
        }
        .home-section-title i {
            filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.8));
            animation: fireFlicker 2s ease-in-out infinite;
        }
        @keyframes fireFlicker {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.12); opacity: 0.85; }
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .movie-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            isolation: isolate;
        }

        .movie-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 3;
            pointer-events: none;
        }

        .movie-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(99,102,241,0.15), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 2;
        }

        .movie-card:hover {
            transform: translateY(-8px) scale(1.015);
            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.6),
                0 0 30px rgba(99, 102, 241, 0.25),
                0 0 60px rgba(168, 85, 247, 0.15);
        }
        .movie-card:hover::before { opacity: 1; }
        .movie-card:hover::after { opacity: 1; }

        .thumb-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            position: relative;
            overflow: hidden;
            background: #1a1d28;
        }

        .movie-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), filter 0.4s ease;
        }

        .movie-card:hover .movie-thumb {
            transform: scale(1.08);
            filter: brightness(1.05) saturate(1.1);
        }

        .ep-badge-tag {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(9, 10, 15, 0.85);
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 11px;
            border-radius: 7px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
            z-index: 2;
        }
        .movie-card:hover .ep-badge-tag {
            background: rgba(99, 102, 241, 0.9);
            box-shadow: 0 0 20px var(--accent-glow-strong);
            border-color: rgba(255,255,255,0.3);
        }

        .movie-meta { padding: 16px; position: relative; z-index: 2; }
        .movie-title {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 8px;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.3s ease;
        }
        .movie-card:hover .movie-title { color: #c7d2fe; }
        .movie-desc {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ===== WATCH LAYOUT ===== */
        .back-bar {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: #fff;
            padding: 9px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .back-btn:hover {
            background: rgba(99,102,241,0.15);
            border-color: var(--accent);
            box-shadow: 0 0 18px var(--accent-glow);
            transform: translateX(-3px);
        }

        .player-layout { display: grid; grid-template-columns: 1fr 380px; gap: 28px; }
        @media (max-width: 1100px) { .player-layout { grid-template-columns: 1fr; } }

        .video-wrapper {
            width: 100%;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 16/9;
            box-shadow:
                0 25px 50px rgba(0,0,0,0.85),
                0 0 40px rgba(99, 102, 241, 0.18);
            border: 1px solid var(--border);
            position: relative;
            transition: box-shadow 0.4s ease;
        }
        .video-wrapper:hover {
            box-shadow:
                0 25px 50px rgba(0,0,0,0.85),
                0 0 55px rgba(99, 102, 241, 0.35),
                0 0 90px rgba(168, 85, 247, 0.15);
        }
        .video-wrapper::after {
            content: 'ĐANG PHÁT';
            position: absolute;
            top: 14px;
            left: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 5px 12px;
            border-radius: 6px;
            box-shadow: 0 0 16px var(--accent-glow-strong);
            z-index: 3;
            animation: livePulse 2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes livePulse {
            0%, 100% { box-shadow: 0 0 16px var(--accent-glow-strong); }
            50% { box-shadow: 0 0 26px var(--accent-glow-strong), 0 0 40px rgba(168,85,247,0.6); }
        }

        video { width: 100%; height: 100%; outline: none; display: block; background: #000; }

        .video-info-box { margin-top: 22px; }
        .video-headline {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 14px;
            color: #fff;
            letter-spacing: -0.3px;
            line-height: 1.3;
        }
        .video-headline span {
            background: linear-gradient(90deg, #a5b4fc, #c4b5fd);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .video-description {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: 14px;
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.65;
            position: relative;
            overflow: hidden;
        }
        .video-description::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--accent), var(--accent-2));
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* ===== SIDEBAR ===== */
        .episodes-sidebar {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border);
            height: fit-content;
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }

        .sidebar-title {
            font-size: 17px;
            font-weight: 700;
            padding-bottom: 14px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-title span:last-child {
            font-size: 12px;
            color: #a5b4fc;
            background: rgba(99,102,241,0.15);
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid rgba(99,102,241,0.3);
        }

        .episodes-list-scroll {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
        }
        .episodes-list-scroll::-webkit-scrollbar { width: 6px; }
        .episodes-list-scroll::-webkit-scrollbar-track { background: transparent; }
        .episodes-list-scroll::-webkit-scrollbar-thumb {
            background: rgba(99,102,241,0.3);
            border-radius: 4px;
        }
        .episodes-list-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(99,102,241,0.6);
        }

        .ep-card-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .ep-card-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(3px);
            border-color: rgba(99,102,241,0.3);
        }

        .ep-card-item.active {
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.08));
            border-color: var(--accent);
            box-shadow:
                0 0 20px rgba(99,102,241,0.35),
                inset 0 0 20px rgba(99,102,241,0.08);
        }
        .ep-card-item.active::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--accent), var(--accent-2));
            box-shadow: 0 0 10px var(--accent-glow-strong);
        }

        .ep-card-num {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 5px 9px;
            border-radius: 7px;
            box-shadow: 0 0 10px var(--accent-glow);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .ep-card-item.active .ep-card-num {
            box-shadow: 0 0 18px var(--accent-glow-strong);
        }

        .ep-card-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .ep-card-item i.fa-circle-play {
            color: var(--text-sub);
            transition: all 0.25s ease;
        }
        .ep-card-item:hover i.fa-circle-play,
        .ep-card-item.active i.fa-circle-play {
            color: var(--accent);
            filter: drop-shadow(0 0 6px var(--accent-glow));
            transform: scale(1.15);
        }

        /* ===== LOADING SKELETON ===== */
        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }
        .skeleton-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .skeleton-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: linear-gradient(90deg, #1a1d28 25%, #232736 50%, #1a1d28 75%);
            background-size: 200% 100%;
            animation: shimmerSkeleton 1.5s infinite;
        }
        .skeleton-meta { padding: 16px; }
        .skeleton-line {
            height: 12px;
            border-radius: 6px;
            background: linear-gradient(90deg, #1a1d28 25%, #232736 50%, #1a1d28 75%);
            background-size: 200% 100%;
            animation: shimmerSkeleton 1.5s infinite;
            margin-bottom: 10px;
        }
        .skeleton-line.short { width: 60%; }
        @keyframes shimmerSkeleton {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .loading-view {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-sub);
            font-size: 15px;
        }
        .loading-view i {
            font-size: 32px;
            color: var(--accent);
            margin-bottom: 12px;
            display: inline-block;
            filter: drop-shadow(0 0 15px var(--accent-glow));
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(239, 68, 68, 0.95);
            color: #fff;
            padding: 12px 22px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(239,68,68,0.4);
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 90vw;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* ===== MOBILE ===== */
        @media (max-width: 700px) {
            header { padding: 0 16px; height: 62px; }
            .brand-logo { font-size: 17px; gap: 9px; }
            .brand-logo .icon-wrapper { width: 32px; height: 32px; }
            .search-container { width: 48%; padding: 7px 14px; }
            .search-container input { font-size: 13px; }
            main { padding: 22px 16px; }
            .home-section-title { font-size: 19px; }
            .movies-grid, .skeleton-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
            .movie-meta { padding: 12px; }
            .movie-title { font-size: 14px; }
            .movie-desc { font-size: 12px; }
            .video-headline { font-size: 18px; }
        }

        /* ================================================================
           ===== LIQUID GLASS TAB BAR (tích hợp từ index-2.html) ==========
           ================================================================ */
        #gl {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;   /* để không chặn thao tác trang */
            z-index: 9998;
        }

        #tabbar {
            position: fixed;
            left: 14px;
            right: 14px;
            bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            max-width: 380px;
            margin: 0 auto;
            padding: 5px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            z-index: 9999;
        }
        #tabbar .row {
            position: relative;
            display: flex;
            gap: 4px;
        }
        #tabbar .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 7px 0 6px;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: transparent;
            font: 500 12px/1 Roboto, "Segoe UI", system-ui, sans-serif;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        #tabbar .tab svg {
            width: 23px;
            height: 23px;
            opacity: 0;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        #tabbar .ico { height: 23px; display: block; }

        /* =================== TOAST =================== */
        function showToast(msg) {
            let t = document.querySelector('.toast');
            if (!t) {
                t = document.createElement('div');
                t.className = 'toast';
                document.body.appendChild(t);
            }
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._tid);
            t._tid = setTimeout(() => t.classList.remove('show'), 4000);
        }

        /* =========================================================
           [MỚI] CHUẨN HOÁ LINK VIDEO
           - Dropbox share link  → dl.dropboxusercontent.com (direct)
           - Google Drive share  → uc?export=download&id=...
           - Link khác giữ nguyên
           ========================================================= */
        function normalizeVideoUrl(url) {
            if (!url || typeof url !== 'string') return url;
            url = url.trim();

            /* ---------- DROPBOX ---------- */
            if (/dropbox\.com/i.test(url)) {
                try {
                    const u = new URL(url);
                    const rlkey = u.searchParams.get('rlkey');

                    // Link dạng mới: /scl/fi/<id>/<filename>
                    // Link dạng cũ:   /s/<id>/<filename>
                    // Giữ nguyên path, chuyển host sang dl.dropboxusercontent.com
                    const newUrl = new URL('https://dl.dropboxusercontent.com' + u.pathname);
                    if (rlkey) newUrl.searchParams.set('rlkey', rlkey);

                    return newUrl.toString();
                } catch (e) {
                    // Fallback nếu URL constructor lỗi
                    return url
                        .replace('www.dropbox.com', 'dl.dropboxusercontent.com')
                        .replace('dropbox.com/s/', 'dropboxusercontent.com/s/')
                        .replace(/[?&](dl|raw|st|e)=[^&]*/g, '')
                        .replace(/\?&/, '?')
                        .replace(/[?&]$/, '');
                }
            }

            /* ---------- GOOGLE DRIVE ---------- */
            if (/drive\.google\.com/i.test(url)) {
                const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                if (m) {
                    return `https://drive.google.com/uc?export=download&id=${m[1]}`;
                }
            }

            /* ---------- ONEDRIVE ---------- */
            if (/1drv\.ms|onedrive\.live\.com/i.test(url)) {
                // Thêm download=1 nếu chưa có
                if (!/[?&]download=1/.test(url)) {
                    return url + (url.includes('?') ? '&' : '?') + 'download=1';
                }
            }

            return url;

    <script>

uniform sampler2D uBn,uBp;
uniform vec4 uNav,uPill,uMask;uniform vec3 uPtr;uniform vec3 uTint,uPillCol;uniform float uTintA;
float sdRB(vec2 q,vec2 b,float r){vec2 d=abs(q)-(b-r);return length(max(d,0.))+min(max(d.x,d.y),0.)-r;}
float sdCap(vec2 q,float hw,float hh){return length(vec2(max(abs(q.x)-(hw-hh),0.),q.y))-hh;}
vec4 compose(vec2 p,float cl){
  vec2 nc=uNav.xy+uNav.zw*.5;
  float dn=sdCap(p-nc,uNav.z*.5,uNav.w*.5);
  float a=smoothstep(.8,-.8,dn);
  vec3 col=uTint;
  float ga=uTintA*(1.-.45*cl);
  /* viền sáng mảnh bên trong thành kính */
  col+=vec3(1.)*.26*(1.-smoothstep(0.,1.6,abs(dn+.8)));
  /* gradient nhẹ: phía trên sáng hơn */
  col+=vec3(1.)*.05*(1.-smoothstep(-uNav.w*.5,uNav.w*.5,p.y-nc.y));
  /* viên thuốc (pill) của tab đang chọn */
  float dp=sdCap(p-uPill.xy,uPill.z,uPill.w);
  float m=smoothstep(.8,-.8,dp);
  float pk=m*(1.-clamp(uHeld*3.,0.,1.));
  col=mix(col,uPillCol,pk);
  ga=mix(ga,max(ga,.88),pk);
  /* icon + nhãn vẽ sẵn trong texture, mask theo pill */
  vec2 uv=(p-uNav.xy)/uNav.zw;
  float inside=step(0.,uv.x)*step(uv.x,1.)*step(0.,uv.y)*step(uv.y,1.);
  uv=clamp(uv,0.,1.);
  float mi=smoothstep(.8,-.8,sdCap(p-uMask.xy,uMask.z,uMask.w));
  vec4 ic=mix(texture2D(uBn,uv),texture2D(uBp,uv),mi);
  col=mix(col,ic.rgb,ic.a*inside);
  ga=mix(ga,1.,ic.a*inside);
  /* quầng sáng bám theo con trỏ */
  vec3 gc=mix(vec3(.55,.45,.95),vec3(.78,.72,1.),uDark);
  float gd=length(p-uPtr.xy);
  float glw=exp(-gd*gd/(2.*85.*85.))*uPtr.z;
  float edgeW=1.-smoothstep(0.,7.,abs(dn+1.));
  float glw2=exp(-gd*gd/(2.*115.*115.))*uPtr.z;
  float glow=glw*.6*edgeW+glw2*.26;
  col+=gc*glow;
  ga=max(ga,clamp(glow*2.,0.,1.));
  /* ánh sáng tràn ra ngoài viền kính */
  float outer=glw*.14*exp(-max(dn,0.)/16.)*(1.-a);
  float oA=clamp(outer*3.,0.,1.);
  vec3 finalCol=mix(gc,col,a);
  float outA=max(ga*a,oA);
  return vec4(finalCol,outA);
}
void main(){
  vec2 p=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y)/uDpr;
  vec4 base=compose(p,0.);
  vec3 col=base.rgb;
  float alpha=base.a;
  if(uHeld>.001){
    float hc=clamp(uHeld,0.,1.);
    vec2 c=uPill.xy+vec2(uVel*4.,0.);
    float hw=uPill.z+uGrow+abs(uVel)*6.;
    float hh=uPill.w+uGrow-abs(uVel)*2.;
    float rr=hh;
    vec2 bb=vec2(hw,hh),q=p-c;
    float d=sdRB(q,bb,rr);
    float shd=1.-smoothstep(-6.,26.,sdRB(q-vec2(0.,6.+uGrow),bb,rr));
    col*=1.-.28*hc*shd*smoothstep(-1.,3.,d);
    if(d<1.5){
      float depth=max(-d,0.);
      vec2 e=vec2(.75,0.);
      vec2 nrm=normalize(vec2(sdRB(q+e.xy,bb,rr)-sdRB(q-e.xy,bb,rr),sdRB(q+e.yx,bb,rr)-sdRB(q-e.yx,bb,rr))+vec2(1e-5));
      float edge=1.-clamp(depth/(hh*.9),0.,1.);
      float eD=1.-clamp(depth/13.,0.,1.);
      float eM=1.-clamp(depth/(hh*.95),0.,1.);
      float disp=uTouch*(20.*eD*eD+2.*eM*eM);
      vec2 pm=c+q*(1.+.14*uTouch);
      vec2 off=-nrm*disp;
      off+=vec2(uVel,0.)*7.*eD*uTouch*(.5+.5*dot(nrm,vec2(sign(uVel+1e-4),0.)));
      float k=.09*uDisp,cl=hc*.85;
      vec3 g;
      g.r=compose(pm+off*(1.+k),cl).r;
      g.g=compose(pm+off,cl).g;
      g.b=compose(pm+off*(1.-k),cl).b;
      float lum=dot(g,vec3(.299,.587,.114));
      g=mix(vec3(lum),g,1.+.18*uTouch);

      float rim=pow(edge,2.6),lit=max(dot(nrm,L),0.),back=max(dot(nrm,-L),0.);

      g+=vec3(1.)*.05*uTouch*lk*(1.-smoothstep(-hh,.1*hh,q.y))*smoothstep(0.,6.,depth);
      g+=g*back*pow(sl,2.2)*.45*uTouch;
      float msk=smoothstep(.8,-.8,d);
      col=mix(col,g,msk);
      alpha=max(alpha,msk*hc);
    }
  }
  gl_FragColor=vec4(col*alpha,alpha);
}`;

        let dpr = 1, dprCap = 2.5, aSize = '', navR, rowR;
        let cur = 0, x = 0, xt = 0, xv = 0, prevX = 0, settling = false;
        let held = 0, heldTarget = 0, hv = 0, dragging = false, start = null, justDragged = false;
        let px = 0, py = 0, sx = 0, sy = 0, pv = 0, ptrT = 0, tv = 0, vel = 0;
        let PW = 0, PR = 0, lightA = -2.2;
        let last = performance.now(), avg = 0.0167, lastAdj = 0;
        const _u = {};

        if (!gl) {
            document.body.classList.add('nogl');
        } else {
            /* ---------- Shader setup ---------- */
            const sh = (t, s) => {
                const o = gl.createShader(t);
                gl.shaderSource(o, s);
                gl.compileShader(o);
                if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(o));
                return o;
            };
            const pr = gl.createProgram();
            gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS));
            gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS));
            gl.linkProgram(pr);
            gl.useProgram(pr);

            gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
            const loc = gl.getAttribLocation(pr, 'a');
            gl.enableVertexAttribArray(loc);
            gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

            const U = n => _u[n] || (_u[n] = gl.getUniformLocation(pr, n));

            const mk = u => {
                const t = gl.createTexture();
                gl.activeTexture(gl.TEXTURE0 + u);
                gl.bindTexture(gl.TEXTURE_2D, t);
                [[gl.TEXTURE_MIN_FILTER, gl.LINEAR],
                 [gl.TEXTURE_MAG_FILTER, gl.LINEAR],
                 [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE],
                 [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]].forEach(([k, v]) => gl.texParameteri(gl.TEXTURE_2D, k, v));
                return t;
            };
            const up = (u, c) => {
                gl.activeTexture(gl.TEXTURE0 + u);
                gl.bindTexture(gl.TEXTURE_2D, u === 0 ? tN : tP);
                if (u === 0 && aSize === c.width + 'x' + c.height) {
                    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, c);
                } else {
                    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
                    if (u === 0) aSize = c.width + 'x' + c.height;
                }
            };

            const tN = mk(0), tP = mk(1);
            gl.uniform1i(U('uBn'), 0);
            gl.uniform1i(U('uBp'), 1);
            gl.clearColor(0, 0, 0, 0);

            /* ---------- Vẽ icon + nhãn ra canvas 2D ---------- */
            function rr(g, x, y, w, h, r) {
                g.moveTo(x + r, y);
                g.arcTo(x + w, y, x + w, y + h, r);
                g.arcTo(x + w, y + h, x, y + h, r);
                g.arcTo(x, y + h, x, y, r);
                g.arcTo(x, y, x + w, y, r);
                g.closePath();
            }
            function pathOf(el) {
                const n = el.tagName.toLowerCase(), a = k => +el.getAttribute(k) || 0;
                if (n === 'path') return new Path2D(el.getAttribute('d'));
                const p = new Path2D();
                if (n === 'circle') p.arc(a('cx'), a('cy'), a('r'), 0, Math.PI * 2);
                if (n === 'rect') {
                    const g = { moveTo: (...v) => p.moveTo(...v), arcTo: (...v) => p.arcTo(...v), closePath: () => p.closePath() };
                    rr(g, a('x'), a('y'), a('width'), a('height'), a('rx'));
                }
                return p;
            }
            function drawBar(c, color, alpha, weight) {
                const w = Math.max(1, Math.round(navR.width * dpr));
                const h = Math.max(1, Math.round(navR.height * dpr));
                c.width = w; c.height = h;
                const g = c.getContext('2d');
                g.setTransform(dpr, 0, 0, dpr, 0, 0);
                g.clearRect(0, 0, navR.width, navR.height);
                g.globalAlpha = alpha;
                tabs.forEach(t => {
                    const svg = t.querySelector('svg'), r = svg.getBoundingClientRect(), s = r.width / 24;
                    g.save();
                    g.translate(r.left - navR.left, r.top - navR.top);
                    g.scale(s, s);
                    g.lineWidth = 1.75; g.lineCap = 'round'; g.lineJoin = 'round';
                    g.strokeStyle = color;
                    [...svg.children].forEach(el => g.stroke(pathOf(el)));
                    g.restore();
                    const l = t.querySelector('.lbl'), lr = l.getBoundingClientRect();
                    g.fillStyle = color;
                    g.font = weight + ' 12px Roboto,"Segoe UI",system-ui,sans-serif';
                    g.textAlign = 'center';
                    g.textBaseline = 'middle';
                    g.fillText(l.textContent, lr.left + lr.width / 2 - navR.left, lr.top + lr.height / 2 - navR.top + 0.5);
                });
            }

            /* ---------- Layout ---------- */
            function maxX() { return PR - PW; }

            function select(i, animate) {
                cur = i;
                tabs.forEach((t, k) => t.setAttribute('aria-current', k === i));
                xt = tabs[i].offsetLeft;
                if (!animate) { x = xt; xv = 0; prevX = x; settling = false; return; }
                heldTarget = 1; settling = true;
            }

            function layout() {
                dpr = Math.min(devicePixelRatio || 1, dprCap);
                PW = tabs[0].offsetWidth;
                PR = row.offsetWidth;
                cv.width = Math.max(1, Math.round(innerWidth * dpr));
                cv.height = Math.max(1, Math.round(innerHeight * dpr));
                gl.viewport(0, 0, cv.width, cv.height);
                navR = nav.getBoundingClientRect();
                rowR = row.getBoundingClientRect();
                drawBar(bn, TH.fg, 0.78, 500);
                drawBar(bp, TH.acc, 1, 600);
                up(0, bn);
                up(1, bp);
                gl.uniform3f(U('uTint'), TH.tint[0] / 255, TH.tint[1] / 255, TH.tint[2] / 255);
                gl.uniform1f(U('uTintA'), TH.ta);
                gl.uniform3f(U('uPillCol'), TH.pill[0] / 255, TH.pill[1] / 255, TH.pill[2] / 255);
                gl.uniform2f(U('uRes'), cv.width, cv.height);
                gl.uniform1f(U('uDpr'), cv.width / innerWidth);
                gl.uniform4f(U('uNav'), navR.left, navR.top, navR.width, navR.height);
                select(cur, false);
            }

            /* ---------- Vòng lặp vẽ ---------- */
            function frame(now) {
                const dt = Math.min((now - last) / 1000, 0.05) || 0.0167;
                last = now;

                const kk = heldTarget ? 520 : 300;
                const cc = reduce ? 60 : (heldTarget ? 30 : 26);
                const hs = dt / 2;
                for (let i = 0; i < 2; i++) { hv += (kk * (heldTarget - held) - cc * hv) * hs; held += hv * hs; }
                if (held < 0) { held = 0; hv = 0; }
                if (!heldTarget && held < 0.002 && Math.abs(hv) < 0.05) { held = 0; hv = 0; }

                if (!dragging) {
                    const cx = reduce ? 70 : 34;
                    for (let i = 0; i < 2; i++) { xv += (420 * (xt - x) - cx * xv) * hs; x += xv * hs; }
                    if (settling && Math.abs(xt - x) < 0.4 && Math.abs(xv) < 8) {
                        x = xt; xv = 0; settling = false;
                        if (!start) heldTarget = 0;
                    }
                }

                tv += ((heldTarget ? 1 : 0) - tv) * (1 - Math.exp(-dt * (heldTarget ? 40 : 14)));
                pv += ((ptrT ? 1 : 0) - pv) * (1 - Math.exp(-dt * (ptrT ? 14 : 5)));
                if (ptrT && pv < 0.03) { sx = px; sy = py; }
                else { const kp = 1 - Math.exp(-dt * 28); sx += (px - sx) * kp; sy += (py - sy) * kp; }

                vel += ((x - prevX) / dt - vel) * Math.min(1, dt * 12);
                prevX = x;

                if (!document.hidden) {
                    avg += (dt - avg) * 0.05;
                    if (avg > 0.024 && now - lastAdj > 2500 && dprCap > 1) {
                        dprCap = dprCap > 2 ? 2 : dprCap > 1.5 ? 1.5 : 1;
                        lastAdj = now; avg = 0.0167;
                        layout();
                    }
                }

                const w = PW, h = rowR.height, fr = x / Math.max(maxX(), 1);
                const a = lightA + (fr - 0.5) * 1.3 + (reduce ? 0 : Math.sin(now / 1100) * 0.12);

                gl.uniform4f(U('uPill'), rowR.left + x + w / 2, rowR.top + h / 2, w / 2, h / 2);

                const vc = Math.max(-1, Math.min(1, vel / 700)) * (reduce ? 0.3 : 1);
                const gw = 8 * held;
                gl.uniform4f(U('uMask'),
                    rowR.left + x + w / 2 + vc * 4,
                    rowR.top + h / 2,
                    w / 2 + gw + Math.abs(vc) * 6,
                    h / 2 + gw - Math.abs(vc) * 2);

                gl.uniform1f(U('uHeld'), held);
                gl.uniform1f(U('uTouch'), tv);
                gl.uniform1f(U('uGrow'), 8 * held);
                gl.uniform1f(U('uVel'), vc);
                gl.uniform1f(U('uDisp'), reduce ? 0.5 : 1);
                gl.uniform1f(U('uDark'), TH.dark);
                gl.uniform3f(U('uPtr'), sx, sy, pv);
                gl.uniform2f(U('uLight'), Math.cos(a), Math.sin(a));

                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(frame);
            }

            /* ---------- Logic tab: kéo / chọn ---------- */
            tabs.forEach((t, i) => t.addEventListener('click', () => {
                if (justDragged) { justDragged = false; return; }
                if (i !== cur) select(i);
            }));

            nav.addEventListener('pointerdown', e => {
                const rx = e.clientX - rowR.left;
                if (rx >= x && rx <= x + PW) {
                    xv = 0; settling = false; heldTarget = 1;
                    start = { id: e.pointerId, off: rx - x, sx: e.clientX };
                }
            });

            nav.addEventListener('pointermove', e => {
                if (!start || e.pointerId !== start.id) return;
                if (!dragging) {
                    if (Math.abs(e.clientX - start.sx) < 4) return;
                    dragging = true;
                    nav.setPointerCapture(e.pointerId);
                }
                x = Math.min(Math.max(e.clientX - rowR.left - start.off, 0), maxX());
            });

            function end(e) {
                if (!start || e.pointerId !== start.id) return;
                heldTarget = 0;
                if (dragging) {
                    justDragged = true;
                    setTimeout(() => justDragged = false, 0);
                    const c = x + PW / 2;
                    let best = 0, d = 1e9;
                    tabs.forEach((t, i) => {
                        const dd = Math.abs(t.offsetLeft + PW / 2 - c);
                        if (dd < d) { d = dd; best = i; }
                    });
                    select(best);
                }
                dragging = false;
                start = null;
            }
            nav.addEventListener('contextmenu', e => e.preventDefault());
            nav.addEventListener('pointerup', end);
            nav.addEventListener('pointercancel', end);

            /* ---------- Theo dõi con trỏ để tạo quầng sáng ---------- */
            const pset = e => { px = e.clientX; py = e.clientY; ptrT = 1; };
            addEventListener('pointermove', pset, { passive: true });
            addEventListener('pointerdown', pset, { passive: true });
            addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') ptrT = 0; });
            addEventListener('pointercancel', () => ptrT = 0);
            document.documentElement.addEventListener('pointerleave', () => ptrT = 0);

            addEventListener('resize', layout);
            addEventListener('orientationchange', () => setTimeout(layout, 200));
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

            layout();
            select(0, false);
            requestAnimationFrame(frame);
        }
    })();
    </script>
</body>
</html>
