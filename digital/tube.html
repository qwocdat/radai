<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigitalTube - Trình Phát Video</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #090a0f;
            --bg-surface: #12151e;
            --bg-card: rgba(22, 27, 38, 0.7);
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.35);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(18, 21, 30, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* Header UI */
        header {
            height: 64px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #fff;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: -0.5px;
        }

        .brand-logo .icon-wrapper {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), #4f46e5);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .search-container {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 8px 20px;
            width: 36%;
            max-width: 480px;
            transition: all 0.3s ease;
        }

        .search-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
            background: rgba(255, 255, 255, 0.07);
        }

        .search-container input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 14px;
        }

        .search-container i { color: var(--text-sub); margin-left: 10px; }

        /* Main Area */
        main { flex: 1; padding: 32px 28px; max-width: 1680px; margin: 0 auto; width: 100%; }

        /* Home Grid */
        .home-section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .movie-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-6px);
            border-color: var(--glass-border);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
        }

        .thumb-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            position: relative;
            overflow: hidden;
            background: #1a1d28;
        }

        .movie-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .movie-card:hover .movie-thumb { transform: scale(1.06); }

        .ep-badge-tag {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(9, 10, 15, 0.85);
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .movie-meta { padding: 16px; }
        .movie-title { font-size: 16px; font-weight: 700; line-height: 1.4; margin-bottom: 8px; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .movie-desc { font-size: 13px; color: var(--text-sub); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Watch Layout */
        .player-layout { display: grid; grid-template-columns: 1fr 380px; gap: 28px; }
        @media (max-width: 1100px) { .player-layout { grid-template-columns: 1fr; } }

        .video-wrapper {
            width: 100%;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 16/9;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            border: 1px solid var(--border);
        }

        video { width: 100%; height: 100%; outline: none; }

        .video-info-box { margin-top: 20px; }
        .video-headline { font-size: 22px; font-weight: 800; margin-bottom: 12px; color: #fff; }
        .video-description {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: 14px;
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.6;
        }

        /* Episode List Sidebar */
        .episodes-sidebar {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border);
            height: fit-content;
            max-height: 82vh;
            display: flex;
            flex-direction: column;
        }

        .sidebar-title {
            font-size: 17px;
            font-weight: 700;
            padding-bottom: 14px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .episodes-list-scroll { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

        .ep-card-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .ep-card-item:hover { background: rgba(255, 255, 255, 0.08); }
        .ep-card-item.active {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--accent);
        }

        .ep-card-num {
            background: var(--accent);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .ep-card-title { font-size: 14px; font-weight: 600; color: #fff; flex: 1; }

        .loading-view { text-align: center; padding: 80px 0; color: var(--text-sub); font-size: 15px; }
    </style>
</head>
<body>

    <header>
        <a href="tube.html" class="brand-logo">
            <div class="icon-wrapper"><i class="fa-solid fa-play"></i></div>
            DigitalTube
        </a>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Tìm kiếm bộ phim ưa thích...">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </header>

    <main id="appContainer">
        <div class="loading-view"><i class="fa-solid fa-circle-notch fa-spin"></i> Đang tải dữ liệu từ máy chủ...</div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAVuB8m14zkMPs-JTLAKB0Bp18QBKAMBt4",
            authDomain: "ideo-dd376.firebaseapp.com",
            databaseURL: "https://ideo-dd376-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ideo-dd376",
            storageBucket: "ideo-dd376.firebasestorage.app",
            messagingSenderId: "689163185",
            appId: "1:689163185:web:af4091213001180f364b90",
            measurementId: "G-QP54CZ2BJT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const appContainer = document.getElementById('appContainer');
        const searchInput = document.getElementById('searchInput');

        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('v');
        const currentEpIdx = parseInt(urlParams.get('ep') || '0');

        let moviesDataset = {};

        // Lắng nghe dữ liệu
        onValue(ref(db, 'movies'), (snapshot) => {
            moviesDataset = snapshot.val() || {};
            
            if (movieId && moviesDataset[movieId]) {
                renderPlayerScreen(movieId, currentEpIdx);
            } else {
                renderHomeScreen();
            }
        });

        function renderHomeScreen(filterQuery = '') {
            const keys = Object.keys(moviesDataset);
            
            const filteredKeys = keys.filter(k => {
                const title = (moviesDataset[k].title || '').toLowerCase();
                return title.includes(filterQuery.toLowerCase());
            });

            if (filteredKeys.length === 0) {
                appContainer.innerHTML = '<div class="loading-view">Không tìm thấy bộ phim nào phù hợp.</div>';
                return;
            }

            let gridHtml = `
                <div class="home-section-title"><i class="fa-solid fa-fire" style="color: var(--accent);"></i> Danh Sách Phim Mới Nhất</div>
                <div class="movies-grid">
            `;

            filteredKeys.forEach(id => {
                const item = moviesDataset[id];
                const epCount = item.episodes ? Object.keys(item.episodes).length : 0;
                const thumbUrl = item.thumbnail || 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=600&q=80';

                gridHtml += `
                    <a href="tube.html?v=${id}" class="movie-card">
                        <div class="thumb-wrapper">
                            <img class="movie-thumb" src="${thumbUrl}" alt="${item.title}" onerror="this.src='https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=600&q=80'">
                            <span class="ep-badge-tag">${epCount} Tập</span>
                        </div>
                        <div class="movie-meta">
                            <div class="movie-title">${item.title}</div>
                            <div class="movie-desc">${item.description || 'Chưa cập nhật mô tả cho bộ phim này.'}</div>
                        </div>
                    </a>
                `;
            });

            gridHtml += '</div>';
            appContainer.innerHTML = gridHtml;
        }

        function renderPlayerScreen(mId, epIdx) {
            const movie = moviesDataset[mId];
            const episodes = movie.episodes ? Object.values(movie.episodes).sort((a,b) => (a.order || 0) - (b.order || 0)) : [];

            if (episodes.length === 0) {
                appContainer.innerHTML = '<div class="loading-view">Bộ phim này hiện chưa được bổ sung tập phim nào.</div>';
                return;
            }

            const epData = episodes[epIdx] || episodes[0];

            let epListMarkup = '';
            episodes.forEach((ep, index) => {
                const isActive = index === epIdx ? 'active' : '';
                epListMarkup += `
                    <div class="ep-card-item ${isActive}" onclick="window.location.href='tube.html?v=${mId}&ep=${index}'">
                        <span class="ep-card-num">Tập ${ep.order || index + 1}</span>
                        <span class="ep-card-title">${ep.title}</span>
                        <i class="fa-solid fa-circle-play" style="color: var(--text-sub);"></i>
                    </div>
                `;
            });

            appContainer.innerHTML = `
                <div class="player-layout">
                    <div>
                        <div class="video-wrapper">
                            <video id="streamPlayer" controls autoplay src="${epData.url}"></video>
                        </div>
                        <div class="video-info-box">
                            <h1 class="video-headline">${movie.title} - ${epData.title}</h1>
                            <div class="video-description">${movie.description || 'Không có mô tả chi tiết.'}</div>
                        </div>
                    </div>

                    <div class="episodes-sidebar">
                        <div class="sidebar-title">
                            <span>Danh Sách Tập</span>
                            <span style="font-size: 13px; color: var(--text-sub);">${episodes.length} Tập</span>
                        </div>
                        <div class="episodes-list-scroll">
                            ${epListMarkup}
                        </div>
                    </div>
                </div>
            `;

            const player = document.getElementById('streamPlayer');
            player.onended = () => {
                if (epIdx + 1 < episodes.length) {
                    window.location.href = `tube.html?v=${mId}&ep=${epIdx + 1}`;
                }
            };
        }

        searchInput.addEventListener('input', (e) => {
            if (!movieId) renderHomeScreen(e.target.value);
        });
    </script>
</body>
</html>
