<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigitalTube - Xem Phim Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0f0f0f;
            --bg-card: #1f1f1f;
            --accent: #ff0000;
            --accent-hover: #cc0000;
            --text-primary: #f1f1f1;
            --text-secondary: #aaaaaa;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; }

        header {
            height: 56px;
            background-color: var(--bg-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: #fff; font-weight: 700; font-size: 18px; }
        .brand i { color: var(--accent); font-size: 22px; }

        .search-bar { display: flex; align-items: center; background: #121212; border: 1px solid var(--border-color); border-radius: 40px; padding: 6px 16px; width: 40%; max-width: 500px; }
        .search-bar input { background: transparent; border: none; outline: none; color: #fff; width: 100%; font-size: 14px; }
        .search-bar i { color: var(--text-secondary); }

        main { flex: 1; padding: 24px; max-width: 1600px; margin: 0 auto; width: 100%; }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }

        .movie-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        .movie-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #2a2a2a; }
        .movie-info { padding: 12px; }
        .movie-title { font-size: 15px; font-weight: 600; line-height: 1.3; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .movie-desc { font-size: 13px; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .player-layout { display: grid; grid-template-columns: 1fr 380px; gap: 24px; }
        @media (max-width: 1024px) { .player-layout { grid-template-columns: 1fr; } }

        .video-container { width: 100%; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; }
        video { width: 100%; height: 100%; outline: none; }

        .video-details { margin-top: 16px; }
        .video-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .video-desc { font-size: 14px; color: var(--text-secondary); background: var(--bg-card); padding: 12px; border-radius: 8px; line-height: 1.5; margin-top: 12px; }

        .episodes-panel { background: var(--bg-card); border-radius: 12px; padding: 16px; border: 1px solid var(--border-color); height: fit-content; max-height: 80vh; display: flex; flex-direction: column; }
        .episodes-header { font-size: 16px; font-weight: 600; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .episodes-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

        .ep-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.03); cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .ep-item:hover { background: rgba(255,255,255,0.08); }
        .ep-item.active { border-color: var(--accent); background: rgba(255,0,0,0.1); }
        .ep-badge { font-size: 12px; font-weight: 700; background: var(--accent); color: #fff; padding: 2px 8px; border-radius: 4px; }
        .ep-name { font-size: 14px; font-weight: 500; flex: 1; }

        .loading-spinner { text-align: center; padding: 40px; color: var(--text-secondary); }
    </style>
</head>
<body>

    <header>
        <a href="tube.html" class="brand"><i class="fa-solid fa-circle-play"></i> DigitalTube</a>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Tìm kiếm phim...">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </header>

    <main id="mainContent">
        <div class="loading-spinner"><i class="fa-solid fa-circle-notch fa-spin"></i> Đang tải dữ liệu phim...</div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAVuB8m14zkMPs-JTLAKB0Bp18QBKAMBt4",
            authDomain: "ideo-dd376.firebaseapp.com",
            databaseURL: "https://ideo-dd376-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ideo-dd376",
            storageBucket: "ideo-dd376.firebasestorage.app",
            messagingSenderId: "689163185",
            appId: "1:689163185:web:af4091213001180f364b90",
            measurementId: "G-QP54CZ2BJT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const mainContent = document.getElementById('mainContent');
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('v');
        const epIndex = parseInt(urlParams.get('ep') || '0');

        let allMovies = {};

        onValue(ref(db, 'movies'), (snapshot) => {
            allMovies = snapshot.val() || {};
            
            if (movieId && allMovies[movieId]) {
                renderPlayerView(movieId, epIndex);
            } else {
                renderHomeGrid();
            }
        });

        function renderHomeGrid() {
            const keys = Object.keys(allMovies);
            if (keys.length === 0) {
                mainContent.innerHTML = '<div class="loading-spinner">Chưa có phim nào được đăng tải.</div>';
                return;
            }

            let html = '<div class="movies-grid">';
            keys.forEach(id => {
                const m = allMovies[id];
                const epCount = m.episodes ? Object.keys(m.episodes).length : 0;
                const thumb = m.thumbnail || 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500&q=80';
                
                html += `
                    <a href="tube.html?v=${id}" class="movie-card">
                        <img class="movie-thumb" src="${thumb}" alt="${m.title}" onerror="this.src='https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500&q=80'">
                        <div class="movie-info">
                            <div class="movie-title">${m.title}</div>
                            <div class="movie-desc">${epCount} tập • ${m.description || 'Chưa có mô tả'}</div>
                        </div>
                    </a>
                `;
            });
            html += '</div>';
            mainContent.innerHTML = html;
        }

        function renderPlayerView(mId, currentEpIdx) {
            const movie = allMovies[mId];
            const episodes = movie.episodes ? Object.values(movie.episodes).sort((a,b) => (a.order || 0) - (b.order || 0)) : [];
            
            if (episodes.length === 0) {
                mainContent.innerHTML = '<div class="loading-spinner">Phim này chưa cập nhật tập video nào.</div>';
                return;
            }

            const currentEp = episodes[currentEpIdx] || episodes[0];

            let epListHtml = '';
            episodes.forEach((ep, idx) => {
                const active = idx === currentEpIdx ? 'active' : '';
                epListHtml += `
                    <div class="ep-item ${active}" onclick="window.location.href='tube.html?v=${mId}&ep=${idx}'">
                        <span class="ep-badge">Tập ${ep.order || idx + 1}</span>
                        <span class="ep-name">${ep.title}</span>
                        <i class="fa-solid fa-play" style="font-size: 12px; color: var(--text-secondary);"></i>
                    </div>
                `;
            });

            mainContent.innerHTML = `
                <div class="player-layout">
                    <div>
                        <div class="video-container">
                            <video id="videoPlayer" controls autoplay src="${currentEp.url}"></video>
                        </div>
                        <div class="video-details">
                            <div class="video-title">${movie.title} - ${currentEp.title}</div>
                            <div class="video-desc">${movie.description || 'Không có mô tả chi tiết cho phim này.'}</div>
                        </div>
                    </div>

                    <div class="episodes-panel">
                        <div class="episodes-header">
                            <span>Danh Sách Tập</span>
                            <span style="font-size: 13px; color: var(--text-secondary);">${episodes.length} Tập</span>
                        </div>
                        <div class="episodes-list">
                            ${epListHtml}
                        </div>
                    </div>
                </div>
            `;

            // Autoplay tiếp theo khi hết video
            const p = document.getElementById('videoPlayer');
            p.onended = () => {
                if (currentEpIdx + 1 < episodes.length) {
                    window.location.href = `tube.html?v=${mId}&ep=${currentEpIdx + 1}`;
                }
            };
        }
    </script>
</body>
</html>
