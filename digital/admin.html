<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdDigital - Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-color: #6366f1;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --text-color: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 24px; min-height: 100vh; }

        .header { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 24px auto; }
        .title { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .title i { color: var(--accent-color); }
        .client-btn { background: rgba(255,255,255,0.05); color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 8px; font-size: 14px; border: 1px solid var(--border-color); }

        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 24px; }

        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid var(--border-color); }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

        .status-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 12px; }
        .stat-item { background: rgba(0,0,0,0.2); padding: 14px; border-radius: 8px; border: 1px solid var(--border-color); }
        .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .stat-val { font-size: 18px; font-weight: 700; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--success-color); }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger-color); }

        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-color); }

        .btn { padding: 10px 20px; background: var(--accent-color); color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger-color); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 6px; margin-bottom: 8px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <div class="header">
        <div class="title"><i class="fa-solid fa-shield-halved"></i> AdDigital Admin Dashboard</div>
        <a href="tube.html" target="_blank" class="client-btn"><i class="fa-solid fa-arrow-up-right-from-square"></i> Mở Trang Client</a>
    </div>

    <div class="container">
        <!-- Bảng kiểm tra kết nối -->
        <div class="card">
            <div class="card-title"><i class="fa-solid fa-network-wired"></i> Kiểm Tra Trạng Thái Kết Nối Firebase</div>
            <div class="status-box">
                <div class="stat-item">
                    <div class="stat-label">Trạng Thái Kết Nối</div>
                    <div id="connStatus" class="status-badge badge-danger">Đang kết nối...</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Tổng Số Phim</div>
                    <div id="movieCount" class="stat-val">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Độ Trễ (Ping)</div>
                    <div id="pingVal" class="stat-val">-- ms</div>
                </div>
            </div>
        </div>

        <div class="grid-2">
            <!-- Form Tạo Phim Mới -->
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-film"></i> 1. Tạo Phim Mới</div>
                <form id="createMovieForm">
                    <div class="form-group">
                        <label>Tên Phim</label>
                        <input type="text" id="mTitle" placeholder="Ví dụ: Tây Du Ký" required>
                    </div>
                    <div class="form-group">
                        <label>Link Ảnh Bìa (Thumbnail)</label>
                        <input type="text" id="mThumb" placeholder="https://..." >
                    </div>
                    <div class="form-group">
                        <label>Mô Tả Phim</label>
                        <textarea id="mDesc" rows="3" placeholder="Nội dung tóm tắt..."></textarea>
                    </div>
                    <button type="submit" class="btn"><i class="fa-solid fa-plus"></i> Tạo Phim</button>
                </form>
            </div>

            <!-- Form Thêm Tập Video -->
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-video"></i> 2. Thêm Tập Phim</div>
                <form id="addEpForm">
                    <div class="form-group">
                        <label>Chọn Phim</label>
                        <select id="movieSelect" required>
                            <option value="">-- Chọn phim --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Số Tập (Thứ tự: 1, 2, 3...)</label>
                        <input type="number" id="epOrder" placeholder="1" required>
                    </div>
                    <div class="form-group">
                        <label>Tên Tập Phim</label>
                        <input type="text" id="epTitle" placeholder="Tập 1: Mở Đầu" required>
                    </div>
                    <div class="form-group">
                        <label>File Video (.mp4 / GitHub)</label>
                        <input type="text" id="epUrl" placeholder="tap1.mp4" required>
                        <span style="font-size: 11px; color: var(--text-muted);">Tự động ghép prefix GitHub nếu chỉ nhập tên file</span>
                    </div>
                    <button type="submit" class="btn"><i class="fa-solid fa-upload"></i> Đăng Tập Video</button>
                </form>
            </div>
        </div>

        <!-- Danh sách Quản lý Phim & Tập -->
        <div class="card">
            <div class="card-title"><i class="fa-solid fa-list-check"></i> Quản Lý Dữ Liệu Phim</div>
            <div id="movieManager">
                <div style="text-align: center; color: var(--text-muted); padding: 20px;">Đang đồng bộ dữ liệu...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAVuB8m14zkMPs-JTLAKB0Bp18QBKAMBt4",
            authDomain: "ideo-dd376.firebaseapp.com",
            databaseURL: "https://ideo-dd376-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ideo-dd376",
            storageBucket: "ideo-dd376.firebasestorage.app",
            messagingSenderId: "689163185",
            appId: "1:689163185:web:af4091213001180f364b90",
            measurementId: "G-QP54CZ2BJT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const GITHUB_PREFIX = "https://raw.githubusercontent.com/qwocdat/radai/main/digital/";[span_1](start_span)[span_1](end_span)

        const connStatus = document.getElementById('connStatus');
        const pingVal = document.getElementById('pingVal');
        const movieCount = document.getElementById('movieCount');
        const movieSelect = document.getElementById('movieSelect');
        const movieManager = document.getElementById('movieManager');

        // Lắng nghe kết nối hế thống
        const connectedRef = ref(db, ".info/connected");
        let startTime = Date.now();

        onValue(connectedRef, (snap) => {
            if (snap.val() === true) {
                const latency = Date.now() - startTime;
                connStatus.className = "status-badge badge-success";
                connStatus.innerText = "Đã kết nối";
                pingVal.innerText = `${latency} ms`;
            } else {
                connStatus.className = "status-badge badge-danger";
                connStatus.innerText = "Lỗi kết nối";
            }
        });

        // Tạo phim mới
        document.getElementById('createMovieForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('mTitle').value;
            const thumb = document.getElementById('mThumb').value;
            const desc = document.getElementById('mDesc').value;

            const moviesRef = ref(db, 'movies');
            push(moviesRef, {
                title: title,
                thumbnail: thumb,
                description: desc,
                createdAt: Date.now()
            }).then(() => {
                alert('Tạo phim thành công!');
                document.getElementById('createMovieForm').reset();
            });
        });

        // Thêm tập video
        document.getElementById('addEpForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const mId = movieSelect.value;
            const order = parseInt(document.getElementById('epOrder').value);
            const title = document.getElementById('epTitle').value;
            let url = document.getElementById('epUrl').value.trim();

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = GITHUB_PREFIX + url;
            }

            const epRef = ref(db, `movies/${mId}/episodes`);
            push(epRef, {
                order: order,
                title: title,
                url: url
            }).then(() => {
                alert('Đã thêm tập phim mới!');
                document.getElementById('addEpForm').reset();
            });
        });

        // Đọc danh sách phim
        onValue(ref(db, 'movies'), (snapshot) => {
            const data = snapshot.val() || {};
            const keys = Object.keys(data);

            movieCount.innerText = keys.length;
            movieSelect.innerHTML = '<option value="">-- Chọn phim --</option>';
            movieManager.innerHTML = '';

            if (keys.length === 0) {
                movieManager.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">Chưa có dữ liệu phim</div>';
                return;
            }

            keys.forEach(id => {
                const m = data[id];
                
                // Add to Select Box
                const opt = document.createElement('option');
                opt.value = id;
                opt.innerText = m.title;
                movieSelect.appendChild(opt);

                // Add to Manager List
                const episodes = m.episodes ? Object.keys(m.episodes).map(k => ({ id: k, ...m.episodes[k] })) : [];
                episodes.sort((a,b) => (a.order||0) - (b.order||0));

                let epListHtml = '';
                episodes.forEach(ep => {
                    epListHtml += `
                        <div class="list-item" style="font-size: 13px; margin-left: 20px;">
                            <span>Tập ${ep.order || 1}: ${ep.title} (${ep.url})</span>
                            <button class="btn btn-danger" style="padding: 4px 8px; font-size: 11px;" onclick="deleteEp('${id}', '${ep.id}')">Xóa tập</button>
                        </div>
                    `;
                });

                const mDiv = document.createElement('div');
                mDiv.className = 'list-item';
                mDiv.style.flexDirection = 'column';
                mDiv.style.alignItems = 'stretch';
                mDiv.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; font-weight: 600;">
                        <span>🎬 ${m.title} (${episodes.length} tập)</span>
                        <button class="btn btn-danger" style="padding: 6px 12px; font-size: 12px;" onclick="deleteMovie('${id}')">Xóa Phim</button>
                    </div>
                    <div style="margin-top: 8px;">${epListHtml}</div>
                `;
                movieManager.appendChild(mDiv);
            });
        });

        window.deleteMovie = (mId) => {
            if(confirm('Bạn có chắc chắn muốn xóa toàn bộ phim này và các tập liên quan?')) {
                remove(ref(db, `movies/${mId}`));
            }
        };

        window.deleteEp = (mId, epId) => {
            if(confirm('Xóa tập phim này?')) {
                remove(ref(db, `movies/${mId}/episodes/${epId}`));
            }
        };
    </script>
</body>
</html>
