<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Nhiệm Vụ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ios27-bg: #030712;
            --ios27-card: rgba(255, 255, 255, 0.05);
            --ios27-card-border: rgba(255, 255, 255, 0.12);
            --ios27-neon-blue: #00f0ff;
            --ios27-neon-purple: #7000ff;
            --ios27-accent: #007AFF;
            --ios27-success: #30D158;
            --ios27-warning: #FF9F0A;
            --ios27-text: #FFFFFF;
            --ios27-subtext: #9CA3AF;
            --blur-val: blur(35px);
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }

        body {
            background-color: var(--ios27-bg); color: var(--ios27-text);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(112, 0, 255, 0.15) 0%, transparent 45%);
        }

        .app-container {
            width: 100%; max-width: 430px; height: 100vh; max-height: 932px;
            position: relative; display: flex; flex-direction: column; overflow: hidden;
        }

        @media (min-width: 440px) {
            .app-container {
                height: 880px; border-radius: 40px;
                border: 1px solid rgba(255, 255, 255, 0.2);
                box-shadow: 0 0 40px rgba(0, 240, 255, 0.15);
            }
        }

        .nav-bar {
            padding: 50px 20px 15px; backdrop-filter: var(--blur-val);
            background: rgba(3, 7, 18, 0.6); display: flex;
            align-items: center; justify-content: space-between;
            border-bottom: 0.5px solid var(--ios27-card-border);
        }

        .screen-container { flex: 1; position: relative; width: 100%; overflow-y: auto; }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 20px; display: flex; flex-direction: column; gap: 14px;
            opacity: 0; pointer-events: none;
            transform: scale(0.95) translateY(10px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }

        .screen.active { opacity: 1; pointer-events: auto; transform: scale(1) translateY(0); }

        .glass-card {
            background: var(--ios27-card); backdrop-filter: var(--blur-val);
            border: 1px solid var(--ios27-card-border); border-radius: 20px; padding: 18px;
        }

        .ios-btn {
            background: linear-gradient(135deg, var(--ios27-accent), var(--ios27-neon-purple));
            color: white; border: none; border-radius: 14px; padding: 14px;
            font-size: 15px; font-weight: 600; cursor: pointer; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 20px rgba(112, 0, 255, 0.3); transition: transform 0.2s;
        }
        .ios-btn:active { transform: scale(0.97); }

        .ios-btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            box-shadow: none;
            border: 1px solid var(--ios27-card-border);
        }

        .ios-input {
            width: 100%; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--ios27-card-border); border-radius: 12px;
            padding: 14px; color: #fff; font-size: 15px; outline: none; margin-top: 10px;
        }

        .keyword-box {
            background: rgba(0, 240, 255, 0.1); border: 1px dashed var(--ios27-neon-blue);
            color: var(--ios27-neon-blue); padding: 12px; border-radius: 12px;
            font-weight: bold; font-size: 15px; text-align: center; margin: 10px 0;
            display: flex; align-items: center; justify-content: space-between;
        }

        .step-number {
            background: var(--ios27-accent); color: white; width: 22px; height: 22px;
            border-radius: 50%; display: inline-flex; align-items: center;
            justify-content: center; font-size: 12px; font-weight: bold; margin-right: 6px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="nav-bar">
        <div style="font-size: 16px; font-weight: 600;" id="navTitle">Hệ Thống Nhiệm Vụ SEO</div>
        <i class="fa-solid fa-compass" style="color: var(--ios27-neon-blue);"></i>
    </div>

    <div class="screen-container">
        
        <!-- MÀN HÌNH NHIỆM VỤ CHÍNH -->
        <div class="screen active" id="screenTask">
            <div class="glass-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span style="font-size: 12px; color: var(--ios27-neon-blue); font-weight: bold;" id="taskCategory">
                        🌐 NHIỆM VỤ ĐA LĨNH VỰC
                    </span>
                    <span style="font-size: 11px; color: var(--ios27-warning);" id="footerTipIndicator">
                        <i class="fa-solid fa-shoe-prints"></i> Có mã ở chân trang
                    </span>
                </div>

                <p style="font-size: 13px; color: var(--ios27-subtext); margin-bottom: 6px;">
                    <span class="step-number">1</span> Copy từ khóa và tìm trên Google:
                </p>
                <div class="keyword-box">
                    <span id="targetKeyword">đang tải...</span>
                    <i class="fa-regular fa-copy" style="cursor: pointer;" onclick="copyKeyword()"></i>
                </div>

                <p style="font-size: 13px; color: var(--ios27-subtext); margin-top: 10px;">
                    <span class="step-number">2</span> Vào đúng website: <b id="targetDomainDisplay" style="color: #fff;">...</b>
                </p>

                <p style="font-size: 13px; color: var(--ios27-subtext); margin-top: 8px;">
                    <span class="step-number">3</span> Kéo xuống <b>cuối trang (Footer/Giới thiệu)</b> để lấy <b id="codeTypeLabel" style="color: var(--ios27-success);">Mã</b>.
                </p>

                <button class="ios-btn" style="margin-top: 12px; background: rgba(255,255,255,0.08);" onclick="openGoogleSearch()">
                    <i class="fa-solid fa-magnifying-glass"></i> Mở Google Tìm Kiếm
                </button>
            </div>

            <div class="glass-card">
                <h4 style="font-size: 14px; color: var(--ios27-subtext);">Nhập Mã Xác Nhận</h4>
                <input type="text" id="userInputCode" class="ios-input" placeholder="Dán mã lấy được vào đây...">
                
                <div style="display: flex; gap: 10px; margin-top: 12px;">
                    <button class="ios-btn ios-btn-secondary" style="flex: 1; padding: 12px; font-size: 14px;" onclick="loadNewTask()">
                        <i class="fa-solid fa-rotate"></i> Đổi Web Khác
                    </button>
                    <button class="ios-btn" style="flex: 1.5; padding: 12px; font-size: 14px; background: linear-gradient(135deg, #007AFF, #00F0FF);" onclick="verifyCode()">
                        <i class="fa-solid fa-key"></i> Xác Nhận
                    </button>
                </div>
            </div>
        </div>

        <!-- MÀN HÌNH THÀNH CÔNG -->
        <div class="screen" id="screenSuccess">
            <div class="glass-card" style="text-align: center; padding: 30px 20px;">
                <i class="fa-solid fa-circle-check" style="font-size: 48px; color: var(--ios27-success); margin-bottom: 12px;"></i>
                <h3 style="margin-bottom: 5px;">Xác Thực Thành Công!</h3>
                <p style="color: var(--ios27-subtext); font-size: 13px;">Key của bạn:</p>
                <div class="ios-input" id="finalKey" style="font-family: monospace; font-size: 18px; color: #30D158; margin: 15px 0; text-align: center; font-weight: bold;">
                    KEY-SUCCESS
                </div>
                <button class="ios-btn" style="background: linear-gradient(135deg, #30D158, #00A843);" onclick="navigator.clipboard.writeText(document.getElementById('finalKey').innerText); alert('Đã sao chép Key!');">
                    <i class="fa-regular fa-copy"></i> Sao Chép Key
                </button>
            </div>
        </div>

    </div>
</div>

<script>
    // Kho dữ liệu phong phú: Đồ điện tử, Bất động sản, Gia dụng, Thời trang, Dịch vụ...
    const masterDatabase = [
        { id: "cellphones", domain: "cellphones.com.vn", category: "ĐIỆN TỬ - CÔNG NGHỆ", keyword: "cellphones hệ thống cửa hàng", code: "18002097", type: "Số Hotline Tổng Đài" },
        { id: "batdongsan", domain: "batdongsan.com.vn", category: "BẤT ĐỘNG SẢN", keyword: "batdongsan cskh lien he", code: "19001881", type: "Số Tổng Đài Hỗ Trợ" },
        { id: "phongvu", domain: "phongvu.vn", category: "MÁY TÍNH - LINH KIỆN", keyword: "phong vu thông tin giới thiệu", code: "18006867", type: "Hotline Chăm Sóc Khách Hàng" },
        { id: "dienmayxanh", domain: "dienmayxanh.com", category: "ĐIỆN MÁY GIA DỤNG", keyword: "dien may xanh gioi thiệu công ty", code: "18001061", type: "Mã Tổng Đài Ở Cuối Trang" },
        { id: "tgdd", domain: "thegioididong.com", category: "THIẾT BỊ DI ĐỘNG", keyword: "thế giới di động hệ thống siêu thị", code: "18001060", type: "Số Hotline Ở Footer" },
        { id: "fptshop", domain: "fptshop.com.vn", category: "ĐIỆN TỬ - LAPTOP", keyword: "fpt shop thông tin liên hệ", code: "18006601", type: "Mã Hotline Giới Thiệu" }
    ];

    let currentTask = null;

    // Khởi tạo hệ thống chọn nhiệm vụ thông minh
    function loadNewTask() {
        // Lấy lịch sử các web đã làm trong ngày từ localStorage
        const todayStr = new Date().toDateString();
        let history = JSON.parse(localStorage.getItem('completed_tasks_history') || '{}');
        
        // Nếu sang ngày mới, reset lịch sử
        if (history.date !== todayStr) {
            history = { date: todayStr, domains: [] };
        }

        // Lọc ra các web CHƯA làm trong ngày hôm nay
        let availableTasks = masterDatabase.filter(item => !history.domains.includes(item.id));

        // Nếu đã làm hết sạch tất cả các web trong ngày, cho phép làm lại vòng mới
        if (availableTasks.length === 0) {
            history.domains = [];
            localStorage.setItem('completed_tasks_history', JSON.stringify(history));
            availableTasks = masterDatabase;
        }

        // Random chọn 1 web chưa làm
        currentTask = availableTasks[Math.floor(Math.random() * availableTasks.length)];

        // Đổ dữ liệu ra màn hình
        document.getElementById('taskCategory').innerText = `🌐 ${currentTask.category}`;
        document.getElementById('targetKeyword').innerText = currentTask.keyword;
        document.getElementById('targetDomainDisplay').innerText = currentTask.domain;
        document.getElementById('codeTypeLabel').innerText = currentTask.type;
        document.getElementById('userInputCode').value = '';
    }

    // Chạy ngay khi mở web
    document.addEventListener("DOMContentLoaded", () => {
        loadNewTask();
    });

    function copyKeyword() {
        navigator.clipboard.writeText(currentTask.keyword);
        alert("Đã copy từ khóa: " + currentTask.keyword);
    }

    function openGoogleSearch() {
        copyKeyword();
        const googleUrl = `https://www.google.com/search?q=${encodeURIComponent(currentTask.keyword)}`;
        window.open(googleUrl, '_blank');
    }

    function verifyCode() {
        const input = document.getElementById('userInputCode').value.trim();
        
        // Kiểm tra đúng mã hoặc Master Key 8899
        if (input === currentTask.code || input === "8899") {
            // Lưu lại web này đã làm vào lịch sử (khóa lại trong ngày)
            const todayStr = new Date().toDateString();
            let history = JSON.parse(localStorage.getItem('completed_tasks_history') || '{}');
            if (history.date !== todayStr) {
                history = { date: todayStr, domains: [] };
            }
            if (!history.domains.includes(currentTask.id)) {
                history.domains.push(currentTask.id);
                localStorage.setItem('completed_tasks_history', JSON.stringify(history));
            }

            // Chuyển màn hình thành công
            document.getElementById('finalKey').innerText = "KEY-" + Math.random().toString(36).substring(2, 8).toUpperCase() + "-PASS";
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screenSuccess').classList.add('active');
        } else {
            alert("Mã xác nhận chưa chính xác! Hãy kiểm tra kỹ phần cuối trang (Footer) của website.");
        }
    }
</script>
</body>
</html>
