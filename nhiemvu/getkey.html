<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xác Thực Nhiệm Vụ Tìm Kiếm SEO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ios27-bg: #030712;
            --ios27-card: rgba(255, 255, 255, 0.05);
            --ios27-card-border: rgba(255, 255, 255, 0.12);
            --ios27-neon-blue: #00f0ff;
            --ios27-neon-purple: #7000ff;
            --ios27-accent: #007AFF;
            --ios27-success: #30D158;
            --ios27-text: #FFFFFF;
            --ios27-subtext: #9CA3AF;
            --blur-val: blur(35px);
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }

        body {
            background-color: var(--ios27-bg); color: var(--ios27-text);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(112, 0, 255, 0.15) 0%, transparent 45%);
        }

        .app-container {
            width: 100%; max-width: 430px; height: 100vh; max-height: 932px;
            position: relative; display: flex; flex-direction: column; overflow: hidden;
        }

        @media (min-width: 440px) {
            .app-container {
                height: 880px; border-radius: 40px;
                border: 1px solid rgba(255, 255, 255, 0.2);
                box-shadow: 0 0 40px rgba(0, 240, 255, 0.15);
            }
        }

        .nav-bar {
            padding: 50px 20px 15px; backdrop-filter: var(--blur-val);
            background: rgba(3, 7, 18, 0.6); display: flex;
            align-items: center; justify-content: space-between;
            border-bottom: 0.5px solid var(--ios27-card-border);
        }

        .screen-container { flex: 1; position: relative; width: 100%; }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 20px; display: flex; flex-direction: column; gap: 14px;
            opacity: 0; pointer-events: none;
            transform: scale(0.95) translateY(10px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }

        .screen.active { opacity: 1; pointer-events: auto; transform: scale(1) translateY(0); }

        .glass-card {
            background: var(--ios27-card); backdrop-filter: var(--blur-val);
            border: 1px solid var(--ios27-card-border); border-radius: 20px; padding: 18px;
        }

        .ios-btn {
            background: linear-gradient(135deg, var(--ios27-accent), var(--ios27-neon-purple));
            color: white; border: none; border-radius: 14px; padding: 14px;
            font-size: 15px; font-weight: 600; cursor: pointer; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 20px rgba(112, 0, 255, 0.3); transition: transform 0.2s;
        }
        .ios-btn:active { transform: scale(0.97); }

        .ios-input {
            width: 100%; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--ios27-card-border); border-radius: 12px;
            padding: 14px; color: #fff; font-size: 15px; outline: none; margin-top: 10px;
        }

        .keyword-box {
            background: rgba(0, 240, 255, 0.1); border: 1px dashed var(--ios27-neon-blue);
            color: var(--ios27-neon-blue); padding: 12px; border-radius: 12px;
            font-weight: bold; font-size: 16px; text-align: center; margin: 10px 0;
            display: flex; align-items: center; justify-content: space-between;
        }

        .step-number {
            background: var(--ios27-accent); color: white; width: 22px; height: 22px;
            border-radius: 50%; display: inline-flex; align-items: center;
            justify-content: center; font-size: 12px; font-weight: bold; margin-right: 6px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="nav-bar">
        <div style="font-size: 16px; font-weight: 600;" id="navTitle">Nhiệm Vụ SEO Google</div>
        <i class="fa-brands fa-google" style="color: var(--ios27-neon-blue);"></i>
    </div>

    <div class="screen-container">
        
        <!-- MÀN HÌNH NHIỆM VỤ (TẢI TỨC THÌ TỪ LÚC MỞ WEB) -->
        <div class="screen active" id="screenTask">
            <div class="glass-card">
                <div style="font-size: 12px; color: var(--ios27-neon-blue); font-weight: bold; margin-bottom: 5px;" id="priorityBadge">
                    ⚡ NHIỆM VỤ ĐÃ SẴN SÀNG
                </div>

                <p style="font-size: 13px; color: var(--ios27-subtext); margin-bottom: 8px;">
                    <span class="step-number">1</span> Copy từ khóa và tìm trên Google:
                </p>
                <div class="keyword-box">
                    <span id="targetKeyword">bất động sản sài gòn</span>
                    <i class="fa-regular fa-copy" style="cursor: pointer;" onclick="copyKeyword()"></i>
                </div>

                <p style="font-size: 13px; color: var(--ios27-subtext); margin-top: 12px;">
                    <span class="step-number">2</span> Tìm kết quả trang web: <b id="targetDomainDisplay" style="color: #fff;">batdongsan.com.vn</b>
                </p>

                <p style="font-size: 13px; color: var(--ios27-subtext); margin-top: 10px;">
                    <span class="step-number">3</span> Vào trang, cuộn xuống chân trang để lấy <b id="codeTypeLabel" style="color: var(--ios27-success);">Số Hotline / Mã Zip</b>.
                </p>

                <button class="ios-btn" style="margin-top: 15px; background: rgba(255,255,255,0.08);" onclick="openGoogleSearch()">
                    <i class="fa-solid fa-magnifying-glass"></i> Mở Google Tìm Kiếm
                </button>
            </div>

            <div class="glass-card">
                <h4 style="font-size: 14px; color: var(--ios27-subtext);">Nhập Mã Xác Nhận</h4>
                <input type="text" id="userInputCode" class="ios-input" placeholder="Dán Mã Zip hoặc SĐT vào đây...">
                <button class="ios-btn" style="margin-top: 12px; background: linear-gradient(135deg, #007AFF, #00F0FF);" onclick="verifyCode()">
                    <i class="fa-solid fa-key"></i> Xác Nhận Lấy Key
                </button>
            </div>
        </div>

        <!-- MÀN HÌNH KEY THÀNH CÔNG -->
        <div class="screen" id="screenSuccess">
            <div class="glass-card" style="text-align: center; padding: 30px 20px;">
                <i class="fa-solid fa-circle-check" style="font-size: 48px; color: var(--ios27-success); margin-bottom: 12px;"></i>
                <h3 style="margin-bottom: 5px;">Xác Thực Thành Công!</h3>
                <p style="color: var(--ios27-subtext); font-size: 13px;">Key của bạn đã được kích hoạt:</p>
                <div class="ios-input" id="finalKey" style="font-family: monospace; font-size: 18px; color: #30D158; margin: 15px 0; text-align: center; font-weight: bold;">
                    KEY-SUCCESS
                </div>
                <button class="ios-btn" style="background: linear-gradient(135deg, #30D158, #00A843);" onclick="navigator.clipboard.writeText(document.getElementById('finalKey').innerText); alert('Đã sao chép Key!');">
                    <i class="fa-regular fa-copy"></i> Sao Chép Key
                </button>
            </div>
        </div>

    </div>
</div>

<script>
    // Cơ sở dữ liệu Web Việt Nam chuẩn SEO
    const seoDatabase = [
        { domain: "cellphones.com.vn", keyword: "cellphones laptop gia re", code: "18002097", type: "Số Hotline Tổng Đài" },
        { domain: "phongvu.vn", keyword: "phong vu may tinh may ban", code: "18006867", type: "Số Hotline CSKH" },
        { domain: "batdongsan.com.vn", keyword: "bat dong san gia re ha noi", code: "19001881", type: "Số Hotline Bất Động Sản" },
        { domain: "chotot.com", keyword: "cho tot do dien tu cu", code: "19003003", type: "Mã Tổng Đài Chợ Tốt" }
    ];

    let currentTask = null;

    // Chạy NGAY LẬP TỨC khi nạp script
    (function instantInit() {
        // 1. Lấy danh sách web đã từng làm thành công từ LocalStorage
        const historyData = JSON.parse(localStorage.getItem('user_completed_tasks') || '[]');
        
        if (historyData.length > 0) {
            // ƯU TIÊN LẤY WEB ĐÃ TỪNG VƯỢT THÀNH CÔNG
            const lastDomain = historyData[historyData.length - 1];
            currentTask = seoDatabase.find(item => item.domain === lastDomain) || seoDatabase[0];
            document.getElementById('priorityBadge').innerText = "🔥 ƯU TIÊN WEB ĐÃ LÀM THƯỜNG XUYÊN";
        } else {
            // Lấy ngẫu nhiên web lần đầu
            currentTask = seoDatabase[Math.floor(Math.random() * seoDatabase.length)];
        }

        // Đổ dữ liệu lên UI lập tức trong 0 giây
        document.getElementById('targetKeyword').innerText = currentTask.keyword;
        document.getElementById('targetDomainDisplay').innerText = currentTask.domain;
        document.getElementById('codeTypeLabel').innerText = currentTask.type;
    })();

    function copyKeyword() {
        navigator.clipboard.writeText(currentTask.keyword);
        alert("Đã copy từ khóa: " + currentTask.keyword);
    }

    function openGoogleSearch() {
        copyKeyword();
        // Mở thẳng trang tìm kiếm Google với từ khóa đã điền sẵn
        const googleUrl = `https://www.google.com/search?q=${encodeURIComponent(currentTask.keyword)}`;
        window.open(googleUrl, '_blank');
    }

    function verifyCode() {
        const input = document.getElementById('userInputCode').value.trim();
        
        // Kiểm tra khớp mã hoặc dùng Master Pass 8899
        if (input === currentTask.code || input === "8899") {
            // LƯU LẠI WEB NÀY VÀO LỊCH SỬ ĐỂ LẦN SAU ƯU TIÊN
            let historyData = JSON.parse(localStorage.getItem('user_completed_tasks') || '[]');
            if (!historyData.includes(currentTask.domain)) {
                historyData.push(currentTask.domain);
                localStorage.setItem('user_completed_tasks', JSON.stringify(historyData));
            }

            // Tạo Key & chuyển màn hình
            document.getElementById('finalKey').innerText = "KEY-" + Math.random().toString(36).substring(2, 8).toUpperCase() + "-SEO";
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screenSuccess').classList.add('active');
        } else {
            alert("Mã xác nhận chưa chính xác! Vui lòng tìm đúng trên web đối tác.");
        }
    }
</script>
</body>
</html>
