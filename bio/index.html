    function startLandingParticles(){
      const canvas=document.createElement('canvas');
      canvas.className='landing-particles-canvas';
      canvas.setAttribute('aria-hidden','true');
      canvas.dataset.landingFx='1';
      document.body.append(canvas);
      const ctx=canvas.getContext('2d',{alpha:true,desynchronized:true});
      if(!ctx){canvas.remove();return null;}
      const reduceMotion=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches||false;
      const runtime={canvas,ctx,width:window.innerWidth,height:window.innerHeight,dpr:1,particles:[],bursts:[],mouseX:0,mouseY:0,scrollY:window.scrollY||0,raf:0,lastFrame:0,reduced:reduceMotion};
      const random=(min,max)=>min+Math.random()*(max-min);
      function seedParticle(){return {x:random(-runtime.width*.68,runtime.width*.68),y:random(-runtime.height*.68,runtime.height*.68),z:random(60,1250),r:random(.6,1.8),speed:random(.32,.95),phase:random(0,Math.PI*2),hue:Math.random()};}
      function resize(){
        runtime.width=Math.max(1,window.innerWidth);runtime.height=Math.max(1,window.innerHeight);runtime.dpr=Math.min(window.devicePixelRatio||1,1.35);
        canvas.width=Math.round(runtime.width*runtime.dpr);canvas.height=Math.round(runtime.height*runtime.dpr);canvas.style.width=runtime.width+'px';canvas.style.height=runtime.height+'px';
        ctx.setTransform(runtime.dpr,0,0,runtime.dpr,0,0);
        const count=runtime.width<540?42:runtime.width<900?62:86;
        runtime.particles=Array.from({length:count},seedParticle);

        if(!runtime.reduced)schedule();
      }
      function draw(time=0,staticFrame=false){
        ctx.clearRect(0,0,runtime.width,runtime.height);
        const points=[];
        for(const p of runtime.particles){
          if(!staticFrame&&!runtime.reduced){p.z-=p.speed;if(p.z<45){Object.assign(p,seedParticle(),{z:1250});}}
          const perspective=900/(p.z+520);
          const wave=runtime.reduced?0:Math.sin(time*.00045+p.phase)*7;
          const x=runtime.width*.5+p.x*perspective-runtime.mouseX*19*perspective;
          const y=runtime.height*.5+(p.y+wave)*perspective+runtime.mouseY*15*perspective-Math.min(runtime.scrollY,6000)*.012;
          if(x < -45||x>runtime.width+45||y < -45||y>runtime.height+45)continue;
          const depth=Math.max(.12,1-p.z/1400);
          points.push({x,y,r:Math.max(.55,p.r*depth*1.7),depth,hue:p.hue});
        }
        for(let i=0;i<points.length;i++){
          const a=points[i];
          for(let j=i+1;j<points.length;j++){
            const b=points[j],dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy;
            if(d2<112*112){const distance=Math.sqrt(d2);const alpha=(1-distance/112)*Math.min(a.depth,b.depth)*.19;ctx.strokeStyle=a.hue>.72?`rgba(112,190,255,${alpha})`:`rgba(183,164,255,${alpha})`;ctx.lineWidth=.65;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
          }
        }
        for(const p of points){const alpha=.16+p.depth*.49;ctx.beginPath();ctx.fillStyle=p.hue>.72?`rgba(133,205,255,${alpha})`:`rgba(201,188,255,${alpha})`;ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
        if(runtime.bursts.length&&!runtime.reduced){
          const alive=[];
          for(const b of runtime.bursts){b.x+=b.vx;b.y+=b.vy;b.vx*=.985;b.vy=b.vy*.985+.012;b.life-=.022;if(b.life<=0)continue;ctx.beginPath();ctx.fillStyle=`rgba(${b.blue?'137,202,255':'204,188,255'},${Math.max(0,b.life*.85)})`;ctx.arc(b.x,b.y,b.size*(.5+b.life),0,Math.PI*2);ctx.fill();alive.push(b);}

      }

        if(time-runtime.lastFrame<27){runtime.raf=requestAnimationFrame(animate);return;}
        runtime.lastFrame=time;draw(time);runtime.raf=requestAnimationFrame(animate);
      }
      function schedule(){if(!runtime.raf&&!document.hidden&&!runtime.reduced)runtime.raf=requestAnimationFrame(animate);}

    function setupScrollFly(){
      if(scrollFlyObserver){scrollFlyObserver.disconnect();scrollFlyObserver=null;}
      const reduceMotion=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches||false;
      const selectors=['.hero .eyebrow','.hero p','.hero-buttons','.hero-note','.section-head .eyebrow','.section-head h2','.section-head p','.feature-card','.template-card','.cta-band > div','.cta-band > button','footer > span'];
      const targets=[...new Set(selectors.flatMap(selector=>[...document.querySelectorAll('#app '+selector)]))];
      if(reduceMotion||!('IntersectionObserver' in window)){targets.forEach(el=>el.classList.remove('scroll-fly','in-view'));return;}
      scrollFlyObserver=new IntersectionObserver(entries=>{for(const entry of entries){if(entry.isIntersecting){entry.target.classList.add('in-view');scrollFlyObserver?.unobserve(entry.target);}}},{threshold:.12,rootMargin:'0px 0px -32px 0px'});
      targets.forEach((el,index)=>{
        el.classList.remove('in-view');el.classList.add('scroll-fly');
        const horizontal=el.matches('.feature-card,.template-card');
        const from=horizontal?(index%3===0?'left':index%3===1?'up':'right'):(el.matches('.section-head p,.hero p')?'left':'up');
        el.style.setProperty('--fly-x',from==='left'?'-28px':from==='right'?'28px':'0px');
        el.style.setProperty('--fly-y',from==='up'?'28px':'0px');
        el.style.setProperty('--fly-delay',`${Math.min(index%4,3)*65}ms`);
        scrollFlyObserver.observe(el);
      });
    }

        else if(action==='copy-url'){if(!state.profile?.username){toast('Hãy tạo username trước.','error');return;}await copyText(bioUrl());}
        else if(action==='copy-public-url'){await copyText(bioUrl(state.publicSlug));}
        else if(action==='share-public'){const url=bioUrl(state.publicSlug);if(navigator.share){try{await navigator.share({title:state.publicProfile?.displayName||'Bio',url});}catch(e){if(e?.name!=='AbortError')await copyText(url);}}else await copyText(url);}
        else if(action==='open-public'){if(!state.profile?.username){state.tab='settings';render();toast('Tạo username trước khi mở Bio.','error');return;}window.open(bioUrl(),'_blank','noopener,noreferrer');}
        else if(action==='publish'){btn.disabled=true;await publishBio();}
        else if(action==='unpublish'){if(confirm('Gỡ xuất bản Bio? Khách truy cập sẽ không còn xem được trang này.'))await unpublishBio();}
        else if(action==='save-now'){await saveDraftNow();}
        else if(action==='choose-upload'){$(`#${btn.dataset.kind}-file`)?.click();}
        else if(action==='remove-image'){const key=btn.dataset.kind==='avatar'?'avatarUrl':'bannerUrl';state.draft[key]='';queueAutoSave();render();}
        else if(action==='add-link')openLinkModal();
        else if(action==='edit-link')openLinkModal(btn.dataset.id);
        else if(action==='toggle-link')changeLink(btn.dataset.id,'toggle');
        else if(action==='duplicate-link')changeLink(btn.dataset.id,'duplicate');
        else if(action==='delete-link')changeLink(btn.dataset.id,'delete');
        else if(action==='move-link')changeLink(btn.dataset.id,'move',btn.dataset.dir);
        else if(action==='edit-social'){state.socialEditingId=btn.dataset.id;state.tab='links';render();$('#social-form')?.scrollIntoView({behavior:'smooth',block:'center'});}
        else if(action==='cancel-social-edit'){state.socialEditingId=null;render();}
        else if(action==='toggle-social'){const item=state.draft.socials.find(x=>x.id===btn.dataset.id);if(item){item.enabled=item.enabled===false;queueAutoSave();render();}}
        else if(action==='delete-social'){const item=state.draft.socials.find(x=>x.id===btn.dataset.id);if(item&&confirm(`Xoá tài khoản ${item.label||item.platform}?`)){state.draft.socials=state.draft.socials.filter(x=>x.id!==btn.dataset.id);if(state.socialEditingId===btn.dataset.id)state.socialEditingId=null;queueAutoSave();render();}}
        else if(action==='close-modal')$('#modal-root').innerHTML='';
        else if(action==='check-username')await checkUsername();
        else if(action==='apply-preset')applyPreset(btn.dataset.preset);
        else if(action==='reset-theme'){state.draft.theme={...DEFAULT_THEME};queueAutoSave();render();toast('Đã khôi phục giao diện mặc định.');}
        else if(action==='refresh-analytics')await refreshAnalytics();
        else if(action==='send-reset'){if(!state.user?.email){toast('Tài khoản không có email để khôi phục.','error');return;}await sendPasswordResetEmail(auth,state.user.email);toast('Đã gửi email hướng dẫn đặt lại mật khẩu.');}
        else if(action==='export-data')exportData();
        else if(action==='retry-public')loadPublicProfile(state.publicSlug);
        else if(action==='public-link'){const link=state.publicProfile?.links?.find(l=>String(l.id)===btn.dataset.linkId);if(link&&state.publicProfile.uid)recordEvent(state.publicProfile.uid,{type:'click',timestamp:Date.now(),username:state.publicSlug,linkId:link.id,linkTitle:link.title});}
      }catch(error){toast(friendlyError(error),'error');console.error('Action failed:',action,error?.code||error?.message||error);}
    });
    document.addEventListener('submit',async event=>{
      const form=event.target.closest('[data-form]');if(!form)return;event.preventDefault();
      try{
        if(form.dataset.form==='auth')await handleAuthSubmit(form);
        else if(form.dataset.form==='link')await handleLinkSubmit(form);
        else if(form.dataset.form==='username'){
          const input=$('#username-input');const slug=normalizeUsername(input?.value);const err=validateUsername(slug);if(err){toast(err,'error');return;}const submit=$('button[type="submit"]',form);if(submit){submit.disabled=true;submit.textContent='Đang lưu…';}
          try{await saveUsername(slug);}finally{if(submit){submit.disabled=false;submit.innerHTML=`${icon('check',14)} Lưu username`;}}
        }else if(form.dataset.form==='social'){
          const fd=new FormData(form);const platform=String(fd.get('platform')||'website');let raw=String(fd.get('url')||'').trim();if(platform==='email'&&!/^mailto:/i.test(raw))raw='mailto:'+raw;const url=platform==='email'?(safeLinkUrl(raw)):safeHttpUrl(raw,{prefix:true});if(!url){toast('Địa chỉ mạng xã hội không hợp lệ.','error');return;}const platformLabel=SOCIAL_PLATFORMS.find(x=>x[0]===platform)?.[1]||'Website';const id=state.socialEditingId||crypto.randomUUID();const old=state.draft.socials.find(x=>x.id===id);const item={id,platform,label:platformLabel,url,enabled:old?.enabled!==false,createdAt:old?.createdAt||Date.now()};if(old)state.draft.socials=state.draft.socials.map(x=>x.id===id?item:x);else state.draft.socials.push(item);state.socialEditingId=null;queueAutoSave();render();toast(old?'Đã cập nhật tài khoản mạng xã hội.':'Đã thêm tài khoản mạng xã hội.');
        }else if(form.dataset.form==='editor'){event.preventDefault();await saveDraftNow();}
      }catch(error){toast(friendlyError(error),'error');}
    });
    document.addEventListener('input',event=>{
      const el=event.target;
      if(el.matches('[data-draft-field]')){
        state.draft[el.dataset.draftField]=el.value;queueAutoSave();refreshLivePreview();
      }else if(el.matches('[data-theme-field]')){
        const key=el.dataset.themeField;let value=el.value;if(key==='radius')value=Number(value);if(['bg','text','muted','accent'].includes(key))value=safeColor(value,DEFAULT_THEME[key]);state.draft.theme={...state.draft.theme,[key]:value};if(key==='radius'&&$('#radius-value'))$('#radius-value').textContent=`${value}px`;const code=el.closest('.color-field')?.querySelector('code');if(code)code.textContent=value;queueAutoSave();refreshLivePreview();
      }else if(el.matches('[data-draft-toggle]')){state.draft[el.dataset.draftToggle]=el.checked;queueAutoSave();refreshLivePreview();}
      else if(el.matches('[data-theme-toggle]')){const key=el.dataset.themeToggle;state.draft.theme={...state.draft.theme,[key==='solid'?'linkStyle':key]:key==='solid'?(el.checked?'solid':'glass'):el.checked};queueAutoSave();refreshLivePreview();}
      else if(el.matches('#username-input')){const normalized=normalizeUsername(el.value);const url=$('#username-url-preview');if(url)url.textContent=`${location.origin}${location.pathname}#${normalized||'username'}`;const status=$('#username-status');if(status)status.textContent='';state.usernameChecked='';}
    });
    document.addEventListener('change',event=>{
      const el=event.target;
      if(el.matches('[data-upload]')){const file=el.files?.[0];if(file)uploadImage(el.dataset.upload,file);el.value='';}
      if(el.matches('[data-draft-field]')||el.matches('[data-theme-field]')){queueAutoSave();refreshLivePreview();}
      if(el.matches('[data-theme-toggle]')){const key=el.dataset.themeToggle;state.draft.theme={...state.draft.theme,[key==='solid'?'linkStyle':key]:key==='solid'?(el.checked?'solid':'glass'):el.checked};queueAutoSave();refreshLivePreview();}
    });
    document.addEventListener('click',event=>{
      if(event.target.closest('[data-preview-link]')){event.preventDefault();return;}
      const anchor=event.target.closest('a[data-public-link],a[data-public-social]');if(!anchor||!state.publicProfile?.uid)return;
      const id=anchor.dataset.linkId;const socialId=anchor.dataset.socialId;const link=anchor.dataset.publicSocial?state.publicProfile.socials?.find(item=>String(item.id)===String(socialId)):state.publicProfile.links?.find(item=>String(item.id)===String(id));
      if(!link)return;
      const task=recordEvent(state.publicProfile.uid,{type:'click',timestamp:Date.now(),username:state.publicSlug,linkId:link.id||socialId,linkTitle:link.title||link.label||link.platform||'Mạng xã hội'});
      if(anchor.target==='_self'){
        event.preventDefault();const url=anchor.href;let moved=false;const go=()=>{if(moved)return;moved=true;location.assign(url);};
        Promise.race([task,new Promise(resolve=>setTimeout(resolve,180))]).finally(go);
      }
    });
    document.addEventListener('dragstart',event=>{const item=event.target.closest('[data-draggable="1"]');if(!item)return;state.dragLinkId=item.dataset.linkId;event.dataTransfer?.setData('text/plain',state.dragLinkId);if(event.dataTransfer)event.dataTransfer.effectAllowed='move';});
    document.addEventListener('dragover',event=>{if(event.target.closest('[data-draggable="1"]'))event.preventDefault();});
    document.addEventListener('drop',event=>{const target=event.target.closest('[data-draggable="1"]');if(!target||!state.dragLinkId)return;event.preventDefault();const from=state.draft.links.findIndex(l=>l.id===state.dragLinkId);const to=state.draft.links.findIndex(l=>l.id===target.dataset.linkId);if(from>=0&&to>=0&&from!==to){const [item]=state.draft.links.splice(from,1);state.draft.links.splice(to,0,item);queueAutoSave();render();}state.dragLinkId=null;});
    window.addEventListener('hashchange',routeFromHash);
    window.addEventListener('online',()=>{if(state.dirty&&state.user)saveDraftNow(true);});
    window.addEventListener('beforeunload',event=>{if(state.dirty){event.preventDefault();event.returnValue='';}});

    if(location.hash)routeFromHash();else render();
    onAuthStateChanged(auth,authStateChanged);
  </script>
</body>
</html>
