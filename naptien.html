<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigitalsMod - Nạp Tiền</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0a12; color: #fff; overflow-x: hidden; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .card {
            position: relative; z-index: 2; width: 90%; max-width: 420px;
            background: rgba(20, 20, 35, 0.7); backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 204, 0.2); border-radius: 20px;
            padding: 30px; box-shadow: 0 0 30px rgba(0, 255, 204, 0.15); text-align: center;
        }
        
        h2 { color: #00ffcc; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
        .sub-title { font-size: 13px; color: #8a8a9e; margin-bottom: 20px; }
        
        .balance-box { background: rgba(0, 255, 204, 0.05); border: 1px dashed #00ffcc; border-radius: 12px; padding: 12px; margin-bottom: 20px; }
        .balance-val { font-size: 24px; font-weight: bold; color: #00ffcc; }

        .qr-frame {
            position: relative; background: #fff; padding: 12px; border-radius: 16px;
            display: inline-block; box-shadow: 0 0 20px rgba(0, 255, 204, 0.3); margin-bottom: 15px;
        }
        .qr-frame img { width: 180px; height: 180px; display: block; }
        
        .info-text { font-size: 13px; color: #aaa; line-height: 1.6; }
        .highlight { color: #00ffcc; font-weight: bold; }
        
        .status { margin-top: 15px; font-size: 12px; color: #ffcc00; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .dots { width: 8px; height: 8px; background: #ffcc00; border-radius: 50%; animation: blink 1s infinite alternate; }
        @keyframes blink { from { opacity: 0.2; } to { opacity: 1; } }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="card">
        <h2>DigitalsMod</h2>
        <div class="sub-title">CỔNG NHẬN THANH TOÁN TỰ ĐỘNG</div>

        <div class="balance-box">
            <div style="font-size: 12px; color: #aaa;">SỐ DƯ HIỆN TẠI</div>
            <div class="balance-val" id="userBalance">0 VNĐ</div>
        </div>

        <div class="qr-frame">
            <!-- QR SePay cho tài khoản VietinBank của bạn -->
            <img src="https://qr.sepay.vn/img?bank=VietinBank&acc=999939213333&template=compact&des=SEQR%20TKPDGS" alt="VietQR">
        </div>

        <div class="info-text">
            Nội dung chuyển khoản:<br>
            <span class="highlight">SEQR TKPDGS</span>
        </div>

        <div class="status" id="statusText">
            <div class="dots"></div> Đang kiểm tra lịch sử giao dịch...
        </div>
    </div>

    <script>
        // 1. Hiệu ứng Bụi bay Canvas
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = Array.from({length: 50}, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.5,
            speedX: (Math.random() - 0.5) * 0.5,
            speedY: (Math.random() - 0.5) * 0.5
        }));

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(0, 255, 204, 0.4)';
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                p.x += p.speedX; p.y += p.speedY;
                if(p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                if(p.y < 0 || p.y > canvas.height) p.speedY *= -1;
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        // 2. CẤU HÌNH API SEPAY (Gọi trực tiếp bằng JS)
        const SEPAY_API_KEY = "ĐIỀN_API_KEY_SEPAY_CỦA_BẠN_VÀO_ĐÂY";
        const ACCOUNT_NUMBER = "999939213333";
        let totalBalance = 0;

        async function checkTransactions() {
            try {
                const response = await fetch(`https://my.sepay.vn/userapi/transactions/list?account_number=${ACCOUNT_NUMBER}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${SEPAY_API_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                
                if (data.status === 200 && data.transactions) {
                    let newBalance = 0;
                    
                    // Lọc các giao dịch có nội dung chứa TKPDGS hoặc DGS
                    data.transactions.forEach(tx => {
                        if (tx.transaction_content && (tx.transaction_content.includes('TKPDGS') || tx.transaction_content.includes('DGS'))) {
                            newBalance += parseFloat(tx.amount_in || 0);
                        }
                    });

                    totalBalance = newBalance;
                    document.getElementById('userBalance').innerText = new Intl.NumberFormat('vi-VN').format(totalBalance) + ' VNĐ';
                    document.getElementById('statusText').innerHTML = '✅ Đã đồng bộ giao dịch từ ngân hàng';
                }
            } catch (error) {
                document.getElementById('statusText').innerText = 'Chờ cập nhật giao dịch mới...';
            }
        }

        // Tự động quét giao dịch mỗi 5 giây
        checkTransactions();
        setInterval(checkTransactions, 5000);
    </script>
</body>
</html>
