<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigitalsMod - Nạp Tiền Cyberpunk</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #060709; color: #fff; overflow-x: hidden; display: flex; justify-content: center; align-items: center; min-height: 100vh; position: relative; }
        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        .card {
            position: relative; z-index: 2; width: 92%; max-width: 440px;
            background: rgba(15, 18, 28, 0.75); backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 204, 0.25); border-radius: 24px;
            padding: 28px 24px; box-shadow: 0 0 35px rgba(0, 255, 204, 0.15); text-align: center;
        }
        
        .brand-title { color: #00ffcc; text-transform: uppercase; letter-spacing: 3px; font-size: 24px; font-weight: 800; text-shadow: 0 0 12px rgba(0, 255, 204, 0.6); }
        .sub-title { font-size: 11px; color: #7a829e; letter-spacing: 1px; margin-bottom: 18px; }
        
        .balance-box { background: rgba(0, 255, 204, 0.04); border: 1px dashed rgba(0, 255, 204, 0.4); border-radius: 14px; padding: 10px; margin-bottom: 18px; }
        .balance-val { font-size: 22px; font-weight: bold; color: #00ffcc; }

        /* Method Tabs */
        .method-group { display: flex; gap: 10px; margin-bottom: 16px; }
        .method-btn {
            flex: 1; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03); color: #aaa; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .method-btn.active { background: rgba(0, 255, 204, 0.15); border-color: #00ffcc; color: #00ffcc; box-shadow: 0 0 10px rgba(0, 255, 204, 0.2); }

        /* Input Amount */
        .input-box { margin-bottom: 16px; text-align: left; }
        .input-box label { font-size: 12px; color: #8a8a9e; display: block; margin-bottom: 6px; }
        .input-box input {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 10px; color: #fff; font-size: 15px; outline: none; transition: 0.3s;
        }
        .input-box input:focus { border-color: #00ffcc; box-shadow: 0 0 8px rgba(0, 255, 204, 0.4); }

        /* Action Button */
        .btn-action {
            width: 100%; padding: 13px; background: linear-gradient(135deg, #00ffcc, #0088cc);
            border: none; border-radius: 10px; color: #000; font-weight: 800; font-size: 14px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; margin-bottom: 16px;
        }
        .btn-action:hover { opacity: 0.9; box-shadow: 0 0 15px rgba(0, 255, 204, 0.5); }

        /* Custom QR Display Box */
        .qr-wrapper {
            position: relative; width: 210px; height: 210px; margin: 0 auto 15px;
            background: #fff; padding: 10px; border-radius: 16px; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.25); overflow: hidden; opacity: 0; transform: scale(0.8); transition: 0.5s ease;
        }
        .qr-wrapper.show { opacity: 1; transform: scale(1); }
        .qr-wrapper img { width: 100%; height: 100%; object-fit: contain; }
        
        /* Custom Brand Badge over QR */
        .brand-badge {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #060709; color: #00ffcc; padding: 4px 8px; border-radius: 6px;
            font-size: 10px; font-weight: 900; border: 1px solid #00ffcc; box-shadow: 0 0 8px #000;
        }

        .info-text { font-size: 12px; color: #8a8a9e; line-height: 1.5; }
        .highlight { color: #00ffcc; font-weight: bold; }

        /* Modal Pop-up Thẻ cào */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px); z-index: 10;
            display: none; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #0f121c; border: 1px solid #00ffcc; border-radius: 20px;
            padding: 24px; width: 90%; max-width: 380px; position: relative; box-shadow: 0 0 25px rgba(0,255,204,0.3);
        }
        .close-btn { position: absolute; top: 12px; right: 16px; color: #aaa; font-size: 20px; cursor: pointer; }
        .close-btn:hover { color: #fff; }
        .card-select { width: 100%; padding: 10px; background: #060709; border: 1px solid rgba(0, 255, 204, 0.3); border-radius: 8px; color: #fff; margin-bottom: 12px; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="card">
        <div class="brand-title">DIGITALSMOD</div>
        <div class="sub-title">CỔNG THANH TOÁN TỰ ĐỘNG</div>

        <div class="balance-box">
            <div style="font-size: 11px; color: #8a8a9e;">SỐ DƯ HIỆN TẠI</div>
            <div class="balance-val" id="userBalance">0 VNĐ</div>
        </div>

        <!-- Chọn phương thức -->
        <div class="method-group">
            <button class="method-btn active" id="btnMethodQr" onclick="switchMethod('qr')">Quét Mã QR</button>
            <button class="method-btn" id="btnMethodCard" onclick="openCardModal()">Thẻ Cào</button>
        </div>

        <!-- Nhập số tiền -->
        <div class="input-box" id="amountBox">
            <label>Nhập số tiền cần nạp (VNĐ):</label>
            <input type="number" id="inputAmount" value="50000" min="10000" step="10000">
        </div>

        <button class="btn-action" onclick="generateQR()">Tạo Mã Thanh Toán</button>

        <!-- Khung QR hiển thị logo DigitalsMod -->
        <div class="qr-wrapper" id="qrWrapper">
            <img id="qrImage" src="" alt="VietQR">
            <div class="brand-badge">DIGITALSMOD</div>
        </div>

        <div class="info-text">
            Nội dung chuyển khoản:<br>
            <span class="highlight">SEQR TKPDGS</span>
        </div>
    </div>

    <!-- Pop-up Thẻ Cào -->
    <div class="modal-overlay" id="cardModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCardModal()">&times;</span>
            <h3 style="color:#00ffcc; margin-bottom:15px; font-size: 18px;">NẠP THẺ CÀO</h3>
            <select class="card-select" id="cardType">
                <option value="VIETTEL">Viettel</option>
                <option value="VINAPHONE">Vinaphone</option>
                <option value="MOBIFONE">Mobifone</option>
            </select>
            <div class="input-box">
                <input type="text" placeholder="Mã số thẻ (PIN)">
            </div>
            <div class="input-box">
                <input type="text" placeholder="Số Seri thẻ">
            </div>
            <button class="btn-action" style="margin-bottom:0;" onclick="submitCard()">Gửi Thẻ Gạch Nợ</button>
        </div>
    </div>

    <script>
        // 1. Cấu hình hiệu ứng Hạt bụi tụ lại kết thành mã QR
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let isGathering = false;
        let particles = Array.from({length: 120}, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            origX: 0, origY: 0,
            size: Math.random() * 2 + 1,
            vx: (Math.random() - 0.5) * 1.2,
            vy: (Math.random() - 0.5) * 1.2,
            angle: Math.random() * Math.PI * 2
        }));

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ffcc';

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                if (isGathering) {
                    // Xoay tròn và hút về tâm màn hình
                    p.angle += 0.08;
                    const radius = Math.max(0, (p.dist || 200) - 4);
                    p.dist = radius;
                    p.x = centerX + Math.cos(p.angle) * radius;
                    p.y = centerY + Math.sin(p.angle) * radius;
                } else {
                    // Bay tự do lơ lửng
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                }
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        // 2. Xử lý Tạo Mã QR & Hiệu ứng
        function generateQR() {
            const amount = document.getElementById('inputAmount').value || 0;
            const qrWrapper = document.getElementById('qrWrapper');
            const qrImage = document.getElementById('qrImage');

            qrWrapper.classList.remove('show');
            isGathering = true;

            // Khởi tạo bán kính tụ hạt
            particles.forEach(p => {
                const dx = p.x - window.innerWidth / 2;
                const dy = p.y - window.innerHeight / 2;
                p.dist = Math.sqrt(dx * dx + dy * dy);
            });

            // Sử dụng API VietQR chuẩn Napas (loại bỏ logo SePay)
            const qrUrl = `https://img.vietqr.io/image/VietinBank-999939213333-compact2.png?amount=${amount}&addInfo=SEQR%20TKPDGS&accountName=DIGITALSMOD`;

            setTimeout(() => {
                qrImage.src = qrUrl;
                qrWrapper.classList.add('show');
                isGathering = false;
            }, 1200);
        }

        // 3. Quản lý Pop-up Thẻ Cào
        function openCardModal() {
            document.getElementById('cardModal').style.display = 'flex';
        }
        function closeCardModal() {
            document.getElementById('cardModal').style.display = 'none';
            document.getElementById('btnMethodCard').classList.remove('active');
            document.getElementById('btnMethodQr').classList.add('active');
        }
        function submitCard() {
            alert('Đã gửi thông tin thẻ cào lên hệ thống chờ duyệt!');
            closeCardModal();
        }

        function switchMethod(type) {
            if(type === 'qr') {
                document.getElementById('btnMethodQr').classList.add('active');
                document.getElementById('btnMethodCard').classList.remove('active');
            }
        }

        // Tạo mã mặc định lần đầu
        generateQR();
    </script>
</body>
</html>
