<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DigitalsMod - Liquid Glass Gate</title>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary-neon: #00ffcc;
            --secondary-neon: #ff007f;
            --blue-neon: #00bfff;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(0, 255, 204, 0.3);
            --glass-shadow: rgba(0, 255, 204, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: #030408;
            color: #fff;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            perspective: 1000px;
        }

        .neon-bg {
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 255, 204, 0.12), rgba(255, 0, 127, 0.08), rgba(3, 4, 8, 1) 70%);
            animation: bgRotate 20s linear infinite;
            z-index: 0;
            pointer-events: none;
            will-change: transform;
        }

        @keyframes bgRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- 1. FIX LAYOUT HEADER & CARD (CHỐNG CHE CHỮ) --- */
        .glass-card {
            position: relative; z-index: 2; width: 90%; max-width: 420px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 28px;
            border: 1px solid var(--glass-border);
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px var(--glass-shadow), inset 0 0 15px rgba(255,255,255,0.05);
            text-align: center;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
            will-change: transform;
            touch-action: none;
        }

        .header-nav {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 12px;
            transform: translateZ(25px);
        }

        .btn-home {
            background: rgba(0, 255, 204, 0.08);
            border: 1px solid var(--primary-neon);
            color: var(--primary-neon);
            padding: 6px 14px; border-radius: 12px;
            font-size: 11px; font-weight: bold;
            cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; gap: 6px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        .btn-home:hover { background: var(--primary-neon); color: #000; box-shadow: 0 0 15px rgba(0,255,204,0.5); }

        .brand-title {
            color: var(--primary-neon);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 22px;
            font-weight: 900;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            transform: translateZ(20px);
            margin-top: 4px;
        }

        .sub-title { font-size: 11px; color: #8a8a9e; letter-spacing: 1.5px; margin-bottom: 20px; transform: translateZ(15px); }

        .balance-box {
            background: rgba(0, 255, 204, 0.03);
            border: 1px dashed rgba(0, 255, 204, 0.35);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 18px;
            backdrop-filter: blur(10px);
            transform: translateZ(15px);
        }

        .balance-val { font-size: 24px; font-weight: bold; color: var(--primary-neon); text-shadow: 0 0 10px rgba(0,255,204,0.4); }

        .method-group { display: flex; gap: 10px; margin-bottom: 18px; transform: translateZ(15px); }
        .method-btn {
            flex: 1; padding: 12px; border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.02);
            color: #aaa; font-size: 13px; font-weight: 700; cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .method-btn.active {
            background: rgba(0, 255, 204, 0.12);
            border-color: var(--primary-neon);
            color: var(--primary-neon);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.25), inset 0 0 10px rgba(0, 255, 204, 0.1);
        }

        .input-box { margin-bottom: 18px; text-align: left; transform: translateZ(15px); }
        .input-box label { font-size: 12px; color: #8a8a9e; display: block; margin-bottom: 6px; margin-left: 4px; }
        .input-box input {
            width: 100%; padding: 14px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 204, 0.25);
            border-radius: 14px; color: #fff; font-size: 16px; outline: none;
            transition: all 0.3s;
        }

        .input-box input:focus {
            border-color: var(--primary-neon);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        .btn-action {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, var(--primary-neon), #0099ff);
            border: none; border-radius: 14px;
            color: #030408; font-weight: 900; font-size: 15px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px;
            transition: all 0.3s; margin-bottom: 18px;
            box-shadow: 0 5px 20px rgba(0, 255, 204, 0.3);
            transform: translateZ(20px);
        }

        .btn-download {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--primary-neon);
            color: var(--primary-neon);
            padding: 8px 16px; font-size: 12px; font-weight: bold;
            border-radius: 10px; cursor: pointer; margin-top: 8px;
            display: inline-block; transition: all 0.3s;
        }

        /* Khung VietQR Clean Cyberpunk */
        .qr-wrapper {
            position: relative; width: 210px; height: 210px; margin: 0 auto 10px;
            background: #ffffff; padding: 10px; border-radius: 20px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
            overflow: hidden; opacity: 0; transform: translateZ(25px) scale(0.95);
            transition: opacity 0.3s, transform 0.3s;
            visibility: hidden;
        }

        .qr-wrapper.show {
            visibility: visible; opacity: 1; transform: translateZ(25px) scale(1);
        }

        .qr-wrapper img { width: 100%; height: 100%; object-fit: contain; }
        
        .brand-badge {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #030408; color: var(--primary-neon); padding: 2px 6px; border-radius: 4px;
            font-size: 8px; font-weight: 900; border: 1px solid var(--primary-neon);
            box-shadow: 0 0 8px #000; letter-spacing: 0.5px;
        }

        .info-text { font-size: 12px; color: #8a8a9e; line-height: 1.6; transform: translateZ(10px); }
        .highlight { color: var(--primary-neon); font-weight: bold; text-shadow: 0 0 8px rgba(0,255,204,0.5); }

        /* --- 2. HIỆU ỨNG LOADING MỜ WEB GIỐNG INDEX.HTML --- */
        .page-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 4, 8, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }

        .page-loader.active {
            opacity: 1; pointer-events: all;
        }

        .cyber-spinner {
            width: 60px; height: 60px; border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: var(--primary-neon);
            border-bottom-color: var(--secondary-neon);
            animation: spin 1s linear infinite;
            box-shadow: 0 0 25px var(--primary-neon);
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            color: var(--primary-neon);
            font-size: 13px; font-weight: bold; letter-spacing: 2px;
            text-transform: uppercase; text-shadow: 0 0 10px var(--primary-neon);
            animation: blink 1s infinite alternate;
        }

        @keyframes blink { 0% { opacity: 0.4; } 100% { opacity: 1; } }

        /* Liquid Glass Modal & Pop-up */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 4, 8, 0.7); backdrop-filter: blur(20px);
            z-index: 100; display: none; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.3s;
        }

        .modal-overlay.show { opacity: 1; display: flex; }

        .modal-content {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 28px; width: 90%; max-width: 380px;
            position: relative; box-shadow: 0 0 35px rgba(0, 255, 204, 0.2);
            backdrop-filter: blur(25px); text-align: center;
            transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.show .modal-content { transform: scale(1); }
        .close-btn { position: absolute; top: 16px; right: 20px; color: #aaa; font-size: 22px; cursor: pointer; }
        .card-select { width: 100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,255,204,0.3); border-radius: 12px; color: #fff; margin-bottom: 14px; outline: none; }

        .success-icon-box {
            width: 70px; height: 70px; margin: 0 auto 15px;
            background: rgba(0, 255, 204, 0.1);
            border: 2px solid var(--primary-neon);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 32px; color: var(--primary-neon);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.5);
            animation: pulseGlow 1.5s infinite ease-in-out;
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 255, 204, 0.5); }
            50% { transform: scale(1.08); box-shadow: 0 0 40px rgba(0, 255, 204, 0.9); }
        }
    </style>
</head>
<body>
    <div class="neon-bg"></div>

    <!-- OVERLAY LOADING GIỐNG INDEX.HTML -->
    <div class="page-loader" id="pageLoader">
        <div class="cyber-spinner"></div>
        <div class="loader-text">ĐANG TẠO MÃ THANH TOÁN...</div>
    </div>

    <div class="glass-card" id="glassCard">
        <!-- Đưa nút về trang chủ lên hàng riêng -->
        <div class="header-nav">
            <a href="index.html" class="btn-home">
                &#8592; Trang Chủ
            </a>
        </div>

        <div class="brand-title">DIGITALSMOD</div>
        <div class="sub-title">CỔNG THANH TOÁN TỰ ĐỘNG</div>

        <div class="balance-box">
            <div style="font-size: 11px; color: #8a8a9e;">TÀI KHOẢN: <span id="displayUser" style="color:#fff; font-weight:bold;">...</span></div>
            <div class="balance-val" id="userBalance">0 VNĐ</div>
        </div>

        <div class="method-group">
            <button class="method-btn active" id="btnMethodQr" onclick="switchMethod('qr')">Quét Mã QR</button>
            <button class="method-btn" id="btnMethodCard" onclick="openCardModal()">Thẻ Cào</button>
        </div>

        <div class="input-box" id="amountBox">
            <label>Nhập số tiền nạp (VNĐ):</label>
            <input type="number" id="inputAmount" value="50000" min="10000" step="10000">
        </div>

        <button class="btn-action" onclick="generateQR()">Tạo Mã Thanh Toán</button>

        <div class="qr-wrapper" id="qrWrapper">
            <img id="qrImage" src="" alt="VietQR">
            <div class="brand-badge">DIGITALSMOD</div>
        </div>
        <button class="btn-download" id="dlBtn" style="display:none;" onclick="downloadQR()">Tải Mã QR Về Máy</button>

        <div class="info-text" style="margin-top:10px;">
            Nội dung chuyển khoản:<br>
            <span class="highlight" id="transferContent">SEVQR NAP ...</span>
        </div>
    </div>

    <!-- Liquid Glass Card Modal (Nạp Thẻ) -->
    <div class="modal-overlay" id="cardModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCardModal()">&times;</span>
            <h3 style="color:var(--primary-neon); margin-bottom:18px; font-size: 20px;">NẠP THẺ CÀO</h3>
            <select class="card-select" id="cardType">
                <option value="VIETTEL">Viettel</option>
                <option value="VINAPHONE">Vinaphone</option>
                <option value="MOBIFONE">Mobifone</option>
            </select>
            <div class="input-box">
                <input type="text" placeholder="Mã số thẻ (PIN)">
            </div>
            <div class="input-box">
                <input type="text" placeholder="Số Seri thẻ">
            </div>
            <button class="btn-action" style="margin-bottom:0;" onclick="submitCard()">Gửi Thẻ Gạch Nợ</button>
        </div>
    </div>

    <!-- POP-UP THÔNG BÁO CỘNG TIỀN THÀNH CÔNG REALTIME -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-content">
            <div class="success-icon-box">&#10004;</div>
            <h3 style="color:var(--primary-neon); font-size: 22px; font-weight: 900; margin-bottom: 8px;">NẠP TIỀN THÀNH CÔNG!</h3>
            <p style="font-size: 13px; color: #8a8a9e; margin-bottom: 15px;">Hệ thống đã tự động ghi nhận giao dịch của bạn.</p>
            
            <div style="background: rgba(0, 255, 204, 0.05); border: 1px border-slate-700; border-radius: 14px; padding: 12px; margin-bottom: 20px; font-size: 14px;">
                <p style="color: #aaa; font-size: 11px;">Số tiền cộng thêm:</p>
                <p style="color: var(--primary-neon); font-size: 22px; font-weight: bold;" id="addedAmountText">+0 VNĐ</p>
            </div>

            <button class="btn-action" style="margin-bottom:0;" onclick="closeSuccessModal()">ĐÃ HIỂU & ĐÓNG</button>
        </div>
    </div>

    <script>
        // --- 1. LẤY TÀI KHOẢN CHUẨN ĐỒNG BỘ VỚI INDEX.HTML ---
        const urlParams = new URLSearchParams(window.location.search);
        
        let storedUserObj = null;
        try {
            storedUserObj = JSON.parse(localStorage.getItem('ds_user'));
        } catch(e) {}

        let currentUser = urlParams.get('user') || 
                          (storedUserObj ? (storedUserObj.username || storedUserObj.email) : null) ||
                          localStorage.getItem('user') || 
                          localStorage.getItem('username') || 
                          localStorage.getItem('DGS_USERNAME') || 
                          'DIGITALSMOD';
        
        currentUser = currentUser.toUpperCase().trim();
        document.getElementById('displayUser').innerText = currentUser;
        
        const transferContentText = `SEVQR NAP ${currentUser}`;
        document.getElementById('transferContent').innerText = transferContentText;

        // --- 2. HIỆU ỨNG TẠO MÃ QR VỚI OVERLAY MỜ TRANG GIỐNG INDEX ---
        let currentQRUrl = "";

        function generateQR() {
            const amount = document.getElementById('inputAmount').value || 0;
            const qrWrapper = document.getElementById('qrWrapper');
            const qrImage = document.getElementById('qrImage');
            const dlBtn = document.getElementById('dlBtn');
            const loader = document.getElementById('pageLoader');

            // 1. Bật Mờ Trang Loading Cyberpunk
            loader.classList.add('active');

            currentQRUrl = `https://img.vietqr.io/image/VietinBank-999939213333-compact2.png?amount=${amount}&addInfo=${encodeURIComponent(transferContentText)}&accountName=NGUYEN%20DAI%20QUOC%20DAT`;

            // Preload ảnh QR ngầm
            const tempImg = new Image();
            tempImg.src = currentQRUrl;
            tempImg.onload = function() {
                setTimeout(() => {
                    qrImage.src = currentQRUrl;
                    qrWrapper.classList.add('show');
                    dlBtn.style.display = 'inline-block';
                    
                    // Tắt Loading
                    loader.classList.remove('active');
                }, 600); // Tạo độ trễ mượt mà
            };
        }

        function downloadQR() {
            if(!currentQRUrl) return;
            const a = document.createElement('a');
            a.href = currentQRUrl;
            a.download = `VietQR_${currentUser}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // --- 3. FIREBASE FIRESTORE REALTIME SYNC & POP-UP CỘNG TIỀN ---
        const FIREBASE_PROJECT_ID = "quocdat-396fe";
        const BASE_URL = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents`;

        let previousBalance = null;

        function parseFirestoreFields(fields) {
            let res = {};
            for (let k in fields) {
                let obj = fields[k];
                if (obj.stringValue !== undefined) res[k] = obj.stringValue;
                else if (obj.doubleValue !== undefined) res[k] = parseFloat(obj.doubleValue);
                else if (obj.integerValue !== undefined) res[k] = parseInt(obj.integerValue);
                else if (obj.booleanValue !== undefined) res[k] = obj.booleanValue;
            }
            return res;
        }

        async function saveDepositHistory(amount, currentUserId) {
            let depositId = 'dep_' + Date.now();
            let memo = "SEVQR" + Math.floor(1000 + Math.random() * 9000);
            try {
                await fetch(`${BASE_URL}/deposits/${depositId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fields: {
                            id: { stringValue: depositId },
                            user_id: { stringValue: currentUserId || 'usr_unknown' },
                            username: { stringValue: currentUser },
                            trans_id: { stringValue: memo },
                            amount: { doubleValue: parseFloat(amount) },
                            payment_method: { stringValue: 'VietinBank (SePay SEVQR)' },
                            status: { stringValue: 'success' },
                            created_at: { stringValue: new Date().toISOString() }
                        }
                    })
                });
            } catch (err) {}
        }

        async function syncFirebaseBalance() {
            try {
                let res = await fetch(`${BASE_URL}/users?pageSize=300`);
                if (res.ok) {
                    let data = await res.json();
                    (data.documents || []).forEach(doc => {
                        let fields = parseFirestoreFields(doc.fields || {});
                        if ((fields.username && fields.username.toUpperCase() === currentUser) || 
                            (fields.email && fields.email.toUpperCase() === currentUser)) {
                            
                            const currentBalance = fields.balance || 0;
                            document.getElementById('userBalance').innerText = new Intl.NumberFormat('vi-VN').format(currentBalance) + ' VNĐ';

                            if (previousBalance !== null && currentBalance > previousBalance) {
                                const addedAmount = currentBalance - previousBalance;
                                showSuccessPopup(addedAmount);
                                saveDepositHistory(addedAmount, fields.id || (storedUserObj ? storedUserObj.id : null));
                            }

                            previousBalance = currentBalance;
                            
                            if(storedUserObj) {
                                storedUserObj.balance = currentBalance;
                                localStorage.setItem('ds_user', JSON.stringify(storedUserObj));
                            }
                        }
                    });
                }
            } catch(e) {}
        }

        function showSuccessPopup(amount) {
            document.getElementById('addedAmountText').innerText = '+' + new Intl.NumberFormat('vi-VN').format(amount) + ' VNĐ';
            const modal = document.getElementById('successModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
        }

        function closeSuccessModal() {
            const modal = document.getElementById('successModal');
            modal.classList.remove('show');
            setTimeout(() => { modal.style.display = 'none'; }, 300);
        }

        setInterval(syncFirebaseBalance, 2500);
        syncFirebaseBalance();

        // --- 4. 3D TILT & PHYSICAL DRAG ---
        const card = document.getElementById('glassCard');
        let startX = 0, startY = 0, currentX = 0, currentY = 0, isDragging = false;

        document.addEventListener('mousemove', (e) => {
            if (isDragging) return;
            const rect = card.getBoundingClientRect();
            card.style.setProperty('--pointer-x', `${((e.clientX - rect.left) / rect.width) * 100}%`);
            card.style.setProperty('--pointer-y', `${((e.clientY - rect.top) / rect.height) * 100}%`);

            const rotateX = ((e.clientY - window.innerHeight / 2) / 25) * -1;
            const rotateY = (e.clientX - window.innerWidth / 2) / 25;
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        card.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX - currentX;
            startY = e.touches[0].clientY - currentY;
            card.style.transition = 'none';
        }, { passive: true });

        card.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentX = e.touches[0].clientX - startX;
            currentY = e.touches[0].clientY - startY;

            const rect = card.getBoundingClientRect();
            card.style.setProperty('--pointer-x', `${((e.touches[0].clientX - rect.left) / rect.width) * 100}%`);
            card.style.setProperty('--pointer-y', `${((e.touches[0].clientY - rect.top) / rect.height) * 100}%`);

            card.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) rotateX(${(currentY / 12) * -1}deg) rotateY(${currentX / 12}deg)`;
        }, { passive: true });

        card.addEventListener('touchend', () => {
            isDragging = false;
            currentX = 0; currentY = 0;
            card.style.transition = 'transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            card.style.transform = `translate3d(0, 0, 0) rotateX(0deg) rotateY(0deg)`;
        });

        // MODAL CONTROL
        function openCardModal() {
            const modal = document.getElementById('cardModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
        }

        function closeCardModal() {
            const modal = document.getElementById('cardModal');
            modal.classList.remove('show');
            setTimeout(() => {
                modal.style.display = 'none';
                document.getElementById('btnMethodCard').classList.remove('active');
                document.getElementById('btnMethodQr').classList.add('active');
            }, 300);
        }

        function submitCard() {
            alert('Đã gửi thông tin thẻ cào lên hệ thống chờ duyệt!');
            closeCardModal();
        }

        function switchMethod(type) {
            if(type === 'qr') {
                document.getElementById('btnMethodQr').classList.add('active');
                document.getElementById('btnMethodCard').classList.remove('active');
            }
        }
    </script>
</body>
</html>
