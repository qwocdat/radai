<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DigitalTube - Trình Phát Video & Audio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #05060a;
            --bg-surface: #0d1018;
            --bg-card: rgba(18, 22, 33, 0.7);
            --accent: #6366f1;
            --accent-2: #a855f7;
            --accent-3: #ec4899;
            --accent-glow: rgba(var(--accent-rgb), 0.55);
            --accent-glow-strong: rgba(var(--accent-rgb), 0.9);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(13, 16, 24, 0.72);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        /* KHÓA TÔ XANH HTML (DISABLE SELECTION) */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        input, textarea {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        html { scroll-behavior: smooth; }
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* AURORA BACKGROUND BLOBS */
        .aurora-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        .aurora-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: floatBlob 22s ease-in-out infinite;
        }
        .blob-1 {
            width: 520px; height: 520px;
            background: radial-gradient(circle, var(--accent), transparent 70%);
            top: -180px; left: -120px;
        }
        .blob-2 {
            width: 480px; height: 480px;
            background: radial-gradient(circle, var(--accent-2), transparent 70%);
            top: 40%; right: -160px;
            animation-delay: -7s;
        }
        .blob-3 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, var(--accent-3), transparent 70%);
            bottom: -140px; left: 30%;
            animation-delay: -14s;
            opacity: 0.28;
        }
        @keyframes floatBlob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, -40px) scale(1.1); }
            66% { transform: translate(-40px, 50px) scale(0.95); }
        }

        /* HEADER */
        header {
            height: 68px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* LOGO GLOW */
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #fff;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: -0.5px;
            position: relative;
            padding: 6px 4px;
            transition: transform 0.25s ease;
            cursor: pointer;
        }

        .brand-logo .icon-wrapper {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 15px var(--accent-glow),
                0 0 30px rgba(var(--accent2-rgb), 0.35),
                inset 0 0 8px rgba(255,255,255,0.25);
            transition: all 0.35s ease;
            position: relative;
            z-index: 2;
        }

        .brand-logo .icon-wrapper::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 13px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
            filter: blur(10px);
            opacity: 0.6;
            z-index: -1;
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.08); }
        }

        .brand-text {
            background: linear-gradient(90deg, #fff 0%, #fff 40%, #a5b4fc 55%, #c4b5fd 65%, #fff 80%);
            background-size: 220% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            background-position: 0% center;
            transition: all 0.3s ease;
        }

        .brand-logo:hover { transform: translateY(-1px); }
        .brand-logo:hover .icon-wrapper {
            box-shadow:
                0 0 25px var(--accent-glow-strong),
                0 0 50px rgba(var(--accent2-rgb), 0.55),
                0 0 80px rgba(var(--accent3-rgb), 0.35),
                inset 0 0 12px rgba(255,255,255,0.4);
            transform: rotate(-6deg) scale(1.08);
        }
        .brand-logo:hover .brand-text {
            animation: shimmerText 1.4s linear infinite;
            filter: drop-shadow(0 0 12px rgba(165, 180, 252, 0.7));
        }

        @keyframes shimmerText { to { background-position: 220% center; } }

        .brand-logo:active { transform: scale(0.97); }
        .brand-logo.clicked .icon-wrapper { animation: clickBurst 0.6s ease-out; }
        @keyframes clickBurst {
            0% { transform: scale(1) rotate(0); }
            30% { transform: scale(1.35) rotate(-12deg); box-shadow: 0 0 60px #fff, 0 0 100px var(--accent-glow-strong); }
            60% { transform: scale(0.95) rotate(6deg); }
            100% { transform: scale(1) rotate(0); }
        }

        /* SEARCH */
        .search-container {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 8px 20px;
            width: 38%;
            max-width: 480px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .search-container:focus-within {
            border-color: var(--accent);
            box-shadow:
                0 0 0 3px rgba(var(--accent-rgb), 0.15),
                0 0 24px var(--accent-glow),
                inset 0 0 12px rgba(var(--accent-rgb), 0.08);
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-1px);
        }

        .search-container input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 14px;
        }
        .search-container input::placeholder { color: #6b7280; }

        .search-container i {
            color: var(--text-sub);
            margin-left: 10px;
            transition: color 0.3s ease, transform 0.3s ease;
        }
        .search-container:focus-within i {
            color: var(--accent);
            transform: scale(1.15);
            filter: drop-shadow(0 0 6px var(--accent-glow));
        }

        /* MAIN */
        main { flex: 1; padding: 36px 28px; max-width: 1680px; margin: 0 auto; width: 100%; position: relative; }

        /* HOME */
        .home-section-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 26px;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.3px;
        }
        .home-section-title i {
            filter: drop-shadow(0 0 10px rgba(var(--accent-rgb), 0.8));
            animation: fireFlicker 2s ease-in-out infinite;
        }
        @keyframes fireFlicker {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.12); opacity: 0.85; }
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .movie-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            isolation: isolate;
            cursor: pointer;
        }

        .movie-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 3;
            pointer-events: none;
        }

        .movie-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(var(--accent-rgb), 0.15), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 2;
        }

        .movie-card:hover {
            transform: translateY(-8px) scale(1.015);
            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.6),
                0 0 30px rgba(var(--accent-rgb), 0.25),
                0 0 60px rgba(var(--accent2-rgb), 0.15);
        }
        .movie-card:hover::before { opacity: 1; }
        .movie-card:hover::after { opacity: 1; }

        .thumb-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            position: relative;
            overflow: hidden;
            background: #1a1d28;
        }

        .movie-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), filter 0.4s ease;
        }

        .movie-card:hover .movie-thumb {
            transform: scale(1.08);
            filter: brightness(1.05) saturate(1.1);
        }

        .ep-badge-tag {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(9, 10, 15, 0.85);
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 11px;
            border-radius: 7px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.4);
            transition: all 0.3s ease;
            z-index: 2;
        }
        .movie-card:hover .ep-badge-tag {
            background: rgba(var(--accent-rgb), 0.9);
            box-shadow: 0 0 20px var(--accent-glow-strong);
            border-color: rgba(255,255,255,0.3);
        }

        .movie-meta { padding: 16px; position: relative; z-index: 2; }
        .movie-title {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 8px;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.3s ease;
        }
        .movie-card:hover .movie-title { color: #c7d2fe; }
        .movie-desc {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* WATCH LAYOUT */
        .back-bar {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: #fff;
            padding: 9px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .back-btn:hover {
            background: rgba(var(--accent-rgb), 0.15);
            border-color: var(--accent);
            box-shadow: 0 0 18px var(--accent-glow);
            transform: translateX(-3px);
        }

        .player-layout { display: grid; grid-template-columns: 1fr 380px; gap: 28px; }
        @media (max-width: 1100px) { .player-layout { grid-template-columns: 1fr; } }

        .video-wrapper {
            width: 100%;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 16/9;
            box-shadow:
                0 25px 50px rgba(0,0,0,0.85),
                0 0 40px rgba(var(--accent-rgb), 0.18);
            border: 1px solid var(--border);
            position: relative;
            transition: box-shadow 0.4s ease;
        }
        .video-wrapper:hover {
            box-shadow:
                0 25px 50px rgba(0,0,0,0.85),
                0 0 55px rgba(var(--accent-rgb), 0.35),
                0 0 90px rgba(var(--accent2-rgb), 0.15);
        }
        .video-wrapper::after {
            content: 'ĐANG PHÁT';
            position: absolute;
            top: 14px;
            left: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 5px 12px;
            border-radius: 6px;
            box-shadow: 0 0 16px var(--accent-glow-strong);
            z-index: 3;
            animation: livePulse 2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes livePulse {
            0%, 100% { box-shadow: 0 0 16px var(--accent-glow-strong); }
            50% { box-shadow: 0 0 26px var(--accent-glow-strong), 0 0 40px rgba(var(--accent2-rgb), 0.6); }
        }

        video { width: 100%; height: 100%; outline: none; display: block; background: #000; }

        .video-info-box { margin-top: 22px; }
        .video-headline {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 14px;
            color: #fff;
            letter-spacing: -0.3px;
            line-height: 1.3;
        }
        .video-headline span {
            background: linear-gradient(90deg, #a5b4fc, #c4b5fd);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .video-description {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: 14px;
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.65;
            position: relative;
            overflow: hidden;
        }
        .video-description::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--accent), var(--accent-2));
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* SIDEBAR */
        .episodes-sidebar {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border);
            height: fit-content;
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }

        .sidebar-title {
            font-size: 17px;
            font-weight: 700;
            padding-bottom: 14px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-title span:last-child {
            font-size: 12px;
            color: #a5b4fc;
            background: rgba(var(--accent-rgb), 0.15);
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid rgba(var(--accent-rgb), 0.3);
        }

        .episodes-list-scroll {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
        }
        .episodes-list-scroll::-webkit-scrollbar { width: 6px; }
        .episodes-list-scroll::-webkit-scrollbar-track { background: transparent; }
        .episodes-list-scroll::-webkit-scrollbar-thumb {
            background: rgba(var(--accent-rgb), 0.3);
            border-radius: 4px;
        }
        .episodes-list-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(var(--accent-rgb), 0.6);
        }

        .ep-card-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .ep-card-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(3px);
            border-color: rgba(var(--accent-rgb), 0.3);
        }

        .ep-card-item.active {
            background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.2), rgba(var(--accent2-rgb), 0.08));
            border-color: var(--accent);
            box-shadow:
                0 0 20px rgba(var(--accent-rgb), 0.35),
                inset 0 0 20px rgba(var(--accent-rgb), 0.08);
        }
        .ep-card-item.active::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--accent), var(--accent-2));
            box-shadow: 0 0 10px var(--accent-glow-strong);
        }

        .ep-card-num {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 5px 9px;
            border-radius: 7px;
            box-shadow: 0 0 10px var(--accent-glow);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .ep-card-item.active .ep-card-num {
            box-shadow: 0 0 18px var(--accent-glow-strong);
        }

        .ep-card-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .ep-card-item i.fa-circle-play {
            color: var(--text-sub);
            transition: all 0.25s ease;
        }
        .ep-card-item:hover i.fa-circle-play,
        .ep-card-item.active i.fa-circle-play {
            color: var(--accent);
            filter: drop-shadow(0 0 6px var(--accent-glow));
            transform: scale(1.15);
        }

        /* LOADING SKELETON */
        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }
        .skeleton-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .skeleton-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: linear-gradient(90deg, #1a1d28 25%, #232736 50%, #1a1d28 75%);
            background-size: 200% 100%;
            animation: shimmerSkeleton 1.5s infinite;
        }
        .skeleton-meta { padding: 16px; }
        .skeleton-line {
            height: 12px;
            border-radius: 6px;
            background: linear-gradient(90deg, #1a1d28 25%, #232736 50%, #1a1d28 75%);
            background-size: 200% 100%;
            animation: shimmerSkeleton 1.5s infinite;
            margin-bottom: 10px;
        }
        .skeleton-line.short { width: 60%; }
        @keyframes shimmerSkeleton {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .loading-view {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-sub);
            font-size: 15px;
        }
        .loading-view i {
            font-size: 32px;
            color: var(--accent);
            margin-bottom: 12px;
            display: inline-block;
            filter: drop-shadow(0 0 15px var(--accent-glow));
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(239, 68, 68, 0.95);
            color: #fff;
            padding: 12px 22px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(239,68,68,0.4);
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 90vw;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* MOBILE */
        @media (max-width: 700px) {
            header { padding: 0 16px; height: 62px; }
            .brand-logo { font-size: 17px; gap: 9px; }
            .brand-logo .icon-wrapper { width: 32px; height: 32px; }
            .search-container { width: 48%; padding: 7px 14px; }
            .search-container input { font-size: 13px; }
            main { padding: 22px 16px; }
            .home-section-title { font-size: 19px; }
            .movies-grid, .skeleton-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
            .movie-meta { padding: 12px; }
            .movie-title { font-size: 14px; }
            .movie-desc { font-size: 12px; }
            .video-headline { font-size: 18px; }
        }

        /* LIQUID GLASS TAB BAR */
        :root { --accent-rgb: 99,102,241; --accent2-rgb: 168,85,247; --accent3-rgb: 236,72,153; --glass-acc: #a58cff; }

        main { padding-bottom: 130px; }
        body.has-mini main { padding-bottom: 200px; }
        body.reduce-motion .aurora-blob,
        body.reduce-motion .home-section-title i,
        body.reduce-motion .brand-logo .icon-wrapper::after { animation: none !important; }

        @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        #appContainer.view-in > * { animation: viewIn .35s cubic-bezier(.4,0,.2,1) both; }
        body.reduce-motion #appContainer.view-in > * { animation: none; }

        /* Glass nav */
        #glGlass { position: fixed; left: 0; bottom: 0; width: 100%; height: 120px; display: block; pointer-events: none; z-index: 901; }
        #glassNav {
            position: fixed; left: 14px; right: 14px;

    (function () {

                    return url.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('dropbox.com/s/', 'dropboxusercontent.com/s/');

                const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);

            if (/1drv\.ms|onedrive\.live\.com/i.test(url)) {

        let audioQueue = [], audioIdx = -1;

        function getEpisodes(m) {
            return m.episodes ? Object.values(m.episodes).sort((a, b) => (a.order || 0) - (b.order || 0)) : [];
        }

        function renderAudioScreen(filterQuery = '') {
            const q = (filterQuery || '').toLowerCase();
            audioGroups = {};

            // Đọc dữ liệu node MP3 Audio riêng (/audios) cùng node /movies
            const combinedData = { ...audiosDataset, ...moviesDataset };
            const mids = Object.keys(combinedData).filter(mid => (combinedData[mid].title || '').toLowerCase().includes(q));

            mids.forEach(mid => {
                const m = combinedData[mid];
                audioGroups[mid] = getEpisodes(m).map((ep, i) => ({
                    mid, ep: i, movie: m.title || '', title: ep.title || '', num: ep.order || i + 1,
                    url: ep.url || '', thumb: m.thumbnail || FALLBACK_THUMB
                }));
            });

            const withEps = mids.filter(mid => audioGroups[mid].length);
            if (withEps.length === 0) {
                appContainer.innerHTML = `
                    <div class="loading-view">
                        <i class="fa-solid fa-headphones"></i>
                        <div style="margin-top:10px;">Không có nội dung MP3 Audio phù hợp.</div>
                    </div>`;
                return;
            }

            let html = `<div class="page-title"><i class="fa-solid fa-headphones"></i> Nghe Audio MP3 Playlist</div>`;
            withEps.forEach(mid => {
                const items = audioGroups[mid];
                html += `
                    <div class="audio-group">
                        <div class="audio-group-head">
                            <img src="${esc(items[0].thumb)}" alt="" loading="lazy" onerror="this.src='${FALLBACK_THUMB}'">
                            <div class="t">${esc(items[0].movie)}</div>
                            <span class="c">${items.length} Bài MP3</span>
                        </div>
                        <div class="list">
                            ${items.map((it, i) => `
                                <div class="ep-card-item audio-item" data-mid="${esc(mid)}" data-i="${i}">
                                    <span class="ep-card-num">Tập ${it.num}</span>
                                    <span class="ep-card-title">${esc(it.title)}</span>
                                    <i class="fa-solid fa-circle-play"></i>
                                </div>`).join('')}
                        </div>
                    </div>`;
            });
            appContainer.innerHTML = html;

            appContainer.querySelectorAll('.audio-item').forEach(el => {
                el.addEventListener('click', () => {
                    window.__pendingAuthCallback = () => {
                        audioQueue = audioGroups[el.dataset.mid];
                        loadAudio(parseInt(el.dataset.i), true);
                    };
                    requireUserAuth(window.__pendingAuthCallback);
                });
            });
            markPlaying();
        }

        function markPlaying() {
            const cur = audioQueue[audioIdx];
            document.querySelectorAll('.audio-item').forEach(el => {
                const on = !!cur && cur.mid === el.dataset.mid && parseInt(el.dataset.i) === audioIdx;
                el.classList.toggle('active', on);
                el.classList.toggle('playing', on);
            });
        }

        function loadAudio(i, autoplay) {
            const it = audioQueue[i];
            if (!it) return;
            audioIdx = i;

            const key = 'audio_' + it.mid + '_' + i;
            const saved = progress[key];

            audioEl.defaultPlaybackRate = settings.speed;
            audioEl.src = normalizeVideoUrl(it.url);
            audioEl.playbackRate = settings.speed;

            audioEl.addEventListener('loadedmetadata', () => {
                if (settings.resume && saved && saved.t > 3 && saved.d && saved.t < saved.d - 5) {
                    audioEl.currentTime = saved.t;
                }
            }, { once: true });

            mini.thumb.src = it.thumb;
            mini.title.textContent = it.title || ('Bài MP3 ' + it.num);
            mini.sub.textContent = it.movie;
            mini.seek.value = 0;
            document.body.classList.add('has-mini');

            if (autoplay) audioEl.play().catch(() => {});
            markPlaying();
        }

        function setPlayIcon() {
            mini.play.innerHTML = `<i class="fa-solid fa-${audioEl.paused ? 'play' : 'pause'}"></i>`;
        }

        audioEl.addEventListener('play', () => {
            setPlayIcon();
            const v = document.getElementById('streamPlayer');
            if (v && !v.paused) v.pause();
        });

        audioEl.addEventListener('pause', setPlayIcon);

        audioEl.addEventListener('timeupdate', () => {
            if (document.activeElement !== mini.seek && audioEl.duration) {
                mini.seek.value = (audioEl.currentTime / audioEl.duration) * 100;
            }
            if (audioQueue[audioIdx] && audioEl.duration) {
                const it = audioQueue[audioIdx];
                const key = 'audio_' + it.mid + '_' + audioIdx;
                progress[key] = { mid: it.mid, ep: audioIdx, t: audioEl.currentTime, d: audioEl.duration, u: Date.now(), mt: it.movie, et: it.title, th: it.thumb };
                store.set('dt_progress', progress);
            }
        });

        audioEl.addEventListener('ended', () => {
            if (audioIdx + 1 < audioQueue.length) {
                showToast(`🎵 Đang phát tiếp Bài ${audioQueue[audioIdx + 1].num}...`);
                loadAudio(audioIdx + 1, true);
            } else {
                showToast('🎧 Bạn đã nghe hết playlist audio này!');
            }
        });

        audioEl.addEventListener('error', () => {
            if (audioEl.getAttribute('src')) showToast('⚠️ Không phát được audio MP3. Kiểm tra lại đường dẫn file.');
        });

        mini.play.addEventListener('click', () => { audioEl.paused ? audioEl.play().catch(() => {}) : audioEl.pause(); });
        mini.prev.addEventListener('click', () => {
            if (audioEl.currentTime > 4 || audioIdx <= 0) audioEl.currentTime = 0; else loadAudio(audioIdx - 1, true);
        });
        mini.next.addEventListener('click', () => {
            if (audioIdx + 1 < audioQueue.length) loadAudio(audioIdx + 1, true);
        });
        mini.close.addEventListener('click', () => {
            audioEl.pause(); audioEl.removeAttribute('src'); audioEl.load();
            audioIdx = -1; document.body.classList.remove('has-mini'); markPlaying();
        });
        mini.seek.addEventListener('input', () => {
            if (audioEl.duration) audioEl.currentTime = (mini.seek.value / 100) * audioEl.duration;
        });

        /* SETTINGS TAB */
        function clearHistory() {
            customConfirm('Xóa Lịch Sử', 'Bạn có chắc chắn muốn xóa toàn bộ lịch sử đã xem không?', () => {
                progress = {}; store.set('dt_progress', progress);
                showToast('✅ Đã xóa toàn bộ lịch sử xem.');
                if (currentTab === 'profile') renderProfileScreen();
            });
        }

        const GS = { W: 80, H: 50, R: 25, BEZ: 18, IDLE: .64, ready: false };
        function gsEnsureFilter() {
            if (GS.ready) return; GS.ready = true;
            const { W, H, R, BEZ } = GS;
            const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
            const cx = cv.getContext('2d'), im = cx.createImageData(W, H);
            for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
                const px = i + .5 - W / 2, py = j + .5 - H / 2;
                const qx = Math.abs(px) - (W / 2 - R), qy = Math.abs(py) - (H / 2 - R);
                const ox = Math.max(qx, 0), oy = Math.max(qy, 0), len = Math.hypot(ox, oy);
                const d = len + Math.min(Math.max(qx, qy), 0) - R; let r = 128, g = 128;
                if (d < 0 && -d < BEZ) {
                    const m = Math.pow(1 + d / BEZ, 2.2); let nx, ny;
                    if (len > 0) { nx = Math.sign(px) * ox / len; ny = Math.sign(py) * oy / len; }
                    else if (qx > qy) { nx = Math.sign(px); ny = 0; } else { nx = 0; ny = Math.sign(py); }
                    r = 128 - nx * m * 127; g = 128 - ny * m * 127;
                }
                const k = (j * W + i) * 4; im.data[k] = r; im.data[k + 1] = g; im.data[k + 2] = 128; im.data[k + 3] = 255;
            }
            cx.putImageData(im, 0, 0);
            const wrap = document.createElement('div');
            wrap.innerHTML = '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="gsRefr" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">'
                + '<feImage x="0" y="0" width="' + W + '" height="' + H + '" preserveAspectRatio="none" result="m" href="' + cv.toDataURL() + '"/>'
                + '<feDisplacementMap in="SourceGraphic" in2="m" scale="36" xChannelSelector="R" yChannelSelector="G"/></filter></svg>';
            document.body.appendChild(wrap.firstChild);
        }

        function initGlassSlider(zone, { min, max, step, value, onChange, onValue }) {
            gsEnsureFilter();
            const { W, IDLE } = GS, PAD = W * IDLE / 2;
            const thumb = zone.querySelector('.gs-thumb'), pill = zone.querySelector('.gs-pill'),
                  glass = zone.querySelector('.gs-glass'), fill = zone.querySelector('.gs-fill');
            const sp = (v, k, c) => ({ x: v, v: 0, t: v, k, c });
            const stepS = (s, dt) => { s.v += (-s.k * (s.x - s.t) - s.c * s.v) * dt; s.x += s.v * dt; };
            const px = sp(0, 600, 34), sc = sp(IDLE, 260, 15);
            const span = () => zone.clientWidth - 2 * PAD;
            const snap = v => Math.min(max, Math.max(min, Math.round((v - min) / step) * step + min));
            const toFrac = v => (v - min) / (max - min);
            let down = false, cur = value, frac = toFrac(value), running = false, prev = 0;
            px.x = px.t = PAD + frac * span();
            const wake = () => { if (!running) { running = true; prev = performance.now(); requestAnimationFrame(frame); } };
            function setFrom(cx) {
                const r = zone.getBoundingClientRect();
                frac = Math.min(Math.max((cx - r.left - PAD) / (r.width - 2 * PAD), 0), 1);
                if (frac > .985) frac = 1; if (frac < .015) frac = 0;
                px.t = PAD + frac * span();
                const v = snap(min + frac * (max - min));
                if (v !== cur) { cur = v; onValue && onValue(v); onChange && onChange(v); }
                wake();
            }
            zone.addEventListener('pointerdown', e => { down = true; zone.setPointerCapture(e.pointerId); setFrom(e.clientX); });
            zone.addEventListener('pointermove', e => { if (down) setFrom(e.clientX); });
            const up = () => { if (!down) return; down = false; frac = toFrac(cur); px.t = PAD + frac * span(); wake(); };
            zone.addEventListener('pointerup', up); zone.addEventListener('pointercancel', up);
            function frame(now) {
                if (!zone.isConnected) { running = false; return; }
                const dt = Math.min((now - prev) / 1000, .033); prev = now;
                sc.t = down ? 1 : IDLE; stepS(px, dt); stepS(sc, dt);
                const p = Math.min(Math.max((sc.x - IDLE) / (1 - IDLE), 0), 1);
                const q = Math.min(Math.abs(px.v) / 5000, .07);
                thumb.style.transform = 'translate(' + (px.x - W / 2) + 'px,0) scale(' + (sc.x * (1 + q)) + ',' + (sc.x * (1 - q * .7)) + ')';
                pill.style.opacity = 1 - Math.min(p * 1.6, 1); glass.style.opacity = Math.min(p * 1.4, 1);
                fill.style.width = px.x + 'px';
                const rest = !down && Math.abs(px.v) < .05 && Math.abs(px.x - px.t) < .05 && Math.abs(sc.v) < .001 && Math.abs(sc.x - sc.t) < .001;
                if (rest) { running = false; return; }
                requestAnimationFrame(frame);
            }
            wake();
        }

        function renderSettingsScreen() {
            const sw = (id, label, sub) => `
                <div class="set-row">
                    <div><div class="lbl">${label}</div><div class="sub">${sub}</div></div>
                    <div class="lg-switch" role="switch" tabindex="0" data-set="${id}" data-on="${settings[id] ? 1 : 0}" aria-checked="${settings[id] ? 'true' : 'false'}" aria-label="${label}"><div class="lg-tr"><i></i></div><div class="lg-th"><div class="lg-pill"></div><div class="lg-glass"></div></div></div>
                </div>`;
            appContainer.innerHTML = `
                <div class="page-title"><i class="fa-solid fa-gear"></i> Cài Đặt</div>

                <div class="panel">
                    <div class="panel-head">Trình phát</div>
                    ${sw('autoplay', 'Tự động phát', 'Phát ngay khi mở một tập phim.')}
                    ${sw('autoNext', 'Tự chuyển tập kế tiếp', 'Hết tập thì sang tập sau.')}
                    ${sw('resume', 'Xem tiếp từ vị trí cũ', 'Nhớ thời điểm bạn dừng ở mỗi tập.')}
                    <div class="set-row gs-row">
                        <div class="gs-top">
                            <div><div class="lbl">Tốc độ phát mặc định</div><div class="sub">Áp dụng cho video và âm thanh.</div></div>
                            <span class="gs-val" id="gsVal">${settings.speed}x</span>
                        </div>
                        <div class="gs-zone" id="setSpeed">
                            <div class="gs-track"><div class="gs-fill"></div></div>
                            <div class="gs-thumb"><div class="gs-pill"></div><div class="gs-glass"></div></div>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-head">Giao diện</div>
                    <div class="set-row">
                        <div><div class="lbl">Màu nhấn</div><div class="sub">Đổi màu toàn bộ giao diện và thanh tab.</div></div>
                        <div class="swatches">
                            ${Object.entries(ACCENTS).map(([k, c]) => `
                                <div class="swatch ${k === settings.accent ? 'on' : ''}" data-acc="${k}" title="${k}"
                                     style="background:linear-gradient(135deg,${c[0]},${c[1]});color:${c[0]}"></div>`).join('')}
                        </div>
                    </div>
                    ${sw('reduceMotion', 'Giảm hiệu ứng chuyển động', 'Tắt aurora và animation để mượt hơn trên máy yếu.')}
                </div>

                <div class="panel">
                    <div class="panel-head">Dữ liệu</div>
                    <div class="set-row">
                        <div><div class="lbl">Lịch sử xem</div><div class="sub">Lưu trên thiết bị này.</div></div>
                        <button class="dt-btn danger" id="btnClearHist">Xoá lịch sử</button>
                    </div>
                    <div class="set-row">
                        <div><div class="lbl">Khôi phục mặc định</div><div class="sub">Đưa mọi cài đặt về ban đầu.</div></div>
                        <button class="dt-btn" id="btnResetSet">Khôi phục</button>
                    </div>
                </div>
            `;

            appContainer.querySelectorAll('.lg-switch[data-set]').forEach(el => {
                initGlassSwitch(el, {
                    value: el.dataset.on === '1',
                    onChange: v => {
                        settings[el.dataset.set] = v;
                        saveSettings();
                        if (el.dataset.set === 'reduceMotion') applyTheme();
                    }
                });
            });
            initGlassSlider(document.getElementById('setSpeed'), {
                min: 0.5, max: 2, step: 0.25, value: settings.speed,
                onValue: v => { document.getElementById('gsVal').textContent = v + 'x'; },
                onChange: v => {
                    settings.speed = v;
                    audioEl.defaultPlaybackRate = audioEl.playbackRate = settings.speed;
                    saveSettings();
                }
            });
            appContainer.querySelectorAll('.swatch').forEach(el => {
                el.addEventListener('click', () => {
                    settings.accent = el.dataset.acc; saveSettings(); applyTheme();
                    appContainer.querySelectorAll('.swatch').forEach(s => s.classList.toggle('on', s === el));
                });
            });
            document.getElementById('btnClearHist').addEventListener('click', clearHistory);
            document.getElementById('btnResetSet').addEventListener('click', () => {
                customConfirm('Khôi Phục', 'Bạn có muốn đưa toàn bộ cài đặt về trạng thái mặc định không?', () => {
                    settings = { ...DEFAULTS }; saveSettings(); applyTheme();
                    audioEl.defaultPlaybackRate = audioEl.playbackRate = 1;
                    renderSettingsScreen();
                    showToast('✅ Đã khôi phục cài đặt mặc định.');
                });
            });
        }

        /* PROFILE TAB */
        function renderProfileScreen() {
            const entries = Object.values(progress);
            const byMovie = {};
            entries.forEach(e => { if (!byMovie[e.mid] || e.u > byMovie[e.mid].u) byMovie[e.mid] = e; });
            const hist = Object.values(byMovie).sort((a, b) => b.u - a.u);
            const hours = entries.reduce((s, e) => s + (e.t || 0), 0) / 3600;
            const initial = (profile.name || 'K').trim().charAt(0).toUpperCase() || 'K';

            appContainer.innerHTML = `
                <div class="page-title"><i class="fa-solid fa-user"></i> Hồ Sơ Người Dùng</div>
                <div class="profile-card">
                    <div class="avatar" id="avatarBox">${esc(initial)}</div>
                    <div style="flex:1;min-width:0;">
                        <input class="dt-input" id="profileName" maxlength="24" value="${esc(profile.name)}" placeholder="Tên của bạn">
                        <div class="hint">${currentUser ? 'Tài khoản đang đăng nhập: ' + esc(currentUser) : 'Đang dùng tài khoản Khách. Chạm để sửa tên.'}</div>
                    </div>
                    ${currentUser ? `<button class="dt-btn danger" id="btnLogoutUser">Đăng xuất</button>` : `<button class="dt-btn" id="btnLoginUser">Đăng nhập</button>`}
                </div>
                <div class="stats">
                    <div class="stat"><b>${hist.length}</b><span>Đã trải nghiệm</span></div>
                    <div class="stat"><b>${entries.length}</b><span>Tập đã phát</span></div>
                    <div class="stat"><b>${hours < 10 ? hours.toFixed(1) : Math.round(hours)}</b><span>Giờ thưởng thức</span></div>
                </div>
                <div class="section-sub">Thưởng thức gần đây</div>
                ${hist.length ? `<div class="hist-list">${hist.map(e => {
                    const pct = e.d ? Math.min(100, Math.round(e.t / e.d * 100)) : 0;
                    return `
                    <div class="hist-item" onclick="window.playMovieEpWithAuth('${esc(e.mid)}', ${e.ep})">
                        <img src="${esc(e.th || FALLBACK_THUMB)}" alt="" loading="lazy" onerror="this.src='${FALLBACK_THUMB}'">
                        <div style="flex:1;min-width:0;">
                            <div class="t">${esc(e.mt)}</div>
                            <div class="s">Tập ${e.ep + 1}${e.et ? ' — ' + esc(e.et) : ''} · ${fmtTime(e.t)} / ${fmtTime(e.d)}</div>
                            <div class="hist-bar"><i style="width:${pct}%"></i></div>
                        </div>
                        <i class="fa-solid fa-circle-play" style="color:var(--accent);font-size:20px;"></i>
                    </div>`;
                }).join('')}</div>
                <div style="margin-top:16px;"><button class="dt-btn danger" id="btnClearHist2">Xoá lịch sử xem</button></div>`
                : `<div class="loading-view" style="padding:40px 20px;max-width:760px;"><i class="fa-solid fa-clock-rotate-left"></i><div style="margin-top:10px;">Bạn chưa xem nội dung nào. Mở một tập ở tab Video hoặc Audio để bắt đầu.</div></div>`}
            `;

            const nameInput = document.getElementById('profileName');
            nameInput.addEventListener('input', () => {
                document.getElementById('avatarBox').textContent = (nameInput.value.trim().charAt(0) || 'K').toUpperCase();
            });
            nameInput.addEventListener('change', () => {
                profile.name = nameInput.value.trim() || 'Khách';
                nameInput.value = profile.name;
                store.set('dt_profile', profile);
                showToast('✅ Đã lưu thông tin hồ sơ.');
            });

            const b2 = document.getElementById('btnClearHist2');
            if (b2) b2.addEventListener('click', clearHistory);

            const btnL = document.getElementById('btnLoginUser');
            if (btnL) btnL.onclick = () => document.getElementById('authModal').classList.add('show');

            const btnOut = document.getElementById('btnLogoutUser');
            if (btnOut) btnOut.onclick = () => {
                customConfirm('Đăng Xuất', 'Bạn có chắc chắn muốn đăng xuất khỏi tài khoản hiện tại?', () => {
                    currentUser = null;
                    localStorage.removeItem('dt_user_account');
                    profile.name = 'Khách';
                    store.set('dt_profile', profile);
                    renderProfileScreen();
                    showToast('Đã đăng xuất tài khoản.');
                });
            };
        }

        /* SEARCH DEBOUNCE */
        let searchDebounce;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchDebounce);
            const q = e.target.value;
            if (currentTab === 'audio') {
                searchDebounce = setTimeout(() => renderAudioScreen(q), 180);
                return;
            }
            if (currentTab !== 'video') window.liquidGlass.setTab('video', true);
            if (movieId) {
                searchDebounce = setTimeout(() => { window.location.href = 'index.html'; }, 400);
                return;
            }
            searchDebounce = setTimeout(() => renderHomeScreen(q), 180);
        });

        /* KHỞI TẠO TAB */
        applyTheme();
        window.liquidGlass.setTab(currentTab, false);
        if (currentTab === 'settings' || currentTab === 'profile') renderCurrent();
    </script>
</body>
